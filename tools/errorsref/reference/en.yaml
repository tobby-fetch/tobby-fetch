        text: "[Metrics and logs](../../reference/metrics-logs/)."

  TBY-SRV-002:
    offline: "yes"
    blocks: "the request only"

  TBY-SRV-003:
    offline: "yes"
    blocks: "the browser session's view only"
    details:
      - text: "A client-side condition rendered by the UI shell on transport failure, never served by the instance itself; it is catalogued so that this guide documents it."

  TBY-SRV-004:
    offline: "yes"
    blocks: "the request only"
    details:
      - text: "Every API endpoint has a bound sized to its largest legitimate document: see the [input validation](../../security/input-validation/) table (NFR-023)."

  TBY-SRV-005:
    offline: "yes"
    blocks: "the request only"
    details:
      - text: "A request carrying no `Content-Type` is refused the same way. Every API endpoint that reads a document decodes `application/json`."
