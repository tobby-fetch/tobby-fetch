  TBY-MED-033:
    offline: "oui"
    blocks: "cette requête seulement"
    details:
      - text: "Une fois la porte ouverte, `/v2/` et `/files/` servent les artefacts, signatures, ingrédients et signatures propres des ingrédients des recipes poussables. Un tag ajouté ou déplacé après la vérification et toute écriture sont refusés."

  TBY-MED-034:
    offline: "oui"
    blocks: "la registry embarquée et la surface de fichiers, pour ce support"
    details:
      - text: "Le verdict est *poussable*, sans rien à pousser. Un tel support ouvrait auparavant la porte et servait tout son store."

