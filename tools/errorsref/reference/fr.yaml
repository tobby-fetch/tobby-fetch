  TBY-SCN-025:
    offline: "oui"
    blocks: "rien"

  TBY-SCN-026:
    offline: "oui"
    blocks: "rien par lui-même — la vulnérabilité est jugée sans la dérogation"

  TBY-SCN-027:
    offline: "oui"
    blocks: "le démarrage de l'instance"

  TBY-SCN-028:
    offline: "oui"
    blocks: "rien — la dérogation s'applique et est signalée sans limite"

  TBY-DST-001:
    offline: "oui"
    blocks: "le push de cette référence seulement"
    details:
      - text: "La limite est typiquement une contrainte de longueur ou de nommage. Les réglages qui façonnent le chemin sont `destination.basePath` et `storage.basePrefix`."

  TBY-CHT-001:
    offline: "non (le chart doit être ré-empaqueté là où il est construit)"
    blocks: "l'import de ce chart"

  TBY-STO-001:
    offline: "oui"
    blocks: "l'opération concernée ; une condition persistante affecte toute l'instance"
    details:
      - text: "Causes typiques : un volume démonté, les permissions, une erreur d'E/S."

  TBY-STO-002:
    offline: "oui"
    blocks: "l'opération concernée ; une condition persistante affecte toute l'instance"
    details:
      - text: "Le plus souvent l'espace libre ou les permissions."

  TBY-STO-003:
    offline: "oui"
    blocks: "les transferts reprenables concernés"
    details:
      - text: "Volontairement distinct de [TBY-STO-002](#tby-sto-002) : le répertoire d'état et le store ont des propriétaires, des dimensionnements et des corrections différents."

  TBY-STO-004:
    offline: "oui"
    blocks: "la synchronisation ou l'export concerné ; rien n'est écrit"
    details:
      - text: "La marge de sécurité est `preflight.safetyMarginPercent`, 10 % par défaut."
      - text: "`preflight.disabled: true` supprime entièrement la vérification et l'annonce au démarrage."

  TBY-STO-005:
    offline: "oui"
    blocks: "la synchronisation ou l'export concerné ; en cours d'écriture, le store reste intact"
    details:
      - text: "Le cas typique est FAT32, limité à 4 Gio moins un octet. Une archive tar d'export compte pour un seul fichier."
      - text: "Le même code est émis quand la condition survient en cours d'écriture plutôt qu'au pré-vol : support échangé entre les deux, ou système de fichiers que ce build n'a pas su identifier."

  TBY-STO-006:
    offline: "oui"
    blocks: "rien — le store est intact"
    details:
      - text: "Le journal d'audit est conservé lui aussi : une trace qu'une action destructrice efface n'est pas une trace."

  TBY-MED-001:
    offline: "oui"
    blocks: "le support entier, sans dérogation"

  TBY-MED-002:
