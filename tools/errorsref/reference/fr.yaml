    blocks: "l'origine réseau, temporairement"
    details:
      - text: "Le contrôle coûteux est un calcul argon2id."

  TBY-AUTH-013:
    offline: "oui"
    blocks: "la requête ; le jeton reste refusé"

  TBY-AUTH-014:
    offline: "oui"
    blocks: "la tentative de connexion"

  TBY-AUTH-015:
    offline: "oui"
    blocks: "la tentative de connexion"

  TBY-AUTH-016:
    offline: "selon : la connexion locale fonctionne hors-ligne ; la connexion fédérée a besoin du fournisseur"
    blocks: "la connexion fédérée seulement"

  TBY-AUTH-017:
    offline: "oui"
    blocks: "la tentative de connexion"

  TBY-AUTH-018:
    offline: "oui"
    blocks: "l'ouverture d'une connexion fédérée depuis cette adresse, quelques secondes ; les comptes locaux et les tokens ne sont pas touchés"

  TBY-AUTH-019:
    offline: "oui"
    blocks: "la création de ce compte ou de ce token"

  TBY-CFG-001:
    offline: "oui"
    blocks: "toute l'instance (refus de démarrage) ou la commande qui a chargé la configuration"
    details:
      - label: "Voir aussi"
        text: "Voir la [référence de configuration](../../reference/configuration/)."

  TBY-CFG-002:
    offline: "oui"
    blocks: "l'instance entière (refus au démarrage)"
    details:
      - text: "Les réglages contrôlés sont `state.root`, `registries.credentialsFile` et `server.tls.keyFile`, chacun par rapport à `storage.root` (NFR-020)."

  TBY-NET-001:
    offline: "oui"
    blocks: "toute l'instance (refus de démarrage)"

  TBY-NET-002:
    offline: "oui"
    blocks: "toute l'instance (refus de démarrage)"

  TBY-NET-003:
    offline: "oui"
    blocks: "toute l'instance (refus de démarrage)"

  TBY-NET-004:
    offline: "oui"
    blocks: "le remplacement soumis seulement — l'instance continue de servir"
    details:
      - text: "Émis pour un remplacement de certificat soumis depuis les surfaces d'administration."

  TBY-VAL-001:
    offline: "oui"
    blocks: "le fichier soumis / la recipe concernée"
    details:
      - label: "Voir aussi"
        text: "La grammaire normative est sur le [site de la spécification](https://tobby-fetch.github.io/recipe-spec/)."

  TBY-REG-001:
    offline: "oui"
    blocks: "l'opération utilisant cette référence"

  TBY-REG-002:
    offline: "non (il faut la route réseau vers la source)"
    blocks: "la tâche concernée ; réessayée avec repli borné"

  TBY-REG-003:
    offline: "non (la correction de configuration est locale, mais le nouvel essai exige le registre source)"
    blocks: "la tâche concernée"

  TBY-REG-004:
    offline: "non (il faut la réponse de la source)"
    blocks: "l'inspection ou l'import concerné"
    details:
      - text: "Volontairement distinct d'« injoignable »."

  TBY-REG-005:
    offline: "non (la vérité est sur le registre source)"
    blocks: "la tâche concernée"

  TBY-REG-006:
    offline: "non (la résolution exige la liste des tags de la source)"
    blocks: "la recipe ou l'ingrédient concerné"

  TBY-REG-007:
    offline: "non (côté source ; le contournement `resumeThreshold: 0` est local)"
    blocks: "la tâche concernée"
    details:
      - text: "Causes typiques : un 206 démarrant au mauvais octet, un `Content-Range` contredisant le manifeste, une plage refusée, ou un contenu qui a changé entre deux essais."
      - text: "Opérationnel, pas un verdict de vérification : rien n'a été prouvé faux sur le contenu — la conversation à son sujet s'est rompue."

  TBY-REG-008:
    offline: "non (la vérité est dans l'index de la source)"
    blocks: "l'ingrédient concerné"
    details:
      - text: "Les registres décrivent couramment leur enfant arm64 comme `linux/arm64` avec le variant `v8` : un sélecteur nommant un variant que la source ne publie pas ne correspond à rien."

  TBY-POL-001:
    offline: "oui"
    blocks: "tout transfert touchant cet hôte, avant toute donnée ; levé par une modification de configuration auditée"

  TBY-POL-002:
    offline: "oui"
    blocks: "la demande de suppression seulement"

  TBY-POL-003:
    offline: "oui"
    blocks: "la demande de suppression seulement"

  TBY-POL-004:
    offline: "non (une nouvelle version signée vient de la chaîne de qualification)"
    blocks: "la publication seulement ; jamais dérogeable"
    details:
      - text: "Republier le document identique est un no-op, pas cette erreur."

  TBY-POL-005:
    offline: "oui"
    blocks: "l'import ou l'empaquetage ; les synchronisations de recipes ne sont pas concernées"
    details:
      - label: "Où"
        text: "l'écran d'import et `POST /api/v1/import` avec son inspection (HTTP 403), l'empaquetage de FileSets à l'écran, par l'API et par `tobby fileset pack` ; chaque refus est un événement d'audit `hardening.refused` qui nomme le réglage"

  TBY-POL-006:
    offline: "oui"
    blocks: "le push ; les tirages et les synchronisations de recipes ne sont pas concernés"
    details:
      - label: "Où"
        text: "toute écriture sur `/v2/` — upload de blob, morceau, validation, montage, push de manifeste, suppression — pour tous les clients et tous les rôles, administrateurs compris, sous la forme de l'erreur OCI `DENIED` (HTTP 403) dont le message commence par le code, que `docker`, `helm`, `oras` et `skopeo` affichent ; chaque refus est un événement d'audit `hardening.refused` qui nomme le réglage"

  TBY-SIG-001:
    offline: "oui, quand la bonne clé publique est disponible localement (les clés de confiance sont la configuration de la destination) ; une recipe réellement non signée ou mal signée doit être re-signée en amont"
    blocks: "la recipe concernée ; jamais dérogeable"
    details:
      - label: "Ingrédients"
        text: "la signature propre d'un ingrédient ne lève ce code que sur une instance qui règle `trust.requireIngredientSignatures: true`. Le sujet se lit alors *ingredient \\<nom\\> of \\<recipe\\> (\\<dépôt\\>@\\<digest\\>)*, les empreintes sont celles des clés applicables à l'ingrédient (ou « no signature artifact found »), et la recipe entière est retenue. Sans ce réglage, une signature d'ingrédient non vérifiable est consignée et ne bloque rien."
      - text: "Quand toutes les clés configurées sont réservées, rien n'est essayé et le message le dit."
      - label: "Voir aussi"
        text: "[Signatures, clés de confiance et liste blanche](../../security/content-trust/)."

  TBY-SIG-002:
    offline: "non"
    blocks: "l'ingrédient ou la recipe concerné ; jamais dérogeable"

  TBY-SIG-003:
    offline: "non"
    blocks: "l'ingrédient ou la recipe concerné ; jamais dérogeable"
    details:
      - text: "C'est la garde contre la réutilisation de tag et la confusion de dépôt."

  TBY-SCN-001:
    offline: "oui, une fois la recipe tobby-system transférée"
    blocks: "l'analyse ; en mode bloquant, tout push"

  TBY-SCN-002:
    offline: "oui"
    blocks: "l'analyse"

  TBY-SCN-003:
    offline: "oui, une fois la recipe tobby-system transférée"
    blocks: "l'analyse ; en mode bloquant, tout push"

  TBY-SCN-004:
    offline: "oui, une fois une base fraîche transférée"
    blocks: "rien en mode avertir ; le push de l'élément en mode bloquer"

  TBY-SCN-005:
    offline: "non : le correctif vient de l'amont, ou d'une exception décidée par la zone"
    blocks: "l'élément et sa recipe"

  TBY-SCN-006:
    offline: "oui"
    blocks: "rien"

  TBY-SCN-007:
    offline: "oui"
    blocks: "l'élément en mode bloquer ; rien en mode avertir"

  TBY-SCN-008:
    offline: "oui"
    blocks: "les éléments analysés avec elle sous `scan.maxDbAgeAction: block` ; rien en mode avertir"
    details:
      - text: "Une date de construction en avance d'une heure au plus est tolérée comme décalage d'horloge."

  TBY-SCN-020:
    offline: "oui"
    blocks: "rien"

  TBY-SCN-021:
    offline: "oui"
    blocks: "rien en soi"

  TBY-SCN-022:
    offline: "oui"
    blocks: "rien"

  TBY-SCN-023:
