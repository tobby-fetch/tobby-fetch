    blocks: "le bundle — jamais livré avec un secret dedans"

  TBY-DIA-003:
    offline: "oui"
    blocks: "ce bundle seulement — rien n'a été écrit ni envoyé"

  TBY-CLK-001:
    offline: "oui"
    blocks: "rien — un avertissement, consigné au journal d'audit"

  TBY-CLK-002:
    offline: "oui"
    blocks: "rien — un avertissement, consigné au journal d'audit"

  TBY-STA-001:
    offline: "oui"
    blocks: "le démarrage de l'instance"

  TBY-STA-002:
    offline: "oui"
    blocks: "le démarrage de l'instance"

  TBY-STA-003:
    offline: "oui"
    blocks: "rien par lui-même — l'instance démarre sans l'entrée"

  TBY-TSK-001:
    offline: "oui"
    blocks: "la requête seulement"

  TBY-SRV-001:
    offline: "oui (le diagnostic est local)"
    blocks: "la requête seulement"
    details:
      - label: "Voir aussi"
        text: "[Métriques et logs](../../reference/metrics-logs/)."

  TBY-SRV-002:
    offline: "oui"
    blocks: "la requête seulement"

  TBY-SRV-003:
    offline: "oui"
    blocks: "l'affichage de la session de navigation seulement"
    details:
      - text: "Une condition côté client, rendue par la coquille de l'interface sur échec de transport — jamais servie par l'instance elle-même ; cataloguée pour que ce guide la documente."

  TBY-SRV-004:
    offline: "oui"
    blocks: "la requête seulement"
    details:
      - text: "Chaque point d'accès de l'API a une borne dimensionnée sur son plus grand document légitime : voir le tableau de [validation des entrées](../../security/input-validation/) (NFR-023)."

  TBY-SRV-005:
    offline: "oui"
    blocks: "la requête seulement"
    details:
      - text: "Une requête sans `Content-Type` est refusée de la même façon. Tous les points d'accès de l'API qui lisent un document décodent `application/json`."
