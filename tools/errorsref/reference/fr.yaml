codes:
  TBY-AUTH-001:
    offline: "oui"
    blocks: "toute l'instance (refus de démarrage sécurisé par défaut)"

  TBY-AUTH-002:
    offline: "oui"
    blocks: "la tentative de connexion seulement"
    details:
      - text: "Le message est volontairement sans paramètre : il ne révèle jamais si le compte existe."

  TBY-AUTH-003:
    offline: "oui"
    blocks: "l'action, pour cette session"

  TBY-AUTH-004:
    offline: "oui"
    blocks: "la requête soumise seulement"
    details:
      - text: "Toute requête qui modifie l'état et que la session du navigateur authentifie porte le jeton, formulaires de l'interface comme appels d'API (en-tête `X-CSRF-Token` sur l'API), et elle est refusée quand le navigateur indique qu'elle vient d'une autre origine."

  TBY-AUTH-005:
    offline: "oui"
    blocks: "la session seulement"
    details:
      - text: "Le délai d'inactivité est `auth.session.idleTimeout` (30 min par défaut) et la durée de vie absolue `auth.sessionTTL` (12 h par défaut). Les sessions vivent en mémoire, d'où le cas du redémarrage."
      - text: "Chaque expiration est consignée par un événement d'audit `session.expire` avec sa raison, `idle` ou `lifetime`."

  TBY-AUTH-006:
    offline: "oui"
    blocks: "le changement de mot de passe seulement"

  TBY-AUTH-007:
    offline: "oui"
    blocks: "le changement de mot de passe seulement"

  TBY-AUTH-008:
    offline: "oui"
    blocks: "l'opération sur le compte seulement"

  TBY-AUTH-009:
    offline: "oui"
    blocks: "la création du compte seulement"

  TBY-AUTH-010:
    offline: "oui"
    blocks: "l'opération sur le compte seulement"

  TBY-AUTH-011:
    offline: "oui"
    blocks: "la suppression ou la rétrogradation seulement"

  TBY-AUTH-012:
