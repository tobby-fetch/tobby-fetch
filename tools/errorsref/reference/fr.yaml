    details:
      - text: "Cela couvre la comptabilité interne du store hors graphe de recipes, dont l'altération bloque le support entier ([TBY-MED-005](#tby-med-005))."

  TBY-MED-023:
    offline: "oui"
    blocks: "rien (signalé seulement)"
    details:
      - text: "L'instance source servait des FileSets depuis ce store."
      - text: "Tout ce qui, dessous, n'a pas la forme d'une extraction est signalé à part en [TBY-MED-020](#tby-med-020)."

  TBY-MED-030:
    offline: "oui"
    blocks: "la registry embarquée et la surface de fichiers, pour ce support"
    details:
      - text: "FR-054 exige que la vérification précède toute poussée, tout service et toute écriture locale : `/v2/` et `/files/` restent donc fermés tant qu'elle n'a pas eu lieu."
