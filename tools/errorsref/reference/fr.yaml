    details:
      - text: "Causes typiques : pas de marqueur `oci-layout`, un `index.json` qui ne s'analyse pas, ou un blob dont l'empreinte ne correspond pas au digest qui l'adresse."
      - text: "Tobby lit une archive non compressée en se positionnant sur un décalage de blob enregistré, ce qui ne laisse rien à déployer à une bombe de décompression."

  TBY-LAY-002:
    offline: "oui"
    blocks: "l'import concerné ; rien n'est écrit"
    details:
      - text: "C'est un échec de vérification, pas un transfert abîmé."

  TBY-LAY-003:
    offline: "oui"
    blocks: "l'export concerné ; rien n'est écrit"
    details:
      - text: "Un export écrit dans un chemin de préparation puis le renomme en place : il n'écrase donc jamais à moitié."

  TBY-FIL-001:
    offline: "oui"
    blocks: "l'empaquetage concerné ; rien n'est écrit"
    details:
      - text: "Le plus souvent un répertoire inexistant, vide ou illisible, ou un nom et une version qui ne s'analysent pas."

  TBY-FIL-002:
    offline: "oui"
    blocks: "l'empaquetage concerné ; rien n'est écrit"
    details:
      - text: "Sont aussi refusés : un nom portant un antislash ou un octet NUL. Un nom commençant par `.wh.` est refusé parce qu'un lecteur de couche le prendrait pour une suppression."
      - text: "Un ensemble de fichiers est extrait et servi sur d'autres machines, Windows compris : les refus portent sur l'endroit où le contenu atterrit, pas sur cet hôte."

  TBY-FIL-003:
    offline: "oui"
    blocks: "l'empaquetage concerné ; rien n'est écrit"
    details:
      - text: "Lire un répertoire arbitraire de l'hôte sur requête réseau est une capacité qu'on donne à une instance, pas qu'elle possède."
      - text: "`tobby fileset pack` n'est pas restreint sur l'hôte de l'instance parce que celui qui l'exécute détient déjà ces droits sur le système de fichiers."

  TBY-AID-001:
    offline: "oui"
    blocks: "la génération de l'aide"

  TBY-DIA-001:
