# OpenTelemetry Collector — the simplest shape a recipe takes.
#
# PROFILE: cooked. Chart and image both live in an OCI registry, both are
# pinned by digest. This one can be published to a cookbook as it stands.
#
# Verified against chart 0.178.2 / appVersion 0.163.2 on 2026-11-09.
apiVersion: recipe.tobby.dev/v1alpha1
kind: Recipe

metadata:
  name: otel-collector
  version: 0.163.2
  description: >-
    OpenTelemetry Collector (contrib distribution) and its Helm chart —
    the telemetry hop that lets a restricted zone keep its metrics, logs
    and traces inside its own perimeter.
  annotations:
    recipe.tobby.dev/cooked-at: "2026-11-09T09:00:00Z"
    org.opencontainers.image.source: https://github.com/open-telemetry/opentelemetry-helm-charts

spec:
  ingredients:
    # OpenTelemetry publishes its charts natively as OCI artifacts, so the
    # ingredient points straight at the upstream repository: no
    # republication step, and the upstream chart signature stays verifiable
    # at the destination.
    - name: otel-collector-chart
      kind: HelmChart
      ref: ghcr.io/open-telemetry/opentelemetry-helm-charts/opentelemetry-collector
      version: 0.178.2
      digest: sha256:83a2c4f44d537b3314a98e07b112e68999979b097d40c7b10145dae3708b4c7e
      vendorDependencies: false

    # ------------------------------------------------------------------
    # `helm template` on this chart renders NO image by default: the chart
    # ships `image.repository: ""` and refuses to choose between the core
    # and the contrib distribution for you — rendering the defaults stops
    # with "'image.repository' must be set". The error goes to stderr, so
    # a naive "render and grep" pipeline without `set -o pipefail` simply
    # returns an empty list, and the zone gets a chart with nothing to run.
    #
    # Render it the way you will actually deploy it, then read the images:
    #
    #   helm template t oci://ghcr.io/open-telemetry/opentelemetry-helm-charts/opentelemetry-collector \
    #     --version 0.178.2 -f your-values.yaml | grep -E '^\s*image:'
    #
    # The rule generalises: inventory the RENDERED manifests of the values
    # you deploy, never the chart's defaults.
    # ------------------------------------------------------------------
    - name: otel-collector-contrib
      kind: ContainerImage
      ref: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
      version: 0.163.2
      digest: sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849
      # The index also carries 386, arm/v7, ppc64le, riscv64 and s390x.
      # Naming only what the zone runs keeps the transfer — and the media —
      # to what is actually needed.
      platforms: [linux/amd64, linux/arm64]
