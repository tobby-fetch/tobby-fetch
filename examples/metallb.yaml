# MetalLB — bare-metal load balancer for Kubernetes.
#
# PROFILE: cooked. Chart and images all live in OCI registries and are all
# pinned by digest — once you know where to look for the chart; see the
# note below.
#
# Verified against chart 0.16.2 / appVersion v0.16.2 on 2026-11-09.
# Image list obtained with:
#   helm template t oci://quay.io/metallb/chart/metallb --version 0.16.2 \
#     | grep -E '^\s*image:'
apiVersion: recipe.tobby.dev/v1alpha1
kind: Recipe

metadata:
  name: metallb
  version: 0.16.2
  description: >-
    MetalLB load balancer with its FRR speaker, for clusters that have no
    cloud load-balancer to lean on — which is every air-gapped cluster.
  annotations:
    recipe.tobby.dev/cooked-at: "2026-11-09T09:00:00Z"
    org.opencontainers.image.source: https://github.com/metallb/metallb

spec:
  ingredients:
    # ------------------------------------------------------------------
    # The MetalLB documentation installs the chart from
    # https://metallb.github.io/metallb, a legacy index.yaml repository.
    # RECIPE-SPEC §7.2 puts those out of scope for the format: a chart
    # must live in an OCI registry to be an ingredient. Read that far and
    # you would republish the chart into your own registry — as Harbor
    # still requires.
    #
    # Look at the release pipeline instead of the install guide, and the
    # same archive turns out to be pushed to Quay as an OCI artifact at
    # every release, beside the index.yaml copy:
    #
    #   helm show chart oci://quay.io/metallb/chart/metallb --version 0.16.2
    #
    # So the ingredient points straight at upstream, with upstream's own
    # digest, and the recipe can be cooked as it stands. The lesson: the
    # repository a project advertises is not always the only one it
    # publishes to. Check before you republish.
    # ------------------------------------------------------------------
    - name: metallb-chart
      kind: HelmChart
      ref: quay.io/metallb/chart/metallb
      version: 0.16.2
      digest: sha256:3980cbdddacec6e55c47b787461e057280e69808ad6f5190d2603d8c39733860
      vendorDependencies: false

    # The two MetalLB components. Both are published as multi-platform
    # indexes covering amd64, arm/v7, arm64, ppc64le, riscv64 and s390x;
    # only the platforms listed here cross into the zone.
    - name: controller
      kind: ContainerImage
      ref: quay.io/metallb/controller
      version: v0.16.2
      digest: sha256:34a6f107f29c4fc6e9d084a7f3bdb781aae7b5ee2b534195a2775ab68c09c503
      platforms: [linux/amd64, linux/arm64]

    - name: speaker
      kind: ContainerImage
      ref: quay.io/metallb/speaker
      version: v0.16.2
      digest: sha256:01666518b091a6651d68891c802db84b2219495d7e0e41c2e61c46f9976be231
      platforms: [linux/amd64, linux/arm64]

    # By default the chart runs FRR through its frr-k8s subchart
    # (`frrk8s.enabled: true`): a DaemonSet of its own beside the speaker,
    # which renders both images below. They are needed for as long as that
    # value stays true — dropping them to "save space" leaves the frr-k8s
    # pods stuck in ImagePullBackOff after the cluster is already sealed.
    - name: frr-k8s
      kind: ContainerImage
      ref: quay.io/metallb/frr-k8s
      version: v0.0.27
      digest: sha256:de862b74a3a314eb76c8fb4cabc9d2c55cca51002cd022704c32df717f9366b7
      platforms: [linux/amd64, linux/arm64]

    # FRR is versioned on its own cadence, NOT with MetalLB. Re-read it from
    # the rendered chart at every upgrade instead of assuming it followed.
    - name: frr
      kind: ContainerImage
      ref: quay.io/frrouting/frr
      version: 10.6.2
      digest: sha256:89e5e1ec8b17c5dffaf57dbac58a29ebeb3731a84e5bc09dad1662adff2ba7f5
      platforms: [linux/amd64, linux/arm64]
