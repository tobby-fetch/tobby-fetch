# Strict lint profile — quality gate of the five-level test pyramid
# (public feature 1.5, NFR-016). Zero suppressions: no default exclusion
# presets, and every in-code `//nolint` must name its linter and carry a
# written justification (enforced by nolintlint).
version: "2"

run:
  # The browser level (R-38) sits behind the `browser` build tag so it never
  # slows `go test ./...` down; lint it all the same — an unlinted suite
  # rots faster than the code it guards.
  build-tags:
    - browser

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - intrange
    - misspell
    - nolintlint
    - revive
    - sloglint
    - unconvert
    - unparam
    - whitespace
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    sloglint:
      # The log schema uses key constants (internal/logging); literal ad-hoc
      # keys would drift from FR-090.
      no-raw-keys: false
      static-msg: false
  exclusions:
    # No blanket exclusions: findings in tests are findings.
    presets: []
    rules: []

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tobby-fetch/tobby-fetch
