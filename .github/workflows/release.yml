# Release — SLSA Build L3 provenance, reproducible binaries and Linux
# packages (.deb/.rpm/.apk via nfpm), signed CycloneDX SBOMs, melange+apko
# container image (ADR-0011; DEVELOPMENT-PLAN §2.1 exit criteria).
#
# Third-party actions are pinned by full commit SHA. The one documented
# exception is slsa-framework/slsa-github-generator: the SLSA verifier
# requires the trusted-builder reusable workflows to be referenced by a
# `@vX.Y.Z` tag — referencing them by hash breaks provenance verification.
#
# Signatures need no secret: binaries, SBOMs and the image are all signed
# keyless via the job's OIDC identity. The only secret this workflow spends
# is HOMEBREW_TAP_TOKEN, and only to push the formula bump into the separate
# tap repository — a cross-repository write GITHUB_TOKEN cannot perform. It
# is a fine-grained token restricted to tobby-fetch/homebrew-tap with
# `contents: write` and nothing else; it signs nothing and touches no
# artifact. When it is absent or expired the homebrew job fails loudly at
# release time, which is the point: a formula silently left behind is worse
# than a red job.
#
# A second secret name appears below, SCOOP_BUCKET_TOKEN, but the sentence
# above still holds: the scoop job only reads it to find out whether it
# exists, and never uses it to write anywhere. The Windows workstation
# channels — winget and Scoop — render their manifests from the templates in
# packaging/, attach them to the release as assets, and stop. Neither opens a
# pull request against microsoft/winget-pkgs and neither pushes into a bucket
# repository, because both of those destinations are indexes other people
# read on our behalf, and putting a new version in front of their users is a
# reviewed human act rather than a side effect of tagging.
#
# Both Windows jobs hand off GREEN, and Scoop turns red the day that means
# something. Red is worth having only while it is rare: a job that failed on
# every release would teach the team to expect a red square on the release
# page and stop reading it, which is precisely how the red that matters gets
# missed. The bucket at tobby-fetch/scoop-bucket exists and follows releases
# through its own checkver/autoupdate, so nothing is left behind here and
# nothing is red; SCOOP_BUCKET_TOKEN is the switch that says this chain owns
# the bucket copy instead, and once it is set a rendered-but-undelivered
# manifest is a real gap and fails the job. Winget ends green because nothing
# is missing there either: the manifests are rendered, checked against this run's own
# SHA256SUMS and attached, and what remains is a pull request into an index
# whose reviewers do not work here. A job that failed on every release
# forever would not say that; it would teach everyone to expect a red square
# on the release page and stop reading it, which is exactly how the scoop
# job's red — the one that means something — gets missed. Winget hands off
# through a warning annotation and a job summary instead.
#
# Recipe-ready artifacts (R-25). Besides the image and the chart, every
# release publishes the Linux and Windows binaries as one FileSet
# (RECIPE-SPEC §7.4) — a multi-platform image index at
# ghcr.io/tobby-fetch/binaries/tobby:vX.Y.Z whose children each hold the
# release binary, byte-for-byte — signed keyless, with each binary's
# CycloneDX SBOM attached as a signed cosign attestation and SLSA provenance
# from the trusted container builder. A site references image, chart and
# FileSet from a recipe (examples/tobby.yaml) and signs that recipe with its
# OWN qualification chain: these signatures let the site check what it
# admits, they never stand in for the site's (ROADMAP invariant 1). Nothing
# here lets a running Tobby look for a newer one (NFR-019).
#
# Dry run. `workflow_dispatch` runs the whole chain as a rehearsal and can
# do nothing else — there is no input that turns it into a release. Every
# OCI name is computed once, by the build job: under a dispatch they all
# move to ghcr.io/<owner>/dry-run/…, and each publishing job re-checks that
# before it pushes. A rehearsal creates no GitHub release, uploads no
# release asset, pushes nothing into the Homebrew tap and attaches no
# winget or Scoop manifest; those files are kept as workflow artifacts
# instead. What it does still do, on purpose, is sign keyless — that is
# the path being rehearsed — so it leaves Rekor entries for the dry-run
# digests, under an identity on refs/heads/…, never refs/tags/…. Delete
# the dry-run/* packages once the rehearsal is read. How to launch one:
# docs/release-verification.md, "Rehearsing a release".
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version the rehearsal builds as (the tag about to be cut, e.g.
          v0.6.0). A dispatch is ALWAYS a dry run: it publishes under
          ghcr.io/<owner>/dry-run/ only and creates no release.
        required: true
        type: string

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=CycloneDX/cyclonedx-gomod
  CYCLONEDX_GOMOD_VERSION: v1.12.0
  # renovate: datasource=github-releases depName=chainguard-dev/melange
  MELANGE_VERSION: v0.64.0
  # renovate: datasource=github-releases depName=chainguard-dev/apko
  APKO_VERSION: v1.4.17
  # renovate: datasource=github-releases depName=goreleaser/nfpm
  NFPM_VERSION: v2.48.0
  # renovate: datasource=github-releases depName=google/go-containerregistry
  CRANE_VERSION: v0.22.1

jobs:
  build:
    name: Build binaries (reproducible)
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      date: ${{ steps.meta.outputs.date }}
      source_date_epoch: ${{ steps.meta.outputs.source_date_epoch }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      image: ${{ steps.meta.outputs.image }}
      charts: ${{ steps.meta.outputs.charts }}
      binaries: ${{ steps.meta.outputs.binaries }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The one place that decides whether this run is a release or a
      # rehearsal, and therefore every name the run may publish under.
      # The dispatch input is validated here, before it becomes an output
      # that later steps interpolate.
      - name: Release metadata (tag, commit, SOURCE_DATE_EPOCH, OCI names)
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        # tools/release-meta.sh: only a push of a v* tag publishes under the
        # real names; a version holding any control character (a multi-line
        # input that would forge extra $GITHUB_OUTPUT lines) is refused
        # before anything is written. Locked by tools/release-meta-test.sh.
        run: |
          set -eu
          out="$(sh tools/release-meta.sh "${GITHUB_EVENT_NAME}" "${GITHUB_REF}" "${GITHUB_REF_NAME}" \
            "${INPUT_VERSION}" "${GITHUB_REPOSITORY_OWNER}" "${GITHUB_REPOSITORY}" \
            "$(git rev-parse HEAD)" "$(git log -1 --format=%ct)")"
          printf '%s\n' "${out}" >> "$GITHUB_OUTPUT"
      - name: Build the four release targets
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.source_date_epoch }}
        run: >
          sh tools/release-build.sh
          "${{ steps.meta.outputs.version }}"
          "${{ steps.meta.outputs.commit }}"
          "${{ steps.meta.outputs.date }}"
          dist
      - name: Install nfpm (version pinned, sumdb-verified)
        env:
          # setup-go pins GOTOOLCHAIN=local to the project toolchain; nfpm
          # may require a newer Go than the project does. Its build
          # toolchain has no bearing on the packages' reproducibility —
          # the payload is the release binary from tools/release-build.sh
          # and nfpm itself is pinned by NFPM_VERSION.
          GOTOOLCHAIN: auto
        run: |
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Package the Linux targets (.deb, .rpm, .apk — nfpm)
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.source_date_epoch }}
        run: >
          sh tools/package-build.sh
          "${{ steps.meta.outputs.version }}"
          dist dist
      - name: Compute SLSA subjects (sha256 of every binary and package)
        id: hash
        run: |
          cd dist
          sha256sum tobby-* tobby_* > SHA256SUMS
          echo "hashes=$(base64 -w0 < SHA256SUMS)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: dist/
          if-no-files-found: error

  verify-reproducibility:
    name: Reproducibility gate (independent double build)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Rebuild every target from scratch on a fresh runner
        env:
          SOURCE_DATE_EPOCH: ${{ needs.build.outputs.source_date_epoch }}
        run: >
          sh tools/release-build.sh
          "${{ needs.build.outputs.version }}"
          "${{ needs.build.outputs.commit }}"
          "${{ needs.build.outputs.date }}"
          dist-rebuild
      - name: Install nfpm (version pinned, sumdb-verified)
        env:
          # GOTOOLCHAIN rationale: see the identical step in the build job.
          GOTOOLCHAIN: auto
        run: |
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Repackage the Linux targets from the rebuilt binaries
        env:
          SOURCE_DATE_EPOCH: ${{ needs.build.outputs.source_date_epoch }}
        run: >
          sh tools/package-build.sh
          "${{ needs.build.outputs.version }}"
          dist-rebuild dist-rebuild
      - name: Compare digests — any mismatch blocks the release
        run: |
          echo "${{ needs.build.outputs.hashes }}" | base64 -d > expected.sha256
          cd dist-rebuild
          sha256sum -c ../expected.sha256

  sbom:
    name: CycloneDX SBOMs (cosign-signed)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write # Sigstore keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Install cyclonedx-gomod (version pinned, sumdb-verified)
        run: |
          go install "github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@${CYCLONEDX_GOMOD_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Generate one SBOM per release binary
        run: |
          mkdir -p sboms
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            case "$os" in windows) ext=".exe" ;; *) ext="" ;; esac
            GOOS="$os" GOARCH="$arch" cyclonedx-gomod app \
              -json -licenses -main cmd/tobby \
              -output "sboms/tobby-${os}-${arch}${ext}.cdx.json"
          done
      - name: Sign each SBOM (cosign keyless via job OIDC identity)
        run: |
          # cosign v3+ emits the self-contained bundle format; the legacy
          # detached sig+pem pair is no longer produced.
          for f in sboms/*.cdx.json; do
            cosign sign-blob --yes --bundle "$f.bundle" "$f"
          done
      - name: Sign and stage the OpenVEX document, when one exists (ADR-0011)
        run: |
          # A scanner finding that does not apply to Tobby ships as a signed
          # OpenVEX statement attached to the release — never a silent ignore
          # rule (.vex/README.md). No document means nothing is waived; this
          # step is then a no-op by design, not an oversight.
          if [ -f .vex/tobby.openvex.json ]; then
            cp .vex/tobby.openvex.json sboms/tobby.openvex.json
            cosign sign-blob --yes --bundle sboms/tobby.openvex.json.bundle \
              sboms/tobby.openvex.json
          else
            echo "No OpenVEX statements: no scanner finding is waived."
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sboms
          path: sboms/
          if-no-files-found: error

  image:
    name: Container image (melange + apko)
    runs-on: ubuntu-latest
    needs: [build, verify-reproducibility]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Install melange and apko (version pinned, sumdb-verified)
        env:
          # setup-go pins GOTOOLCHAIN=local to the project toolchain; the
          # tools may require a newer Go than the project does. Their build
          # toolchain has no bearing on tobby's reproducibility — the
          # release binaries pin their own via tools/release-build.sh.
          GOTOOLCHAIN: auto
        run: |
          go install "chainguard.dev/melange@${MELANGE_VERSION}"
          go install "chainguard.dev/apko@${APKO_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Stamp release metadata into the melange source tree
        run: |
          mkdir -p .release-meta
          echo "${{ needs.build.outputs.commit }}" > .release-meta/commit
          echo "${{ needs.build.outputs.date }}" > .release-meta/date
          echo "${{ needs.build.outputs.source_date_epoch }}" > .release-meta/source-date-epoch
          version="${{ needs.build.outputs.version }}"
          melange bump melange.yaml "${version#v}"
      - name: Build the signed tobby apk (melange, amd64 + arm64)
        env:
          SOURCE_DATE_EPOCH: ${{ needs.build.outputs.source_date_epoch }}
        run: |
          # --out-dir lives OUTSIDE --source-dir on purpose. Nested, the
          # first architecture's output lands inside the very tree the
          # second architecture copies into its workspace, and melange
          # walks a directory that is changing under it — which fails as
          # "open <transient>: no such file or directory", intermittently
          # and only ever on the second arch.
          melange keygen
          melange build melange.yaml \
            --arch x86_64,aarch64 \
            --signing-key melange.rsa \
            --source-dir . \
            --out-dir "${RUNNER_TEMP}/packages" \
            --runner docker
      - name: A dry run publishes under dry-run/ only
        env:
          DRY_RUN: ${{ needs.build.outputs.dry_run }}
          TARGET: ${{ needs.build.outputs.image }}
        run: sh tools/check-publish-target.sh "${DRY_RUN}" "${TARGET}"
      - name: Log in to ghcr.io
        run: apko login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
      - name: Assemble and publish the multi-arch image (apko, native SBOM)
        id: publish
        env:
          SOURCE_DATE_EPOCH: ${{ needs.build.outputs.source_date_epoch }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          image="${IMAGE}"
          mkdir -p image-sboms
          ref="$(apko publish apko.yaml "${image}:${{ needs.build.outputs.version }}" \
            --repository-append "${RUNNER_TEMP}/packages" \
            --keyring-append melange.rsa.pub \
            --sbom-path image-sboms)"
          echo "published: ${ref}"
          {
            echo "image=${image}"
            echo "digest=${ref#*@}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sboms
          path: image-sboms/
          if-no-files-found: error

  image-scan:
    name: Image CVE gate (Trivy)
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      packages: read
    steps:
      # No ignore mechanism of any kind lives here. The day a finding must
      # be waived, it comes as an OpenVEX statement (.vex/README.md) wired
      # into this step via TRIVY_VEX — never a .trivyignore.
      - name: Scan the published image — critical and high block the release
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: image
          image-ref: "${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}"
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
      # B-037: the image scan above reads the apk database, and Trivy does
      # not look inside the files an apk package installed — so it never
      # saw the Go dependencies of the two binaries the image is made of,
      # Tobby and the pinned Trivy it embeds. Those binaries are taken out
      # of the published image, for both architectures, and scanned as a
      # root filesystem, where Trivy reads the module list each Go binary
      # carries. Same threshold, same no-ignore rule as the gate above.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install crane (version pinned, sumdb-verified)
        env:
          # GOTOOLCHAIN rationale: see the nfpm step in the build job.
          GOTOOLCHAIN: auto
        run: |
          go install "github.com/google/go-containerregistry/cmd/crane@${CRANE_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Extract the embedded binaries from the published image
        env:
          IMAGE_REF: "${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}"
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          printf '%s' "${REGISTRY_TOKEN}" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin
          for platform in linux/amd64 linux/arm64; do
            dir="${RUNNER_TEMP}/binaries-rootfs/${platform#linux/}"
            mkdir -p "${dir}"
            crane export --platform "${platform}" "${IMAGE_REF}" - |
              tar -x -C "${dir}" --wildcards '*usr/bin/tobby' '*usr/libexec/tobby/trivy'
            # An empty extraction would scan nothing and pass: refuse it.
            test -x "${dir}/usr/bin/tobby"
            test -x "${dir}/usr/libexec/tobby/trivy"
          done
      - name: Scan the embedded Go binaries — critical and high block the release
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: rootfs
          scan-ref: "${{ runner.temp }}/binaries-rootfs"
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"

  image-sign:
    name: Sign image (cosign keyless)
    runs-on: ubuntu-latest
    needs: [image, image-scan]
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore keyless signing
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Log in to ghcr.io
        run: cosign login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
      - name: Sign the image digest
        run: cosign sign --yes "${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}"

  # The reference chart, published as an OCI artifact next to the image it
  # deploys: `helm install oci://ghcr.io/tobby-fetch/charts/tobby` is the
  # documented install, and a zone without a route to ghcr.io gets the
  # chart the way it gets everything else — as a HelmChart ingredient that
  # Tobby itself carries. Published only after the image passed its CVE
  # gate, because the chart's default points at that image.
  chart:
    name: Helm chart (OCI, cosign keyless)
    runs-on: ubuntu-latest
    needs: [build, image, image-scan]
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore keyless signing
    outputs:
      ref: ${{ steps.push.outputs.ref }}
      digest: ${{ steps.push.outputs.digest }}
    env:
      VERSION: ${{ needs.build.outputs.version }}
      CHARTS: ${{ needs.build.outputs.charts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # B-035: the chart's default image tag is "v" + appVersion. A tag cut
      # without moving the chart would publish a chart that deploys the
      # previous release — refuse before anything is pushed.
      - name: The chart deploys the release being tagged
        run: sh tools/check-chart-version.sh "${VERSION}"
      - name: A dry run publishes under dry-run/ only
        env:
          DRY_RUN: ${{ needs.build.outputs.dry_run }}
        run: sh tools/check-publish-target.sh "${DRY_RUN}" "${CHARTS}/tobby"
      - name: Install helm (version pinned, checksummed — ADR-0011)
        env:
          HELM_VERSION: "4.3.1"
        run: |
          set -eu
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/helm.tgz" \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b  ${tmp}/helm.tgz" |
            sha256sum -c -
          tar -xzf "$tmp/helm.tgz" -C "$tmp"
          sudo install -m 0755 "$tmp/linux-amd64/helm" /usr/local/bin/helm
          rm -rf "$tmp"
          helm version --short
      - name: Lint and package the chart
        run: |
          helm lint deploy/charts/tobby
          helm package deploy/charts/tobby --destination "${RUNNER_TEMP}/chart"
      - name: Push the chart to ghcr.io
        id: push
        run: |
          set -eu
          echo "${{ secrets.GITHUB_TOKEN }}" |
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          out="$(helm push "${RUNNER_TEMP}/chart/tobby-${VERSION#v}.tgz" "oci://${CHARTS}" 2>&1)"
          echo "$out"
          digest="$(printf '%s\n' "$out" | sed -n 's/^Digest:[[:space:]]*\(sha256:[0-9a-f]\{64\}\).*/\1/p')"
          [ -n "$digest" ] || { echo "::error::no digest in helm push output"; exit 1; }
          {
            echo "ref=${CHARTS}/tobby"
            echo "digest=${digest}"
          } >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the chart digest
        run: |
          cosign login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          cosign sign --yes "${{ steps.push.outputs.ref }}@${{ steps.push.outputs.digest }}"

  # SLSA Build L3 provenance for the container image, generated by the
  # isolated trusted builder and pushed to the registry alongside the image.
  # MUST be referenced by tag (slsa-verifier requirement — see header note).
  image-provenance:
    name: SLSA provenance (image)
    needs: [image, image-scan]
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.image.outputs.image }}
      digest: ${{ needs.image.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # The Linux and Windows binaries as a recipe-ready FileSet (R-25,
  # RECIPE-SPEC §7.4). FileSet rather than OCIArtifact because the content
  # IS files, one per platform: a FileSet is a plain multi-platform image,
  # so a recipe's `platforms` selects the children a zone runs, the
  # extraction rules are the spec's own, and it mounts as a Kubernetes
  # image volume — an OCIArtifact would need an artifact type of ours and
  # has no platform selection at all. darwin stays a release asset only:
  # macOS is a workstation tier, not a zone target.
  #
  # Built after the reproducibility gate, from the very files that gate
  # vouched for: tools/release-fileset.sh assembles the index in a registry
  # that exists only inside this job, reads every child back against
  # SHA256SUMS, and only then is the finished index copied — by digest, no
  # scratch tag — to its public name. The image is not republished here:
  # it is the one the image job built and scanned.
  #
  # Attached to it, both through cosign and the job's OIDC identity like the
  # image: a keyless signature on the index, and on each child the CycloneDX
  # SBOM of the binary it holds, as a signed attestation (predicate type
  # https://cyclonedx.org/bom). An attestation rather than `cosign attach
  # sbom`, which is deprecated and signs nothing. SLSA provenance comes from
  # the trusted builder in the next job.
  binaries-oci:
    name: Binaries as a FileSet (OCI, cosign keyless)
    runs-on: ubuntu-latest
    needs: [build, verify-reproducibility, sbom]
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore keyless signing and attestations
    outputs:
      ref: ${{ steps.push.outputs.ref }}
      digest: ${{ steps.push.outputs.digest }}
    env:
      VERSION: ${{ needs.build.outputs.version }}
      BINARIES: ${{ needs.build.outputs.binaries }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sboms
          path: sboms
      - name: Install crane (version pinned, sumdb-verified)
        env:
          # GOTOOLCHAIN rationale: see the nfpm step in the build job.
          GOTOOLCHAIN: auto
        run: |
          go install "github.com/google/go-containerregistry/cmd/crane@${CRANE_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: A dry run publishes under dry-run/ only
        env:
          DRY_RUN: ${{ needs.build.outputs.dry_run }}
        run: sh tools/check-publish-target.sh "${DRY_RUN}" "${BINARIES}"
      - name: Assemble the FileSet locally, then copy it to ghcr.io by digest
        id: push
        env:
          SOURCE_DATE_EPOCH: ${{ needs.build.outputs.source_date_epoch }}
          COMMIT: ${{ needs.build.outputs.commit }}
          DATE: ${{ needs.build.outputs.date }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # A registry that lives and dies with this job: the scratch tags
          # the assembly needs never reach ghcr.io.
          crane registry serve --address 127.0.0.1:5000 > "${RUNNER_TEMP}/registry.log" 2>&1 &
          for _ in $(seq 1 50); do
            curl -fsS -o /dev/null http://127.0.0.1:5000/v2/ && break
            sleep 0.2
          done
          digest="$(sh tools/release-fileset.sh "${VERSION}" "${COMMIT}" "${DATE}" \
            dist 127.0.0.1:5000/tobby | tail -n 1)"
          printf '%s\n' "$digest" | grep -Eqx 'sha256:[0-9a-f]{64}' \
            || { echo "::error::no digest from tools/release-fileset.sh"; exit 1; }
          printf '%s\n' "${REGISTRY_TOKEN}" |
            crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin
          # The first manifest written creates the package; ghcr.io may
          # refuse the children pushed alongside it (DENIED) until the
          # token's grant on the new package has propagated. The copy is
          # idempotent by digest, so a bounded retry rides that window out.
          copied=false
          for attempt in 1 2 3 4 5; do
            if crane copy "127.0.0.1:5000/tobby@${digest}" "${BINARIES}:${VERSION}"; then
              copied=true
              break
            fi
            echo "::warning::crane copy attempt ${attempt} failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          [ "$copied" = true ] || { echo "::error::could not publish ${BINARIES}:${VERSION}"; exit 1; }
          published="$(crane digest "${BINARIES}:${VERSION}")"
          [ "$published" = "$digest" ] \
            || { echo "::error::ghcr.io serves ${published}, the job built ${digest}"; exit 1; }
          echo "published: ${BINARIES}:${VERSION}@${digest}"
          {
            echo "ref=${BINARIES}"
            echo "digest=${digest}"
          } >> "$GITHUB_OUTPUT"
      - name: Sign the index and attest each binary's SBOM (cosign keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -eu
          cosign login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          cosign sign --yes "${BINARIES}@${DIGEST}"
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            case "$os" in windows) ext=".exe" ;; *) ext="" ;; esac
            child="$(crane digest --platform "$target" "${BINARIES}@${DIGEST}")"
            cosign attest --yes --type cyclonedx \
              --predicate "sboms/tobby-${os}-${arch}${ext}.cdx.json" \
              "${BINARIES}@${child}"
            echo "${target}: ${child} — SBOM attested"
          done

  # SLSA Build L3 provenance for the FileSet index, from the same trusted
  # container builder as the image's. The binaries inside are also subjects
  # of tobby.intoto.jsonl (the provenance job below), so either route
  # verifies them. MUST be referenced by tag (see header note).
  binaries-provenance:
    name: SLSA provenance (binaries FileSet)
    needs: [binaries-oci]
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.binaries-oci.outputs.ref }}
      digest: ${{ needs.binaries-oci.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [build, verify-reproducibility, sbom, image, image-scan, chart, binaries-oci]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      IMAGE: ${{ needs.image.outputs.image }}
      DIGEST: ${{ needs.image.outputs.digest }}
      CHART: ${{ needs.chart.outputs.ref }}
      CHART_DIGEST: ${{ needs.chart.outputs.digest }}
      BINARIES: ${{ needs.binaries-oci.outputs.ref }}
      BINARIES_DIGEST: ${{ needs.binaries-oci.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sboms
          path: sboms
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-sboms
          path: image-sboms
      - name: Write release notes with exact verification commands (ADR-0011)
        run: |
          cat > notes-template.md <<'EOF'
          ## Supply-chain verification

          Every artifact below carries SLSA Build L3 provenance generated by the
          slsa-github-generator trusted builder, a cosign-signed CycloneDX SBOM,
          and reproducible-build guarantees. Full guide:
          [docs/release-verification.md](https://github.com/tobby-fetch/tobby-fetch/blob/@VERSION@/docs/release-verification.md).

          ### Verify a binary against its SLSA provenance

          ```bash
          slsa-verifier verify-artifact tobby-linux-amd64 \
            --provenance-path tobby.intoto.jsonl \
            --source-uri github.com/tobby-fetch/tobby-fetch \
            --source-tag @VERSION@
          ```

          ### Linux packages (offline install)

          `tobby_@PKGVER@_linux_<arch>.deb|rpm|apk` wrap the same
          reproducible binary (installed to `/usr/bin/tobby`, no install
          scripts) and are covered by the same SLSA provenance and
          `SHA256SUMS`. Verify with slsa-verifier as above, then install
          with no repository or network access:

          ```bash
          dpkg -i tobby_@PKGVER@_linux_amd64.deb                    # Debian/Ubuntu
          rpm -i tobby_@PKGVER@_linux_amd64.rpm                     # RHEL/SUSE/Fedora
          apk add --allow-untrusted tobby_@PKGVER@_linux_amd64.apk  # Alpine
          ```

          The packages carry no package-manager signature — trust comes
          from the SLSA provenance and checksum verification performed
          before installation (hence `--allow-untrusted` on apk).

          ### Verify a signed SBOM

          ```bash
          cosign verify-blob \
            --new-bundle-format \
            --bundle tobby-linux-amd64.cdx.json.bundle \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github.com/tobby-fetch/tobby-fetch/' \
            tobby-linux-amd64.cdx.json
          ```

          ### Container image

          `@IMAGE@:@VERSION@` — digest `@DIGEST@` (multi-arch amd64/arm64,
          Wolfi-based, no shell, runs as uid 65532).

          ```bash
          slsa-verifier verify-image @IMAGE@@@DIGEST@ \
            --source-uri github.com/tobby-fetch/tobby-fetch \
            --source-tag @VERSION@

          cosign verify @IMAGE@@@DIGEST@ \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github.com/tobby-fetch/tobby-fetch/'
          ```

          ### Helm chart

          `oci://@CHART@` version `@PKGVER@` — digest `@CHART_DIGEST@`.
          It deploys the image above by default.

          ```bash
          cosign verify @CHART@@@CHART_DIGEST@ \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github.com/tobby-fetch/tobby-fetch/'

          helm install tobby oci://@CHART@ --version @PKGVER@ \
            --namespace tobby --create-namespace --set config.mode=passthrough
          ```

          ### Binaries as a FileSet (recipe-ready)

          `@BINARIES@:@VERSION@` — digest `@BINARIES_DIGEST@`. One image
          index, four children (linux and windows, amd64 and arm64), each
          holding the release binary of the same name, byte-for-byte. Pin it
          in a recipe as a `FileSet` beside the image and the chart
          ([examples/tobby.yaml](https://github.com/tobby-fetch/tobby-fetch/blob/@VERSION@/examples/tobby.yaml)),
          and sign that recipe with your own chain: these signatures let you
          check what you admit, they do not replace your site's.

          ```bash
          cosign verify @BINARIES@@@BINARIES_DIGEST@ \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity https://github.com/tobby-fetch/tobby-fetch/.github/workflows/release.yml@refs/tags/@VERSION@

          slsa-verifier verify-image @BINARIES@@@BINARIES_DIGEST@ \
            --source-uri github.com/tobby-fetch/tobby-fetch \
            --source-tag @VERSION@

          # the CycloneDX SBOM of one binary, attested on its child manifest
          cosign verify-attestation --type cyclonedx \
            "@BINARIES@@$(crane digest --platform windows/amd64 @BINARIES@@@BINARIES_DIGEST@)" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity https://github.com/tobby-fetch/tobby-fetch/.github/workflows/release.yml@refs/tags/@VERSION@
          ```

          ### Independent rebuild (air-gapped verification)

          The binaries and Linux packages are bit-reproducible. Rebuild
          them from the tag and compare against `SHA256SUMS` — no online
          infrastructure required:

          ```bash
          git clone https://github.com/tobby-fetch/tobby-fetch && cd tobby-fetch
          git checkout @VERSION@
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) sh tools/release-build.sh \
            "@VERSION@" "$(git rev-parse HEAD)" \
            "$(date -u -d "@$(git log -1 --format=%ct)" +%Y-%m-%dT%H:%M:%SZ)" dist
          # optional — reproduces the .deb/.rpm/.apk too; needs nfpm at the
          # NFPM_VERSION pinned in .github/workflows/release.yml
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) sh tools/package-build.sh \
            "@VERSION@" dist dist
          (cd dist && sha256sum --ignore-missing -c /path/to/downloaded/SHA256SUMS)
          ```
          EOF
          sed -e "s|@VERSION@|${VERSION}|g" \
              -e "s|@PKGVER@|${VERSION#v}|g" \
              -e "s|@IMAGE@|${IMAGE}|g" \
              -e "s|@CHART_DIGEST@|${CHART_DIGEST}|g" \
              -e "s|@CHART@|${CHART}|g" \
              -e "s|@BINARIES_DIGEST@|${BINARIES_DIGEST}|g" \
              -e "s|@BINARIES@|${BINARIES}|g" \
              -e "s|@DIGEST@|${DIGEST}|g" \
              notes-template.md > notes.md
          ! grep -nE '@[A-Z_]+@' notes.md \
            || { echo "::error::a placeholder survived in the release notes"; exit 1; }
      - name: Create the release with binaries, checksums, and SBOMs
        if: needs.build.outputs.dry_run == 'false' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: >
          gh release create "${VERSION}"
          --verify-tag
          --title "tobby ${VERSION}"
          --notes-file notes.md
          dist/* sboms/* image-sboms/*
      # Rehearsal: the notes and the full asset set a release would carry
      # are kept as one workflow artifact, and the notes shown in the run
      # summary. No release, no tag, no asset.
      - name: "Dry run: show the notes the release would carry"
        if: needs.build.outputs.dry_run == 'true'
        run: |
          {
            echo "## DRY RUN — release notes ${VERSION} would carry"
            echo
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p dry-run-release
          cp notes.md dist/* sboms/* image-sboms/* dry-run-release/
      - name: "Dry run: keep the would-be release as a workflow artifact"
        if: needs.build.outputs.dry_run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dry-run-release
          path: dry-run-release/
          if-no-files-found: error

  # Homebrew tap: bump the published formula in the same breath as the
  # release, so `brew install` never serves a version behind. Needs the one
  # secret of this workflow (see header) — GITHUB_TOKEN cannot write to
  # another repository.
  #
  # Checksums are read from the SHA256SUMS this run just built and the SLSA
  # provenance covers, not recomputed from a re-download.
  homebrew:
    name: Bump the Homebrew formula
    runs-on: ubuntu-latest
    needs: [build, release]
    permissions: {}
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout this repository (for the formula template)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      - name: Fail early when the token is missing
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set. The release is published, but the"
            echo "::error::Homebrew formula was NOT bumped. Create a fine-grained token limited"
            echo "::error::to tobby-fetch/homebrew-tap with contents:write, store it as this"
            echo "::error::repository's HOMEBREW_TAP_TOKEN secret, then re-run this job."
            exit 1
          fi
      - name: Render the formula from the template
        run: |
          set -euo pipefail
          arm64="$(awk '$2 ~ /tobby-darwin-arm64$/ {print $1}' dist/SHA256SUMS)"
          amd64="$(awk '$2 ~ /tobby-darwin-amd64$/ {print $1}' dist/SHA256SUMS)"
          for v in "$arm64" "$amd64"; do
            [ "${#v}" -eq 64 ] || { echo "::error::missing or malformed darwin checksum"; exit 1; }
          done
          VERSION="${VERSION#v}" ARM64="$arm64" AMD64="$amd64" python3 - <<'PY'
          import os, re, pathlib
          s = pathlib.Path("packaging/homebrew/tobby.rb").read_text()
          s = re.sub(r'^(\s*version\s+)"[^"]*"',
                     lambda m: f'{m.group(1)}"{os.environ["VERSION"]}"', s, count=1, flags=re.M)
          it = iter([os.environ["ARM64"], os.environ["AMD64"]])  # template order: arm64, then amd64
          s = re.sub(r'^(\s*sha256\s+)"[0-9a-f]{64}"',
                     lambda m: f'{m.group(1)}"{next(it)}"', s, count=2, flags=re.M)
          pathlib.Path("rendered-tobby.rb").write_text(s)
          PY
          grep -q "version \"${VERSION#v}\"" rendered-tobby.rb || { echo "::error::version substitution did not apply"; exit 1; }
      # Rehearsal: the rendered formula is the whole result; the tap is not
      # cloned, let alone pushed to.
      - name: "Dry run: keep the rendered formula, push nothing"
        if: needs.build.outputs.dry_run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dry-run-homebrew
          path: rendered-tobby.rb
          if-no-files-found: error
      - name: Push the bump into the tap
        if: needs.build.outputs.dry_run == 'false' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/tobby-fetch/homebrew-tap.git" tap
          cp rendered-tobby.rb tap/Formula/tobby.rb
          cd tap
          if git diff --quiet -- Formula/tobby.rb; then
            echo "Formula already on ${VERSION} — nothing to push."
            exit 0
          fi
          git config user.name "tobby release bot"
          git config user.email "noreply@github.com"
          git add Formula/tobby.rb
          git commit -m "⬆️ tobby ${VERSION}: formula and release checksums

          Pushed by the release workflow of tobby-fetch at ${VERSION}.
          Checksums come from that release's SHA256SUMS, which the SLSA
          provenance covers.

          Signed-off-by: tobby release bot <noreply@github.com>"
          git push

  # winget: render the three-file manifest set for the Windows Package
  # Manager and attach it to the release. Windows is not a courtesy target —
  # NFR-001 requires the single static binary on Windows for both
  # architectures, and NFR-018 puts the complete mirror-mode workflow inside
  # the validated Windows scope — so the mirror workstation deserves an entry
  # in the package manager its operators already run, not a download link.
  #
  # The deliberate limit: this job renders and attaches, and publishes
  # nothing. A winget release is a pull request against microsoft/winget-pkgs,
  # a community index reviewed by people outside this project, and the
  # PackageIdentifier it accepts is immutable afterwards. That is a decision a
  # person takes with their name on it, not an automated consequence of
  # pushing a tag, so no step here opens such a pull request and no token that
  # could is stored in this repository. The rendered manifests ride on the
  # release precisely so the human doing it has a provenance-covered,
  # already-validated set to submit rather than files hand-edited afterwards.
  #
  # Checksums are read from the SHA256SUMS this run just built and the SLSA
  # provenance covers, not recomputed from a re-download.
  winget:
    name: Render the winget manifest set
    runs-on: ubuntu-latest
    needs: [build, release]
    # Only what the upload actually needs: writing release assets. The
    # homebrew job can run with `permissions: {}` because it pushes with its
    # own cross-repository token; this one touches the release itself.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout this repository (for the manifest templates)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      - name: Render the manifest set from the templates
        run: |
          set -euo pipefail
          amd64="$(awk '$2 ~ /tobby-windows-amd64\.exe$/ {print $1}' dist/SHA256SUMS)"
          arm64="$(awk '$2 ~ /tobby-windows-arm64\.exe$/ {print $1}' dist/SHA256SUMS)"
          for v in "$amd64" "$arm64"; do
            [ "${#v}" -eq 64 ] || { echo "::error::missing or malformed windows checksum"; exit 1; }
          done
          VERSION="${VERSION#v}" AMD64="$amd64" ARM64="$arm64" python3 - <<'PY'
          import os, re, pathlib
          version = os.environ["VERSION"]
          tag = f"v{version}"
          it = iter([os.environ["AMD64"], os.environ["ARM64"]])  # template order: x64, then arm64
          out = pathlib.Path("rendered-winget")
          out.mkdir(exist_ok=True)
          for name in ("tobby-fetch.tobby.yaml",
                       "tobby-fetch.tobby.installer.yaml",
                       "tobby-fetch.tobby.locale.en-US.yaml"):
              s = pathlib.Path("packaging/winget", name).read_text()
              s = re.sub(r'^(PackageVersion: )"0\.0\.0"',
                         lambda m: f'{m.group(1)}"{version}"', s, count=1, flags=re.M)
              s = s.replace("v0.0.0", tag)  # asset URLs and the release-notes link
              s = re.sub(r'^(\s*InstallerSha256: )"0{64}"',
                         lambda m: f'{m.group(1)}"{next(it)}"', s, flags=re.M)
              (out / name).write_text(s)
          PY
      - name: Verify the substitution actually applied
        run: |
          set -euo pipefail
          for f in rendered-winget/*.yaml; do
            grep -q "PackageVersion: \"${VERSION#v}\"" "$f" \
              || { echo "::error::version substitution did not apply in $f"; exit 1; }
            ! grep -q 'v0\.0\.0' "$f" \
              || { echo "::error::a tag placeholder survived in $f"; exit 1; }
            ! grep -qE '0{64}' "$f" \
              || { echo "::error::a checksum placeholder survived in $f"; exit 1; }
          done
          grep -q "InstallerSha256: \"$(awk '$2 ~ /tobby-windows-amd64\.exe$/ {print $1}' dist/SHA256SUMS)\"" \
            rendered-winget/tobby-fetch.tobby.installer.yaml \
            || { echo "::error::the x64 checksum is not the one this run built"; exit 1; }
          grep -q "InstallerSha256: \"$(awk '$2 ~ /tobby-windows-arm64\.exe$/ {print $1}' dist/SHA256SUMS)\"" \
            rendered-winget/tobby-fetch.tobby.installer.yaml \
            || { echo "::error::the arm64 checksum is not the one this run built"; exit 1; }
      - name: Attach the rendered manifests to the release
        if: needs.build.outputs.dry_run == 'false' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: >
          gh release upload "${VERSION}"
          rendered-winget/tobby-fetch.tobby.yaml
          rendered-winget/tobby-fetch.tobby.installer.yaml
          rendered-winget/tobby-fetch.tobby.locale.en-US.yaml
          --clobber
      - name: "Dry run: keep the rendered manifests, attach nothing"
        if: needs.build.outputs.dry_run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dry-run-winget
          path: rendered-winget/
          if-no-files-found: error
      # This step does NOT fail, and the difference from the homebrew job
      # above is the whole reasoning. Homebrew fails when HOMEBREW_TAP_TOKEN
      # is absent because something the workflow was supposed to do could not
      # be done. Here nothing is missing and nothing failed: the manifests
      # are rendered, verified against this run's own SHA256SUMS, and
      # attached to the release. What remains is a pull request against
      # microsoft/winget-pkgs, which is reviewed by people outside this
      # project and which nobody here may open on its behalf — and the
      # PackageIdentifier is immutable once accepted, so it is a decision,
      # not a step.
      #
      # A job that failed on every release forever would not communicate
      # that. It would train everyone to expect one red square on the
      # release page and to stop reading it, which is how the homebrew job's
      # own red — the one that means something — gets missed. So the hand-off
      # is a warning annotation and a job summary the releaser actually
      # reads, and the release stays green.
      - name: Announce the human step (the community index is not ours to write to)
        if: needs.build.outputs.dry_run == 'false' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::warning::winget manifests for ${VERSION} are attached to the release; submitting them to microsoft/winget-pkgs is a human step."
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## winget — rendered, not published

          The three \`tobby-fetch.tobby*.yaml\` manifests for **${VERSION}** are
          attached to the release. Their \`InstallerSha256\` values come from this
          run's \`SHA256SUMS\`, which the SLSA provenance covers.

          Nothing has been submitted. This workflow opens no pull request against
          \`microsoft/winget-pkgs\` and holds no token that could: that index is
          reviewed by people outside this project, and the PackageIdentifier
          \`tobby-fetch.tobby\` is immutable once accepted.

          To publish this version by hand:

          1. Download the three \`tobby-fetch.tobby*.yaml\` assets from the
             ${VERSION} release into an empty directory.
          2. On a Windows host: \`winget validate --manifest .\`, then
             \`winget install --manifest .\` — this proves the portable install and
             the \`tobby\` command alias both work.
          3. Open a pull request adding the three files under
             \`manifests/i/infraBuilder/tobby/${VERSION#v}/\` in
             \`microsoft/winget-pkgs\`.

          Re-running this job changes none of that.
          EOF

  # Scoop: render the app manifest for the bucket and attach it to the
  # release. Same reasoning as the winget job — Windows is a validated target
  # (NFR-001, NFR-018) and Scoop is what the operators of mirror workstations
  # tend to have, not least because it installs per-user and needs no
  # administrator rights, which on a managed workstation is often the only
  # kind of install available.
  #
  # The deliberate limit, and here it is not even a judgement call yet: the
  # bucket repository tobby-fetch/scoop-bucket does not exist. Creating a
  # public repository that becomes a distribution channel — with the
  # maintenance, the trust and the deprecation story that follows — is not a
  # decision this release chain gets to take on a tag push. So this job
  # renders, attaches, and then tells a human exactly what is missing.
  #
  # Checksums are read from the SHA256SUMS this run just built and the SLSA
  # provenance covers, not recomputed from a re-download.
  scoop:
    name: Render the Scoop manifest
    runs-on: ubuntu-latest
    needs: [build, release]
    # Only what the upload actually needs: writing release assets.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout this repository (for the manifest template)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      - name: Render the manifest from the template
        run: |
          set -euo pipefail
          amd64="$(awk '$2 ~ /tobby-windows-amd64\.exe$/ {print $1}' dist/SHA256SUMS)"
          arm64="$(awk '$2 ~ /tobby-windows-arm64\.exe$/ {print $1}' dist/SHA256SUMS)"
          for v in "$amd64" "$arm64"; do
            [ "${#v}" -eq 64 ] || { echo "::error::missing or malformed windows checksum"; exit 1; }
          done
          VERSION="${VERSION#v}" AMD64="$amd64" ARM64="$arm64" python3 - <<'PY'
          import json, os, re, pathlib
          version = os.environ["VERSION"]
          it = iter([os.environ["AMD64"], os.environ["ARM64"]])  # template order: 64bit, then arm64
          s = pathlib.Path("packaging/scoop/tobby.json").read_text()
          s = re.sub(r'^(\s*"version": )"0\.0\.0"',
                     lambda m: f'{m.group(1)}"{version}"', s, count=1, flags=re.M)
          # Only the pinned download URLs carry the placeholder tag; the
          # autoupdate block uses Scoop's own "$version" and must stay literal.
          s = s.replace("/releases/download/v0.0.0/", f"/releases/download/v{version}/")
          s = re.sub(r'^(\s*"hash": )"0{64}"',
                     lambda m: f'{m.group(1)}"{next(it)}"', s, flags=re.M)
          json.loads(s)  # a manifest that does not parse is not a manifest
          out = pathlib.Path("rendered-scoop")
          out.mkdir(exist_ok=True)
          (out / "tobby.json").write_text(s)
          PY
      - name: Verify the substitution actually applied
        run: |
          set -euo pipefail
          f=rendered-scoop/tobby.json
          grep -q "\"version\": \"${VERSION#v}\"" "$f" \
            || { echo "::error::version substitution did not apply in $f"; exit 1; }
          ! grep -q '/releases/download/v0\.0\.0/' "$f" \
            || { echo "::error::a tag placeholder survived in $f"; exit 1; }
          ! grep -qE '"hash": "0{64}"' "$f" \
            || { echo "::error::a checksum placeholder survived in $f"; exit 1; }
          grep -q "\"hash\": \"$(awk '$2 ~ /tobby-windows-amd64\.exe$/ {print $1}' dist/SHA256SUMS)\"" "$f" \
            || { echo "::error::the 64bit checksum is not the one this run built"; exit 1; }
          grep -q "\"hash\": \"$(awk '$2 ~ /tobby-windows-arm64\.exe$/ {print $1}' dist/SHA256SUMS)\"" "$f" \
            || { echo "::error::the arm64 checksum is not the one this run built"; exit 1; }
      - name: Attach the rendered manifest to the release
        if: needs.build.outputs.dry_run == 'false' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: >
          gh release upload "${VERSION}"
          rendered-scoop/tobby.json
          --clobber
      - name: "Dry run: keep the rendered manifest, attach nothing"
        if: needs.build.outputs.dry_run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dry-run-scoop
          path: rendered-scoop/
          if-no-files-found: error
      # Both branches below fail, for two different reasons, and both say so
      # out loud. The token is read only to tell those reasons apart — it is
      # never used to write anything, here or anywhere else in this file.
      # A rehearsal skips the hand-off: there is no release to hand off from.
      - name: Hand off to the bucket, or fail loudly if it was left behind
        if: needs.build.outputs.dry_run == 'false' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            # The bucket exists and follows releases on its own: the manifest
            # carries checkver and autoupdate, and the bucket's own
            # scoop-update workflow does the same read on demand. Nothing is
            # left behind here, so nothing is red. Setting SCOOP_BUCKET_TOKEN
            # is the switch that says "this chain pushes now" — see below.
            echo "::notice::The Scoop manifest for ${VERSION} is rendered and attached to this release."
            {
              echo "### Scoop manifest rendered"
              echo
              echo "\`tobby.json\` for ${VERSION} is attached to this release, with the"
              echo "checksums this run built."
              echo
              echo "The bucket at [tobby-fetch/scoop-bucket](https://github.com/tobby-fetch/scoop-bucket)"
              echo "follows releases itself — the manifest carries \`checkver\` and"
              echo "\`autoupdate\`, and the bucket's **Update manifest** workflow performs"
              echo "the same read on demand. One file, one owner."
              echo
              echo "Users install with:"
              echo
              echo '```powershell'
              echo "scoop bucket add tobby https://github.com/tobby-fetch/scoop-bucket"
              echo "scoop install tobby"
              echo '```'
              echo
              echo "Set \`SCOOP_BUCKET_TOKEN\` only if this chain should push into the"
              echo "bucket instead. It would then own the file, the bucket's own workflow"
              echo "would become the recovery path rather than the route, and a release"
              echo "that rendered a manifest nobody delivered would turn this job red."
            } >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          # The token exists, so someone decided this chain should feed the
          # bucket. A version rendered and not delivered is now a real gap.
          echo "::error::The Scoop manifest for ${VERSION} is rendered and attached to the"
          echo "::error::release as tobby.json — and this workflow pushed it nowhere."
          echo "::error::SCOOP_BUCKET_TOKEN is set, which says this chain owns the bucket"
          echo "::error::copy, but the push step is not wired. Either add it here on"
          echo "::error::purpose, or remove the secret and let the bucket keep following"
          echo "::error::releases through its own checkver/autoupdate workflow."
          exit 1

  # SLSA Build L3 provenance for the binaries, uploaded to the release by
  # the isolated trusted builder itself (not by this workflow). A rehearsal
  # generates it all the same and leaves it as a workflow artifact of the
  # generator, since there is no release to upload it to.
  # MUST be referenced by tag (slsa-verifier requirement — see header note).
  provenance:
    name: SLSA provenance (binaries)
    needs: [build, release]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      provenance-name: tobby.intoto.jsonl
      upload-assets: ${{ needs.build.outputs.dry_run == 'false' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
      upload-tag-name: ${{ needs.build.outputs.version }}
