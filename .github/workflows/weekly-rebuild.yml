# Weekly image rebuild (ADR-0011): rebuild the latest release image against
# the current Wolfi package set and re-run the Trivy gate, so the "current"
# image does not silently accumulate CVEs between releases.
#
# The rebuilt image is scanned BEFORE anything is published: on a clean scan
# it is pushed under a dated `rebuild-YYYYMMDD` tag, the `latest` tag is
# moved to it, and the digest is cosign-signed (keyless). The immutable
# `vX.Y.Z` tag and digest published at release time are never touched, so
# release provenance stays valid. The rebuilt digest carries a cosign
# signature but no SLSA provenance (it is not a tagged release build).
#
# A scan failure fails the workflow loudly and publishes nothing — the
# signal that a patch release should be cut.
name: Weekly image rebuild

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=chainguard-dev/melange
  MELANGE_VERSION: v0.58.0
  # renovate: datasource=github-releases depName=chainguard-dev/apko
  APKO_VERSION: v1.2.36
  # renovate: datasource=github-releases depName=google/go-containerregistry
  CRANE_VERSION: v0.21.9

jobs:
  rebuild:
    name: Rebuild latest release image on current Wolfi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore keyless signing of the rebuilt digest
    steps:
      - name: Resolve the latest release tag
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.latest.outputs.tag }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install melange, apko, and crane (version pinned, sumdb-verified)
        run: |
          go install "chainguard.dev/melange@${MELANGE_VERSION}"
          go install "chainguard.dev/apko@${APKO_VERSION}"
          go install "github.com/google/go-containerregistry/cmd/crane@${CRANE_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Stamp release metadata (same values as the tagged release build)
        id: meta
        run: |
          sde="$(git log -1 --format=%ct)"
          mkdir -p .release-meta
          git rev-parse HEAD > .release-meta/commit
          date -u -d "@${sde}" +%Y-%m-%dT%H:%M:%SZ > .release-meta/date
          echo "${sde}" > .release-meta/source-date-epoch
          echo "source_date_epoch=${sde}" >> "$GITHUB_OUTPUT"
          version="${{ steps.latest.outputs.tag }}"
          melange bump melange.yaml "${version#v}"
      - name: Rebuild the tobby apk against current Wolfi (melange)
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.source_date_epoch }}
        run: |
          melange keygen
          melange build melange.yaml \
            --arch x86_64,aarch64 \
            --signing-key melange.rsa \
            --source-dir . \
            --out-dir packages \
            --runner docker
      - name: Publish the rebuilt image under a dated candidate tag (apko)
        id: publish
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.source_date_epoch }}
        run: |
          apko login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          image="ghcr.io/${{ github.repository }}"
          candidate="rebuild-$(date -u +%Y%m%d)"
          mkdir -p image-sboms
          ref="$(apko publish apko.yaml "${image}:${candidate}" \
            --repository-append packages \
            --keyring-append melange.rsa.pub \
            --sbom-path image-sboms)"
          echo "published: ${ref}"
          {
            echo "image=${image}"
            echo "digest=${ref#*@}"
          } >> "$GITHUB_OUTPUT"
      - name: Trivy gate — critical and high fail the rebuild
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: image
          image-ref: "${{ steps.publish.outputs.image }}@${{ steps.publish.outputs.digest }}"
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Promote the clean rebuild to `latest` and sign it
        run: |
          crane tag "${{ steps.publish.outputs.image }}@${{ steps.publish.outputs.digest }}" latest
          cosign sign --yes "${{ steps.publish.outputs.image }}@${{ steps.publish.outputs.digest }}"
