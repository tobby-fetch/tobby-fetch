# Long fuzzing run (hardening, DEVELOPMENT-PLAN §2.7). The per-change gate is
# the `fuzz` job of ci.yml (30 s per target); this one gives every target
# fifteen minutes, weekly and on demand, because the interesting inputs of a
# parser are the ones a thirty-second run never reaches.
#
# Targets are discovered by tools/fuzz.sh. A failing input is uploaded as an
# artifact: commit it under testdata/fuzz/<Target>/ together with the fix.
name: Fuzz (long)

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        default: "900"
        required: false

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzzing (long)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz every target
        env:
          SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || '900' }}
        run: sh tools/fuzz.sh "$SECONDS_PER_TARGET"
      - name: Keep the failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
