# CI — the blocking quality gates of the five-level test pyramid
# (public feature 1.5; DEVELOPMENT-PLAN §4, NFR-016).
#
# Every job gates merges. Third-party actions are pinned by full commit SHA
# (ADR-0011 supply-chain policy).
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "**.md"

permissions:
  contents: read

jobs:
  lint:
    name: Lint (strict, zero suppressions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.6.1
      # The cross-compile job below builds the release targets, which is
      # NON-TEST code only. The Windows-only test files — the access-list
      # assertions of internal/secretfile, anything a future
      # `_windows_test.go` adds — are type-checked by nothing on a Linux
      # runner, and one of them shipped with a missing import that no job
      # could see. `go vet` compiles the test files too, so this is the
      # cheap half of the Windows matrix entry: it catches the rot in
      # seconds, on every pull request, without waiting for a runner
      # (NFR-018).
      - name: Vet the Windows build, test files included
        env:
          GOOS: windows
        run: go vet ./...

  test:
    name: Tests (race, anti-flaky, coverage floor)
    strategy:
      matrix:
        # Both release architectures are first-class in CI (milestone 1
        # exit criterion: green on linux/amd64 and linux/arm64). macOS runs
        # the same full suite: the darwin binaries are a convenience tier
        # (NFR-001) — unit/integration-tested here, e2e-validated only on
        # the Linux and Windows operating scope (NFR-018).
        #
        # Windows is in the OPERATING scope (NFR-018: the mirror
        # workstation), and until this entry existed it was covered by
        # nothing but cross-compilation — a check that the code parses,
        # not that it runs. Two whole source files, the FR-055 volume
        # inspector and the NFR-020 access-list hardening, were written,
        # merged and released without ever executing. They execute here.
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # FR-076 is a claim about REAL clients: test/ocilogin drives docker,
      # helm and oras against the embedded registry over a real socket, and
      # skips — loudly, but skips — when a binary is missing. Neither helm
      # nor oras is guaranteed on a runner image, so the FR-076 half of the
      # suite was passing by not running. Installing them here is what turns
      # those skips into checks.
      #
      # Both are fetched by direct download and verified against a pinned
      # SHA-256. ADR-0011 forbids trusting a tag for a third-party action;
      # the same rule applies to a tarball, and a checksum downloaded next
      # to the artifact it vouches for would vouch for nothing.
      #
      # macOS is deliberately left out: darwin is the convenience tier
      # (NFR-001), e2e-validated on the Linux and Windows operating scope
      # (NFR-018), and the skip message there names the missing binary.
      - name: Install the OCI clients FR-076 is about (helm, oras)
        if: runner.os == 'Linux'
        env:
          HELM_VERSION: "4.2.3"
          ORAS_VERSION: "1.3.0"
        run: |
          set -eu
          case "$(uname -m)" in
            x86_64)  arch=amd64
                     helm_sha=e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c
                     oras_sha=6cdc692f929100feb08aa8de584d02f7bcc30ec7d88bc2adc2054d782db57c64 ;;
            aarch64) arch=arm64
                     helm_sha=21abd9354d39b2cd79a8d76be6912cd137a983cbf997193503fb8a6a6e2f2785
                     oras_sha=7649738b48fde10542bcc8b0e9b460ba83936c75fb5be01ee6d4443764a14352 ;;
            *) echo "::error::unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/helm.tgz" \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-${arch}.tar.gz"
          echo "${helm_sha}  ${tmp}/helm.tgz" | sha256sum -c -
          tar -xzf "$tmp/helm.tgz" -C "$tmp"
          sudo install -m 0755 "$tmp/linux-${arch}/helm" /usr/local/bin/helm
          curl -fsSL -o "$tmp/oras.tgz" \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_${arch}.tar.gz"
          echo "${oras_sha}  ${tmp}/oras.tgz" | sha256sum -c -
          tar -xzf "$tmp/oras.tgz" -C "$tmp" oras
          sudo install -m 0755 "$tmp/oras" /usr/local/bin/oras
          rm -rf "$tmp"
      # A run where the clients silently went missing again would look
      # exactly like a green one, so the versions taken from the
      # environment are printed before anything uses them.
      - name: Report the OCI clients taken from the environment
        if: runner.os == 'Linux'
        run: |
          helm version --short
          oras version
          docker --version
      # The race detector links a prebuilt runtime through cgo, so it needs
      # a C toolchain — which the Windows runner image ships and nothing in
      # this repository pins. Printing it makes a runner that lost it fail
      # here, with the name of what is missing, instead of thirty lines
      # into a link error.
      - name: Report the C toolchain the race detector links through
        if: runner.os == 'Windows'
        run: gcc --version
      # NFR-018 puts the mirror workstation on Windows, and the volume
      # inspector written for it (internal/preflight/fs_windows.go:
      # GetVolumePathNameW, GetVolumeInformationW, GetDiskFreeSpaceExW) has
      # never run against the filesystem it exists for. The realistic case
      # is a USB stick formatted FAT32 on a Windows workstation — the one
      # FR-055 refuses a > 4 GiB blob on — so the runner makes a real one:
      # diskpart creates a virtual disk, the Storage module partitions and
      # formats it FAT32, and it is mounted on a drive letter.
      #
      # Nothing is downloaded (NFR-019): diskpart and the Storage module
      # are the operating system's own. The step fails hard rather than
      # skipping, because a FAT32 detector "covered" by a volume that was
      # never attached is exactly the shape of coverage this milestone
      # exists to remove.
      - name: Attach a real FAT32 volume (FR-055 detector, NFR-018)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vhd = Join-Path $env:RUNNER_TEMP 'tobby-fat32.vhdx'
          # diskpart, not New-VHD: the Hyper-V PowerShell module is not
          # installed on the runner image, and diskpart's virtual-disk
          # service is part of the base operating system.
          #
          # 512 MiB expandable: `format fs=fat32` needs a volume large
          # enough for FAT32 rather than FAT16, and "expandable" means the
          # runner writes a few hundred kilobytes, not half a gigabyte.
          $script = Join-Path $env:RUNNER_TEMP 'attach.txt'
          @(
            "create vdisk file=`"$vhd`" maximum=512 type=expandable",
            "select vdisk file=`"$vhd`"",
            "attach vdisk"
          ) | Set-Content -Encoding ascii $script
          diskpart /s $script
          if ($LASTEXITCODE -ne 0) { throw "diskpart could not create or attach $vhd" }
          # The virtual disk is surfaced by a driver, not by diskpart's own
          # return: it can take a moment to appear in the storage stack, and
          # a bare Get-Disk immediately after the attach sometimes misses it.
          $disk = $null
          foreach ($attempt in 1..20) {
            $disk = Get-Disk | Where-Object { $_.Location -eq $vhd }
            if ($disk) { break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $disk) { throw "the attached virtual disk never appeared in Get-Disk" }
          if ($disk.PartitionStyle -eq 'RAW') {
            Initialize-Disk -Number $disk.Number -PartitionStyle MBR | Out-Null
          }
          New-Partition -DiskNumber $disk.Number -UseMaximumSize -DriveLetter T |
            Format-Volume -FileSystem FAT32 -NewFileSystemLabel TOBBYFAT -Confirm:$false |
            Out-Null
          $vol = Get-Volume -DriveLetter T
          if ($vol.FileSystem -ne 'FAT32') {
            throw "the volume formatted as $($vol.FileSystem), not FAT32 — the FR-055 case would not be exercised"
          }
          "T:\ is $($vol.FileSystem), $($vol.Size) bytes"
          # The test reads the volume from here; TOBBY_PREFLIGHT_REQUIRE_FAT32
          # turns a missing one into a failure rather than a skip.
          "TOBBY_PREFLIGHT_FAT32_PATH=T:\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TOBBY_PREFLIGHT_REQUIRE_FAT32=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # TOBBY_OCILOGIN_REQUIRE_DOCKER turns the docker FR-076 subtest
      # skips into failures on the operating scope where they can actually
      # run. Their TLS half spent a whole release skipping everywhere at
      # once — on loopback because Docker disables verification there, and
      # on macOS because the platform verifier ignores SSL_CERT_FILE — and
      # a suite that reports "ok" for a check it never performed is worse
      # than one that has no check at all.
      - name: Unit and integration tests
        env:
          TOBBY_OCILOGIN_REQUIRE_DOCKER: ${{ runner.os == 'Linux' && '1' || '' }}
        # -timeout: the default is ten minutes PER PACKAGE, and internal/ui
        # is now large enough that the slower runner architecture used to
        # hit it under -race -count=2. The fixture cost was cut where it
        # belonged (the account fixture is hashed once per package, not
        # once per test), and this margin exists so the next screen added
        # reports a real failure rather than a timeout. Raised to the
        # figure the release gates use when Windows joined the matrix: its
        # filesystem is slower than both others at everything this suite
        # does, and a timeout there would read as a hang rather than as
        # what it is.
        run: go test -race -count=2 -timeout 45m ./...
      # `sh` on the Windows runner is Git Bash, which is why this step
      # names its shell rather than inheriting pwsh. The floor is checked
      # on every runner on purpose: internal/preflight and
      # internal/secretfile each carry a file that only COMPILES on
      # Windows, so their Windows halves are covered by this run alone.
      - name: Per-package coverage floor (NFR-016)
        shell: bash
        run: sh tools/check-coverage.sh

  cross-compile:
    name: Cross-compile (linux, windows, darwin — amd64/arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build every release target
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=linux   GOARCH=amd64 go build -trimpath -o /dev/null ./cmd/tobby
          GOOS=linux   GOARCH=arm64 go build -trimpath -o /dev/null ./cmd/tobby
          GOOS=windows GOARCH=amd64 go build -trimpath -o /dev/null ./cmd/tobby
          GOOS=windows GOARCH=arm64 go build -trimpath -o /dev/null ./cmd/tobby
          GOOS=darwin  GOARCH=amd64 go build -trimpath -o /dev/null ./cmd/tobby
          GOOS=darwin  GOARCH=arm64 go build -trimpath -o /dev/null ./cmd/tobby

  licenses:
    name: License compliance (GPL-3.0 compatibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # --include_tests and the `browser` tag bring the test-only tree into
      # the check: chromedp (R-38) is a dependency of the build like any
      # other, and an allowlist that never saw it would be decorative.
      - name: Check every dependency against the allowlist (ADR-0011)
        env:
          GOFLAGS: -tags=browser
        run: >
          go run github.com/google/go-licenses/v2@v2.0.1 check --include_tests
          --allowed_licenses=Apache-2.0,BSD-2-Clause,BSD-3-Clause,MIT,ISC,MPL-2.0,Unlicense,Zlib,GPL-3.0
          ./...

  e2e-topology:
    name: Hermetic topology scenario (milestone gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The milestone-4 scenario deploys its instance from the reference
      # chart (DEVELOPMENT-PLAN §2.4), so helm is part of the harness here.
      # Pinned and checksummed for the same reason as everywhere else
      # (ADR-0011).
      - name: Install helm (the m4 scenario deploys from the reference chart)
        env:
          HELM_VERSION: "4.2.3"
        run: |
          set -eu
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/helm.tgz" \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c  ${tmp}/helm.tgz" |
            sha256sum -c -
          tar -xzf "$tmp/helm.tgz" -C "$tmp"
          sudo install -m 0755 "$tmp/linux-amd64/helm" /usr/local/bin/helm
          rm -rf "$tmp"
          helm version --short
      - name: Milestone-1 scenario — registry round-trip, egress canary, media round-trip
        run: sh test/topology/scenario-m1.sh
      - name: Publish the raw check report (m1)
        if: always()
        run: cat /tmp/tobby-topology-m1-report.txt >> "$GITHUB_STEP_SUMMARY" || true
      # Milestone 2: the secure user-experience slice — the R-01 refusal
      # to start without an account, RFC 9457 + Basic challenge on every
      # surface, a unit import driven through /api/v1, bit-exact digests,
      # a standard third-party client pull, idempotence.
      - name: Milestone-2 scenario — secure posture, API import, standard-client pull
        run: sh test/topology/scenario-m2.sh
      - name: Publish the raw check report (m2)
        if: always()
        run: cat /tmp/tobby-topology-m2-report.txt >> "$GITHUB_STEP_SUMMARY" || true
      # Milestone 3: the signed recipe engine — Retriever synchronization
      # with REAL cosign signatures (the runner image's cosign, or the
      # pinned build when absent), the foreign-signature refusal, and the
      # FR-036 cascade through source substitution on a segment that has
      # no route to the source registry.
      - name: Milestone-3 scenario — signed recipes, cosign verification, cascade
        run: sh test/topology/scenario-m3.sh
      - name: Publish the raw check report (m3)
        if: always()
        run: cat /tmp/tobby-topology-m3-report.txt >> "$GITHUB_STEP_SUMMARY" || true
      # Milestone 4: continuous promotion between two connected zones, the
      # allow-list refusal, the secure-by-default posture and its documented
      # override, and the same passthrough with direct egress blocked —
      # every outbound byte through an authenticated proxy, the destination
      # behind a private certificate authority.
      - name: Milestone-4 scenario — passthrough, allow-list, proxy, private PKI
        run: sh test/topology/scenario-m4.sh
      - name: Publish the raw check report (m4)
        if: always()
        run: cat /tmp/tobby-topology-m4-report.txt >> "$GITHUB_STEP_SUMMARY" || true

  e2e-browser:
    name: Browser non-regression (R-38, chromedp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Chrome comes with the runner image and is NEVER downloaded by the
      # suite (NFR-019). Failing here, loudly, beats a suite that silently
      # skips itself on a runner that lost its browser.
      - name: Report the browser taken from the environment
        run: google-chrome --version
      # The scenarios live behind the `browser` build tag so `go test ./...`
      # keeps its pace; -count=2 is the anti-flaky rule of the pyramid, and
      # TOBBY_E2E_REQUIRE_CHROME turns "no browser" into a failure instead
      # of a skip.
      - name: Browser scenarios (B-001, B-002, B-005, B-011, R-37)
        env:
          TOBBY_E2E_REQUIRE_CHROME: "1"
        run: go test -tags browser -count=2 -timeout 20m ./test/browser/...

  govulncheck:
    name: Known vulnerabilities (govulncheck, reachability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Trivy (below) matches versions; govulncheck adds what Trivy cannot:
      # symbol-level reachability, stdlib included — a finding here is a
      # call path into a vulnerable function, not a manifest match. The
      # version is pinned and sumdb-verified by `go install` (ADR-0011),
      # and tracked by renovate through the hint comment.
      - name: Install govulncheck (version pinned, sumdb-verified)
        env:
          # renovate: datasource=go depName=golang.org/x/vuln
          GOVULNCHECK_VERSION: v1.7.0
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Reachable known vulnerabilities (stdlib included)
        run: govulncheck ./...

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scan covers every commit ever pushed, not the checkout tip:
          # a secret is leaked the moment it enters the history, and a fix
          # commit does not un-leak it.
          fetch-depth: 0
      # The same gitleaks the local pre-commit hook runs (.githooks,
      # mise.toml), at the same version — but as a blocking gate: the hook
      # is a per-clone opt-in (`mise run setup`), and an opt-in is not a
      # guarantee. Fetched by direct download and verified against a
      # pinned SHA-256, like helm and oras above (ADR-0011). The version
      # deliberately carries no renovate hint: a bump must come with the
      # new checksum, so it stays a reviewed edit alongside mise.toml's
      # gitleaks entry rather than an automated one.
      - name: Install gitleaks (version pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -eu
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${tmp}/gitleaks.tgz" |
            sha256sum -c -
          tar -xzf "$tmp/gitleaks.tgz" -C "$tmp" gitleaks
          sudo install -m 0755 "$tmp/gitleaks" /usr/local/bin/gitleaks
          rm -rf "$tmp"
          gitleaks version
      - name: Scan the full history (rules from .gitleaks.toml)
        run: gitleaks git --redact --no-banner .

  vulnerabilities:
    name: Vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No ignore mechanism of any kind lives here. The day a finding must
      # be waived, it comes as an OpenVEX statement (.vex/README.md) wired
      # into this step via TRIVY_VEX — never a .trivyignore.
      - name: Scan dependencies — critical and high block the merge
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          skip-dirs: website
