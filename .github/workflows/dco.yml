# DCO enforcement — every commit in a pull request must carry a valid
# `Signed-off-by` trailer (DEVELOPMENT-PLAN.md §6, ADR-0003). Implemented as
# a plain shell check over `git log`, no third-party sign-off action:
# checkout is the only external dependency, pinned by full commit SHA
# (ADR-0011 supply-chain policy).
name: DCO

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: Sign-off check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Every commit must be signed off
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          echo "Checking commit range ${BASE_SHA}..${HEAD_SHA}"
          commits="$(git log --no-merges --format='%H' "${BASE_SHA}..${HEAD_SHA}")"

          if [ -z "${commits}" ]; then
            echo "No non-merge commits in range — nothing to check."
            exit 0
          fi

          missing=0
          for sha in ${commits}; do
            subject="$(git log -1 --format='%s' "${sha}")"
            body="$(git log -1 --format='%b' "${sha}")"
            author_email="$(git log -1 --format='%ae' "${sha}")"

            if ! printf '%s\n' "${body}" | grep -qiE '^Signed-off-by: .+ <[^[:space:]]+@[^[:space:]]+>$'; then
              echo "::error::Commit ${sha} (\"${subject}\") has no 'Signed-off-by' trailer."
              missing=1
              continue
            fi

            if ! printf '%s\n' "${body}" | grep -qiF "<${author_email}>"; then
              echo "::warning::Commit ${sha} (\"${subject}\") is signed off, but not with the commit author's email (${author_email})."
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            echo ""
            echo "One or more commits are missing DCO sign-off."
            echo "Fix locally, e.g.: git rebase --signoff ${BASE_SHA}"
            echo "Then force-push the branch. See CONTRIBUTING.md and https://developercertificate.org"
            exit 1
          fi

          echo "All commits are signed off."
