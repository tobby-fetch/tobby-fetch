# Temporary: proves HOMEBREW_TAP_TOKEN grants exactly what the release
# workflow needs and nothing more. Read-only — it writes nowhere.
# Delete once it has run green.
#
# Two earlier versions of this file asked the wrong question:
#
#   - `.permissions` on the repository API reports the role of the user
#     behind a fine-grained token, not the token's own grant, so it says
#     "admin" for a token that may only write files;
#   - plain reads prove nothing here, because all three repositories are
#     public and every token can read public data.
#
# `GET /repos/{o}/{r}/collaborators` is the discriminator: it is read-only,
# and GitHub requires *push* access to answer it. A token that can list the
# collaborators of a repository can write to that repository.
name: Verify tap token

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    name: Token scope and permissions
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Write access is limited to the tap
        run: |
          set -euo pipefail
          fail=0
          for repo in tobby-fetch/tobby-fetch tobby-fetch/recipe-spec; do
            if gh api "repos/${repo}/collaborators" >/dev/null 2>&1; then
              echo "::error::the token has WRITE access to ${repo} — it is not restricted to the tap"
              fail=1
            else
              echo "✓ no write access to ${repo}"
            fi
          done
          exit $fail

      - name: Cannot read the tap's Actions secrets
        run: |
          set -euo pipefail
          if gh api repos/tobby-fetch/homebrew-tap/actions/secrets >/dev/null 2>&1; then
            echo "::error::the token can list the tap's Actions secrets"
            exit 1
          fi
          echo "✓ no secrets access on the tap"

      - name: The formula file is reachable — the one thing it is for
        run: |
          set -euo pipefail
          gh api repos/tobby-fetch/homebrew-tap/contents/Formula/tobby.rb --jq .sha
          echo "✓ the formula is readable, and Contents:write covers the push"
