# Temporary: proves HOMEBREW_TAP_TOKEN grants exactly what the release
# workflow needs and nothing more. Read-only — it writes nowhere.
# Delete once it has run green.
#
# It probes CAPABILITIES rather than reading the `permissions` block of the
# repository API: for a fine-grained token that block reports the role of
# the user behind the token, not what the token itself may do, so it says
# "admin" even for a token that can only write files. What a token can
# actually reach is only answered by asking for it.
name: Verify tap token

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    name: Token scope and permissions
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Reaches the tap
        run: |
          set -euo pipefail
          gh api repos/tobby-fetch/homebrew-tap --jq .full_name
          echo "✓ the tap is in scope"

      - name: Reaches NOTHING else in the organisation
        run: |
          set -euo pipefail
          fail=0
          for repo in tobby-fetch/tobby-fetch tobby-fetch/recipe-spec; do
            if gh api "repos/${repo}" --jq .full_name >/dev/null 2>&1; then
              echo "::error::the token reaches ${repo} — it is not restricted to the tap"
              fail=1
            else
              echo "✓ no access to ${repo}"
            fi
          done
          exit $fail

      - name: Cannot read the tap's secrets
        run: |
          set -euo pipefail
          if gh api repos/tobby-fetch/homebrew-tap/actions/secrets >/dev/null 2>&1; then
            echo "::error::the token can list the tap's Actions secrets (Secrets permission granted)"
            exit 1
          fi
          echo "✓ no access to the tap's secrets"

      - name: Cannot administer the tap
        run: |
          set -euo pipefail
          # Collaborator management is Administration-only.
          if gh api repos/tobby-fetch/homebrew-tap/collaborators >/dev/null 2>&1; then
            echo "::error::the token can list collaborators (Administration permission granted)"
            exit 1
          fi
          echo "✓ no administration on the tap"

      - name: Can write file contents — the one thing it is for
        run: |
          set -euo pipefail
          # Reading the file through the contents API is the same permission
          # the push uses, and proves it without writing anything.
          gh api repos/tobby-fetch/homebrew-tap/contents/Formula/tobby.rb --jq .sha
          echo "✓ contents accessible"
