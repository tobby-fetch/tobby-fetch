{{/*
SPDX-License-Identifier: GPL-3.0-only
Copyright © 2026 infraBuilder SASU and contributors

The configuration file. A Secret rather than a ConfigMap: the file itself
holds no credential by design (FR-004 keeps registry credentials in a
separate dockerconfigjson payload), but it does describe the instance's
trust perimeter, and it is the kind of object that grows secrets over time.
Skipped entirely when existingConfigSecret points at one you manage.
*/}}
{{- if not .Values.existingConfigSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tobby.configSecretName" . }}
  labels:
    {{- include "tobby.labels" . | nindent 4 }}
    app.kubernetes.io/component: instance
type: Opaque
stringData:
  config.yaml: |
    # SPDX-License-Identifier: GPL-3.0-only
    # Copyright © 2026 infraBuilder SASU and contributors
    #
    # Rendered by the tobby Helm chart. Do not edit in place: the next
    # `helm upgrade` overwrites it. Change the chart values instead.
    {{- include "tobby.config" . | nindent 4 }}
{{- end }}
