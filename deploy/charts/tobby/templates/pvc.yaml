{{/*
SPDX-License-Identifier: GPL-3.0-only
Copyright © 2026 infraBuilder SASU and contributors

Two claims, never one.

The store is the transportable unit: artifacts, recipes and operation logs,
self-contained and relocatable. The state directory is the instance's
identity: accounts, tokens, and the secrets that follow them. Keeping them
apart is what lets the store cross a network boundary without carrying
credentials with it, and it is why the state claim — not the store — is the
directory to back up. Tobby refuses to start if one root sits inside the
other.
*/}}
{{- if and .Values.persistence.storage.enabled (not .Values.persistence.storage.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-store" (include "tobby.fullname" .) }}
  labels:
    {{- include "tobby.labels" . | nindent 4 }}
    app.kubernetes.io/component: store
  annotations:
    # The store survives an uninstall: it holds content that may have been
    # expensive — or physically slow — to bring into this zone.
    helm.sh/resource-policy: keep
    {{- with .Values.persistence.storage.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.storage.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.storage.size | quote }}
  {{- if .Values.persistence.storage.storageClassName }}
  storageClassName: {{ .Values.persistence.storage.storageClassName | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.persistence.state.enabled (not .Values.persistence.state.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-state" (include "tobby.fullname" .) }}
  labels:
    {{- include "tobby.labels" . | nindent 4 }}
    app.kubernetes.io/component: state
  annotations:
    # Losing this claim loses every account and token of the instance.
    helm.sh/resource-policy: keep
    {{- with .Values.persistence.state.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.state.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.state.size | quote }}
  {{- if .Values.persistence.state.storageClassName }}
  storageClassName: {{ .Values.persistence.state.storageClassName | quote }}
  {{- end }}
{{- end }}
