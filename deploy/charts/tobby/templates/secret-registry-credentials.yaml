SPDX-License-Identifier: GPL-3.0-only
Copyright © 2026 infraBuilder SASU and contributors

Registry credentials in the standard kubernetes.io/dockerconfigjson format
(FR-004). Tobby looks them up by the host it actually contacts, so an entry
must name the effective endpoint — the substitute registry, not the nominal
one, when registries.substitutions is in play.

Only rendered when the payload is given inline. With
registryCredentials.existingSecret the chart mounts your Secret and creates
nothing.
*/}}
{{- if and .Values.registryCredentials.enabled .Values.registryCredentials.dockerconfigjson (not .Values.registryCredentials.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-registry-credentials" (include "tobby.fullname" .) }}
  labels:
    {{- include "tobby.labels" . | nindent 4 }}
    app.kubernetes.io/component: instance
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.registryCredentials.dockerconfigjson | b64enc | quote }}
{{- end }}
