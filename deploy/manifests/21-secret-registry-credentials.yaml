#
# Registry credentials in the standard kubernetes.io/dockerconfigjson
# format (FR-004). Tobby looks an entry up by the host it actually
# contacts, so name the effective endpoint — the substitute registry, not
# the nominal one, when registries.substitutions is in play.
#
# Applied as-is this Secret grants nothing: the payload below is an empty
# credential set, which is exactly what an anonymous-only deployment needs.
# Fill it in with one of:
#
#   kubectl -n tobby create secret docker-registry tobby-registry-credentials \
#     --docker-server=registry.example.com \
#     --docker-username=tobby \
#     --docker-password="$(cat /path/to/token)"
#
# or by replacing the payload below:
#
#   {"auths":{"registry.example.com":{"username":"tobby","password":"..."}}}
#
# Do not commit real credentials to version control. In a cluster with
# external-secrets or sealed-secrets, produce this Secret from there
# instead and delete this file.
apiVersion: v1
kind: Secret
metadata:
  name: tobby-registry-credentials
  namespace: tobby
  labels:
    app.kubernetes.io/name: tobby
    app.kubernetes.io/instance: tobby
    app.kubernetes.io/component: instance
    app.kubernetes.io/part-of: tobby
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{}}
