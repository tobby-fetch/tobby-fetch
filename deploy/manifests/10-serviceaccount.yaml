#
# A dedicated ServiceAccount with no RBAC attached to it. Tobby never calls
# the Kubernetes API, so no token is projected into the pod either: an
# identity that cannot do anything is one less thing to reason about after
# a compromise.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tobby
  namespace: tobby
  labels:
    app.kubernetes.io/name: tobby
    app.kubernetes.io/instance: tobby
    app.kubernetes.io/component: instance
    app.kubernetes.io/part-of: tobby
automountServiceAccountToken: false
