#
# Tobby's configuration file, mounted at its default location
# /etc/tobby/config.yaml — which is why the container command is a bare
# `serve` with no --config.
#
# This is the lowest of the three configuration layers. TOBBY_* environment
# variables on the container override anything here, and flags appended
# after `serve` override both (FR-003).
#
# A Secret rather than a ConfigMap: the file carries no credential by
# construction (registry credentials live in the separate dockerconfigjson
# payload of 21-secret-registry-credentials.yaml), but it does describe the
# instance's trust perimeter.
apiVersion: v1
kind: Secret
metadata:
  name: tobby-config
  namespace: tobby
  labels:
    app.kubernetes.io/name: tobby
    app.kubernetes.io/instance: tobby
    app.kubernetes.io/component: instance
    app.kubernetes.io/part-of: tobby
type: Opaque
stringData:
  config.yaml: |
    # Operating mode. Required, no default: an instance must state what it
    # is (FR-001). "passthrough" is a long-lived service between two
    # connected zones; "mirror" drives a transportable store across an air
    # gap.
    mode: passthrough

    # The transportable store: artifacts, recipes, operation logs.
    # Self-contained and relocatable — this is what crosses a zone
    # boundary.
    storage:
      root: /var/lib/tobby/store

    # The instance's identity: accounts, tokens, and the secrets that
    # follow. Strictly outside the store, on its own volume, and the one
    # directory to back up. Tobby refuses to start if either root is
    # nested inside the other.
    state:
      root: /var/lib/tobby/state

    server:
      # Must match the container port declared in 40-deployment.yaml.
      addr: ":8080"

    auth:
      # Secure by default. Setting this to true opens the UI, the API and
      # the embedded registry, and makes the UI show a permanent warning
      # banner (FR-075).
      disabled: false
      sessionTTL: 12h

    shutdown:
      # Budget for in-flight transfers to finish or checkpoint after
      # SIGTERM (FR-093). Keep terminationGracePeriodSeconds above it.
      gracePeriod: 30s

    sync:
      parallelism: 3
      retries: 3

    logging:
      level: info

    # Where the desired-state document comes from (FR-010): an HTTP(S)
    # URL, an OCI reference, or a path inside the container.
    retriever:
      source: ""

    registries:
      # Credentials for the registries Tobby reads from and writes to
      # (FR-004), in kubernetes.io/dockerconfigjson format, mounted from
      # 21-secret-registry-credentials.yaml. Comment this line out if you
      # do not apply that Secret.
      credentialsFile: /etc/tobby-registries/.dockerconfigjson
      # Hosts reachable over plain HTTP or unverifiable TLS. Per-host and
      # explicit — there is no global switch.
      # insecure:
      #   - registry.zone-a.example.com:5000
      # Fetch a nominal registry from a substitute endpoint without editing
      # the recipes (FR-036). Only the endpoint contacted changes; the
      # relocated path and the trust decision follow the nominal reference.
      # substitutions:
      #   docker.io: registry.zone-a.example.com/dockerhub

    # Signature verification is on by default for every recipe (FR-033).
    # Relaxation exists only as named, reported scopes — never globally.
    # trust:
    #   roots:
    #     - name: platform-team
    #       keyFile: /etc/tobby-trust/platform-team.pub
    #   scopes:
    #     - name: lab
    #       repositories: ["lab.example.com/cookbook/*"]
    #       allowUnsigned: true

    ui:
      showUpcoming: false
