#
# Tobby's configuration file, mounted at its default location
# /etc/tobby/config.yaml — which is why the container command is a bare
# `serve` with no --config.
#
# This is the lowest of the three configuration layers. TOBBY_* environment
# variables on the container override anything here, and flags appended
# after `serve` override both (FR-003).
#
# A Secret rather than a ConfigMap: the file carries no credential by
# construction (registry credentials live in the separate dockerconfigjson
# payload of 21-secret-registry-credentials.yaml), but it does describe the
# instance's trust perimeter.
apiVersion: v1
kind: Secret
metadata:
  name: tobby-config
  namespace: tobby
  labels:
    app.kubernetes.io/name: tobby
    app.kubernetes.io/instance: tobby
    app.kubernetes.io/component: instance
    app.kubernetes.io/part-of: tobby
type: Opaque
stringData:
  config.yaml: |
    # Operating mode. Required, no default: an instance must state what it
    # is (FR-001). "passthrough" is a long-lived service between two
    # connected zones; "mirror" drives a transportable store across an air
    # gap.
    mode: passthrough

    # The transportable store: artifacts, recipes, operation logs.
    # Self-contained and relocatable — this is what crosses a zone
    # boundary.
    storage:
      root: /var/lib/tobby/store

    # The instance's identity: accounts, tokens, and the secrets that
    # follow. Strictly outside the store, on its own volume, and the one
    # directory to back up. Tobby refuses to start if either root is
    # nested inside the other.
    state:
      root: /var/lib/tobby/state

    server:
      # Must match the container port declared in 40-deployment.yaml.
      addr: ":8080"
      # The certificate the listener presents (FR-082). One listener
      # carries the UI, the API and the embedded registry, so one
      # certificate covers all three.
      #
      # Supplying certFile and keyFile turns TLS on by itself; the files
      # are re-read when they change, so cert-manager rotating them in
      # place needs no restart. Setting `enabled: true` without a pair
      # makes Tobby generate a self-signed certificate and log its
      # SHA-256 fingerprint at startup — check that value against what
      # your client saw before trusting it.
      #
      # Leave the whole block out when a service mesh or an ingress
      # terminates TLS in front of the instance.
      # tls:
      #   enabled: true
      #   certFile: /etc/tobby-tls/tls.crt
      #   keyFile: /etc/tobby-tls/tls.key
      #   # Subject names of the generated fallback only; ignored when a
      #   # certificate is supplied.
      #   hosts:
      #     - tobby.example.com

    auth:
      # Secure by default. Setting this to true opens the UI, the API and
      # the embedded registry, and makes the UI show a permanent warning
      # banner (FR-075).
      disabled: false
      sessionTTL: 12h

    shutdown:
      # Budget for in-flight transfers to finish or checkpoint after
      # SIGTERM (FR-093). Keep terminationGracePeriodSeconds above it.
      gracePeriod: 30s

    sync:
      parallelism: 3
      retries: 3
      # How often a passthrough instance re-fetches the Retriever and
      # reconciles the destination (FR-013). 0 stops the loop; manual
      # synchronization still works. Changeable on a running instance
      # from /admin/retriever or PUT /api/v1/retriever/interval — the
      # override lands in the state directory and survives a restart.
      # Ignored in mirror mode, where FR-014 requires a manual trigger.
      interval: 15m

    transfer:
      # Blob size from which a download becomes resumable inside the blob
      # itself (FR-029): a multi-gigabyte layer cut at 90 % restarts at
      # 90 %, through an HTTP Range request, instead of at zero.
      # Resumable blobs transit the state volume before reaching the
      # store, so size that volume for the largest layers in flight at
      # once. 0 disables it and streams every blob straight through.
      resumeThreshold: 64MiB

    logging:
      level: info

    # Where the desired-state document comes from (FR-010): an HTTP(S)
    # URL, an OCI reference, or a path inside the container.
    retriever:
      source: ""

    # The zone registry this instance promotes into (FR-013). Leave the
    # registry empty and the instance fetches into its own store and
    # stops there. A bare host: the scheme follows registries.insecure
    # like it does on the reading side, and the repository path is
    # computed by the relocation convention (FR-035), never written by
    # hand. Pushing authenticates through registries.credentialsFile with
    # a write-scoped credential (FR-004) — the destination is NOT reached
    # through registries.substitutions, which only ever redirects reads.
    destination:
      registry: ""
      # registry: registry.zone-b.example.com
      # Optional path prefix every relocated ingredient lands under.
      # basePath: zone-b
      # Where recipes are re-published with their signatures (FR-034):
      # <registry>/<cookbook>/<name>:<version>.
      cookbook: cookbook

    # How this instance reaches the outside world (FR-080, FR-081). Every
    # outbound path — recipe engine, unit import, Helm repositories, the
    # retriever, trust roots fetched by URL, publication — uses this one
    # transport. There is no per-feature network setting, and no setting
    # anywhere that disables certificate verification: a registry behind
    # an internal PKI is reached by trusting its authority below, not by
    # dropping the check.
    # network:
    #   proxy:
    #     url: http://proxy.example.com:3128
    #     # Only when https:// destinations take a different route.
    #     # httpsURL: http://proxy.example.com:3129
    #     # Destinations reached directly: host, .suffix, or CIDR. The
    #     # peer zone's registry usually belongs here.
    #     noProxy:
    #       - .internal.example.com
    #       - 10.0.0.0/8
    #     username: tobby
    #     # NEVER write the password here. Supply it through
    #     # TOBBY_NETWORK_PROXY_PASSWORD from a Secret (see
    #     # 40-deployment.yaml): this file is mounted read-only but its
    #     # content is also what `tobby config dump` describes, and the
    #     # password is redacted there by construction either way.
    #   tls:
    #     # Authorities trusted on top of the public ones, for registries
    #     # and for the proxy alike.
    #     caFiles:
    #       - /etc/tobby-ca/internal-root.pem
    #     # Set to true on an instance whose every peer is internal: it
    #     # drops the public root store, which narrows trust rather than
    #     # widening it.
    #     exclusiveTrust: false

    registries:
      # Credentials for the registries Tobby reads from and writes to
      # (FR-004), in kubernetes.io/dockerconfigjson format, mounted from
      # 21-secret-registry-credentials.yaml. Comment this line out if you
      # do not apply that Secret.
      credentialsFile: /etc/tobby-registries/.dockerconfigjson
      # Hosts reachable over plain HTTP. Per-host and explicit — there is
      # no global switch (FR-075). This is NOT the answer to a registry
      # behind an internal PKI: that is network.tls above, which keeps
      # the peer authenticated.
      # insecure:
      #   - registry.zone-a.example.com:5000
      # Fetch a nominal registry from a substitute endpoint without editing
      # the recipes (FR-036). Only the endpoint contacted changes; the
      # relocated path and the trust decision follow the nominal reference.
      # substitutions:
      #   docker.io: registry.zone-a.example.com/dockerhub

    # Signature verification is on by default for every recipe (FR-033).
    # Relaxation exists only as named, reported scopes — never globally.
    # trust:
    #   roots:
    #     - name: platform-team
    #       keyFile: /etc/tobby-trust/platform-team.pub
    #   scopes:
    #     - name: lab
    #       repositories: ["lab.example.com/cookbook/*"]
    #       allowUnsigned: true

    ui:
      showUpcoming: false
