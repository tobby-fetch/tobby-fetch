# SPDX-License-Identifier: GPL-3.0-only
# English messages of the error taxonomy (R-03). One entry per code and
# section: <code>.what / .cause / .action. Corrective actions must be
# executable with the means of the current milestone (roadmap DoD).

"TBY-AUTH-001.what": "The instance refuses to start: no local account is configured."
"TBY-AUTH-001.cause": "No administrator account has been created on this instance yet, or its state directory was reset."
"TBY-AUTH-001.action": "On the instance host, run `tobby user add --role admin <name>` (the tool computes the password hash), then start the instance again. Tobby never starts with an open UI."

"TBY-AUTH-002.what": "Authentication failed."
"TBY-AUTH-002.cause": "The credentials are unknown or the password is wrong."
"TBY-AUTH-002.action": "Check the account name and password, then try again. Accounts are managed on the host with `tobby user`."

"TBY-AUTH-003.what": "This action is not allowed for your role."
"TBY-AUTH-003.cause": "It requires the {{.role}} role."
"TBY-AUTH-003.action": "Sign in with an account holding the {{.role}} role, or ask an administrator to grant it."

"TBY-AUTH-004.what": "The form could not be submitted safely."
"TBY-AUTH-004.cause": "The anti-forgery token is missing or has expired — the page was probably left open for a long time."
"TBY-AUTH-004.action": "The form has been reloaded with a fresh token: submit it again."

"TBY-AUTH-005.what": "Your session has expired."
"TBY-AUTH-005.cause": "No activity for longer than the idle timeout, the session reached its maximum lifetime, or the instance restarted."
"TBY-AUTH-005.action": "Sign in again; you will be returned to the page you were on."

"TBY-AUTH-006.what": "The current password is wrong."
"TBY-AUTH-006.cause": "The current password sent with the change request does not match the account's password."
"TBY-AUTH-006.action": "Type your current password again, then retry. If it is lost, an administrator can set a new one on the instance host with `tobby user passwd <name>`."

"TBY-AUTH-007.what": "The new password was rejected."
"TBY-AUTH-007.cause": "It is empty, identical to the current password, or its confirmation does not match."
"TBY-AUTH-007.action": "Choose a non-empty password different from the current one, type the same value in both new-password fields, then submit again."

"TBY-AUTH-008.what": "The account could not be created or updated."
"TBY-AUTH-008.cause": "The login is empty, the role is not one of viewer, operator, or admin, or the password is empty or was mistyped in the confirmation field."
"TBY-AUTH-008.action": "Give a non-empty login, pick one of the three roles, and type the same non-empty password in both password fields, then submit again."

"TBY-AUTH-009.what": "The account {{.name}} already exists."
"TBY-AUTH-009.cause": "This instance already holds a local account with that login; logins are unique."
"TBY-AUTH-009.action": "Choose another login, or manage the existing account from the accounts screen — its role can be changed and its password reset without creating a second one."

"TBY-AUTH-010.what": "No account named {{.name}} on this instance."
"TBY-AUTH-010.cause": "The account was removed, or the login is misspelled — the screen you acted from may predate the removal."
"TBY-AUTH-010.action": "Reload the accounts screen to see the current list, then retry on an account it shows."

"TBY-AUTH-011.what": "Refused: {{.name}} is the last administrator of this instance."
"TBY-AUTH-011.cause": "Removing it, or taking its admin role away, would leave nobody able to manage the instance — and an instance without an account refuses to start at all."
"TBY-AUTH-011.action": "Create a second admin account first, then retry. On the instance host the same result comes from `tobby user add --role admin <name>`."

"TBY-AUTH-012.what": "Too many failed authentication attempts from your network address; further attempts are temporarily refused."
"TBY-AUTH-012.cause": "Repeated wrong credentials were presented from the same origin. Each failed check is deliberately expensive to verify, so the instance throttles origins that keep failing rather than burn CPU and memory for them."
"TBY-AUTH-012.action": "Wait a moment, check the credential (account password or token secret), then try again. If this is a shared egress address, another client behind it may be misconfigured — the audit trail lists the failed attempts and the account names they claimed."

"TBY-AUTH-013.what": "The API token has expired."
"TBY-AUTH-013.cause": "The token was created with an expiry date, and that date has passed. An expired token is refused like a revoked one, and the refusal is audit-logged."
"TBY-AUTH-013.action": "Ask an administrator for a new token (the accounts screen or `POST /api/v1/tokens`), then replace the expired one in the client that presented it."

"TBY-AUTH-014.what": "Sign-in through {{.provider}} failed."
"TBY-AUTH-014.cause": "The identity provider's answer did not pass Tobby's checks (state, nonce, signature, issuer or audience) — often a sign-in started in another tab, a clock difference, or a client registered with another callback URL."
"TBY-AUTH-014.action": "Start the sign-in again from this page. If it fails again, an administrator finds the failed check in the instance log under the same correlation identifier; local sign-in stays available meanwhile."

"TBY-AUTH-015.what": "Sign-in through {{.provider}} failed."
"TBY-AUTH-015.cause": "The SAML response was refused: it was not signed, was already used, was not answering a sign-in this instance started, was outside its validity window, or named another audience or destination."
"TBY-AUTH-015.action": "Start the sign-in again from this page — Tobby only accepts sign-ins it initiated. If it fails again, an administrator finds the refused check in the instance log under the same correlation identifier; local sign-in stays available meanwhile."

"TBY-AUTH-016.what": "Sign-in through {{.provider}} is unavailable: the identity provider cannot be reached."
"TBY-AUTH-016.cause": "The provider did not answer in time, or the network path to it is cut. Existing sessions and API tokens are not affected."
"TBY-AUTH-016.action": "Use local sign-in meanwhile — it stays available while federation is down, and its use is recorded in the audit log. Check the network path to the provider (proxy, private CA) and its availability; federated sign-in comes back without a restart."

"TBY-AUTH-017.what": "You are signed in at {{.provider}}, but no Tobby role is granted to you."
"TBY-AUTH-017.cause": "None of the groups the identity provider sent for your account is mapped to a role on this instance. Tobby never grants a role by default."
"TBY-AUTH-017.action": "Ask an administrator to add one of your groups to the role mapping of the instance configuration (`roles.viewer`, `roles.operator` or `roles.admin` under the provider's section), or to add you to a group already mapped."

"TBY-CFG-001.what": "The configuration is invalid."
"TBY-CFG-001.cause": "{{.detail}}"
"TBY-CFG-001.action": "Fix the reported setting (precedence: flags, then TOBBY_* environment variables, then the YAML file), check the result with `tobby config dump`, then restart."

"TBY-CFG-002.what": "The instance refuses to start: a secret file is configured inside the transportable store."
"TBY-CFG-002.cause": "{{.paths}} resolves under the store root {{.root}}. The store is handed to a courier and plugged into a machine in another zone, so everything under it is assumed to be read by someone else — registry credentials, TLS private keys, the local user database and its static tokens must never travel on it."
"TBY-CFG-002.action": "Move each listed file to a directory outside the store — the state directory (`state.root`) is the intended home — update the setting to the new location, then start the instance again. A path resolving inside the store through a symbolic link counts as inside: the reported resolved path is the one that decides."

"TBY-NET-001.what": "The outbound proxy configuration is unusable, so the instance refuses to start."
"TBY-NET-001.cause": "{{.setting}} is set to {{.proxy}}, which is not a usable forward-proxy URL (expected http:// or https:// with a host)."
"TBY-NET-001.action": "Correct {{.setting}} to the form http://proxy.example.com:3128, keeping credentials out of the URL — they belong in network.proxy.username and network.proxy.password, which never appear in logs or in `tobby config dump`. Then restart."

"TBY-NET-002.what": "A configured certificate authority could not be loaded."
"TBY-NET-002.cause": "{{.source}} is unreadable, holds no PEM CERTIFICATE block, or adds no authority the instance did not already trust."
"TBY-NET-002.action": "Check that {{.source}} exists, is readable by the instance, and contains the CA certificate in PEM form (`openssl x509 -in <file> -noout -subject` must print a subject). Then restart. Trusting a private authority is the supported way to reach an internal registry; there is no setting that disables certificate verification."

"TBY-NET-003.what": "The listener certificate could not be used, so the instance refuses to serve."
"TBY-NET-003.cause": "{{.source}} is missing, unreadable, not a PEM certificate/key pair, or the key does not match the certificate."
"TBY-NET-003.action": "Check server.tls.certFile and server.tls.keyFile: both must be readable PEM files forming one pair (`openssl x509 -noout -modulus` and `openssl rsa -noout -modulus` must agree). Remove both to have Tobby generate a self-signed certificate instead — its fingerprint is printed at startup. Then restart."

"TBY-NET-004.what": "The submitted certificate pair was refused; the instance keeps serving the certificate it already had."
"TBY-NET-004.cause": "{{.detail}}"
"TBY-NET-004.action": "Submit a PEM certificate and the matching private key (`openssl x509 -noout -pubkey` and `openssl pkey -pubout` must print the same public key), still valid, on an instance whose server.tls.certFile and server.tls.keyFile are configured. Nothing was written: the listener is unaffected."

"TBY-VAL-001.what": "The recipe or retriever file is invalid."
"TBY-VAL-001.cause": "In {{.file}}, at {{.path}}: {{.constraint}}."
"TBY-VAL-001.action": "Fix the field at {{.path}} so it satisfies the constraint, then submit the file again."

"TBY-REG-001.what": "The reference could not be parsed."
"TBY-REG-001.cause": "{{.reference}} is not a valid image or chart reference."
"TBY-REG-001.action": "Use the form registry/repository:tag or registry/repository@sha256:… — for example docker.io/library/redis:8.10."

"TBY-REG-002.what": "The source registry could not be reached."
"TBY-REG-002.cause": "No network route to {{.host}}, or the registry is down (DNS, proxy, or firewall on the path)."
"TBY-REG-002.action": "Check connectivity to {{.host}} from the instance host and the proxy settings, then retry."

"TBY-REG-003.what": "The source registry refused authentication."
"TBY-REG-003.cause": "Credentials for {{.host}} are missing or expired."
"TBY-REG-003.action": "Set registries.credentials for {{.host}} in the configuration, then retry the import."

"TBY-REG-004.what": "The inspection timed out."
"TBY-REG-004.cause": "{{.host}} did not answer within {{.timeout}}."
"TBY-REG-004.action": "Retry; if it persists, check the network path to {{.host}} or raise import.inspectTimeout in the configuration."

"TBY-REG-006.what": "No available version satisfies the requested expression."
"TBY-REG-006.cause": "For {{.reference}}, the expression {{.constraint}} matches none of the available tags: {{.detail}}."
"TBY-REG-006.action": "Check the version expression against the tags actually published (semver constraints only consider semver-parseable tags). Tobby never falls back silently to another version."

"TBY-REG-007.what": "The source served an unusable partial response while a large transfer was being resumed."
"TBY-REG-007.cause": "For {{.reference}}: {{.detail}}. The source registry, or a cache in front of it, does not honor byte ranges consistently."
"TBY-REG-007.action": "Retry the task: the transfer restarts from the last verified position, or from the beginning if the source content changed. If it recurs on the same source, set transfer.resumeThreshold to 0 to disable in-blob resumption for this instance, and check any caching proxy on the path to that registry."

"TBY-REG-008.what": "The source index does not carry a platform the recipe asks for."
"TBY-REG-008.cause": "For {{.reference}}, no child of the index matches {{.platforms}}; the index publishes {{.available}}. A platform selector is os/arch with an OPTIONAL variant (RECIPE-SPEC §7.1): an omitted variant matches any, a named one must match exactly."
"TBY-REG-008.action": "Confront the platforms list of the ingredient with what the source actually publishes (docker manifest inspect, or the inspection report of a unit import) and correct it. Tobby never silently drops a platform that was asked for."

"TBY-REG-005.what": "The reference does not exist on the source registry."
"TBY-REG-005.cause": "{{.reference}} was not found — wrong name or tag, or it was deleted upstream."
"TBY-REG-005.action": "Check the repository name and the tag on the source registry, then correct the reference."

"TBY-POL-001.what": "The registry is not on the allowlist."
"TBY-POL-001.cause": "{{.host}} is not among the allowed source or destination registries; the transfer was refused before any data moved."
"TBY-POL-001.action": "If this registry is legitimate, add {{.host}} to registries.allowlist in the configuration; the change is audit-logged."

"TBY-POL-002.what": "This content cannot be removed individually."
"TBY-POL-002.cause": "{{.repository}} is managed by {{.recipes}}: removing it here would be undone by the next synchronization."
"TBY-POL-002.action": "Remove the managing recipe instead — its exclusive content is garbage-collected with it. Only unit-imported content is individually removable."

"TBY-POL-003.what": "This content cannot be removed from here."
"TBY-POL-003.cause": "{{.repository}} was pushed through the standard registry API (/v2/) by an external client: its provenance is neither a recipe nor a unit import."
"TBY-POL-003.action": "Individual removal covers unit-imported content only (FR-044). Manage seeded content with the standard registry tooling that pushed it."

"TBY-POL-004.what": "This recipe version is already published, with different content."
"TBY-POL-004.cause": "{{.reference}} already points at {{.published}}; the document offered would publish {{.candidate}}. A cooked recipe is immutable (RECIPE-SPEC §8)."
"TBY-POL-004.action": "Publish the change under a new metadata.version and tag. Republishing a version onto different content would silently change what zones already resolved."

"TBY-SIG-001.what": "The recipe signature could not be verified."
"TBY-SIG-001.cause": "No configured trust root validates the signature of {{.recipe}} (keys tried: {{.fingerprints}})."
"TBY-SIG-001.action": "Check that the zone's trust roots include the key that signed this recipe. An unverified recipe is never admitted."

"TBY-SIG-002.what": "A pinned digest does not match the fetched content."
"TBY-SIG-002.cause": "{{.reference}} pins {{.expected}} but the registry served {{.actual}} — the content changed or was tampered with."
"TBY-SIG-002.action": "Do not force the transfer. Verify the source registry and the recipe; if the change is legitimate, a re-signed recipe pinning the new digest is required."

"TBY-SIG-003.what": "The artifact's type does not match the recipe's declaration."
"TBY-SIG-003.cause": "{{.reference}} declares artifactType {{.expected}} but the registry served {{.actual}} — the tag may have been reused for different content."
"TBY-SIG-003.action": "Verify the source repository. If the type change is legitimate, update and re-sign the recipe; otherwise treat the source as compromised."

"TBY-DST-001.what": "The destination registry cannot store this reference."
"TBY-DST-001.cause": "{{.reference}} exceeds a destination limit: {{.limit}}."
"TBY-DST-001.action": "Shorten the relocated path or adjust the destination naming; the refusal happened before any push."

"TBY-CHT-001.what": "The Helm chart is missing an embedded dependency."
"TBY-CHT-001.cause": "{{.chart}} declares the dependency {{.dependency}} but does not embed it under charts/ — it cannot deploy offline."
"TBY-CHT-001.action": "Repackage the chart with its dependencies embedded (helm dependency build, then helm package), publish it, and retry the import."

"TBY-FIL-001.what": "The file set could not be packed."
"TBY-FIL-001.cause": "{{.detail}}"
"TBY-FIL-001.action": "Point `tobby fileset pack` at an existing, non-empty directory, and give the file set a lowercase name and a version (for example `tobby fileset pack ./repo site-docs:1.0.0`). Nothing was written to the store."

"TBY-FIL-002.what": "The directory holds an entry that cannot be packed safely."
"TBY-FIL-002.cause": "{{.detail}}"
"TBY-FIL-002.action": "Remove or replace that entry, then pack again — a file set is extracted and served on other machines, so symbolic links must stay inside the directory, special files and setuid bits are not carried, and names must not start with `.wh.`. Nothing was written to the store."

"TBY-FIL-003.what": "Packing that directory is not allowed from this surface."
"TBY-FIL-003.cause": "{{.path}} is outside the directories `files.packRoots` allows the web interface and the API to read; with no entry configured, they may read none."
"TBY-FIL-003.action": "Either run `tobby fileset pack` on the instance host, which is not restricted, or add the directory to `files.packRoots` in the configuration file and restart the instance."

"TBY-STO-001.what": "The local store could not be read."
"TBY-STO-001.cause": "{{.detail}}"
"TBY-STO-001.action": "Check that the storage root exists, is mounted, and is readable by the instance, then retry."

"TBY-STO-003.what": "Writing the partial download to the state directory failed."
"TBY-STO-003.cause": "{{.path}} could not be written: {{.detail}} — most often no free space, or permissions the instance user does not hold on the state root."
"TBY-STO-003.action": "Free space on the state directory (it temporarily holds one copy of each resumable blob) or fix its permissions, then retry the task. Lower transfer.resumeThreshold to make fewer blobs resumable, or set it to 0 to stream every blob straight to the store without spooling."

"TBY-STO-002.what": "Writing to the local store failed."
"TBY-STO-002.cause": "{{.detail}}"
"TBY-STO-002.action": "Check free space and permissions on the storage root, then retry the operation."

"TBY-MED-001.what": "The medium carries no media manifest."
"TBY-MED-001.cause": "{{.path}} is absent — the store was not produced by a completed mirror synchronization, or the copy onto the medium was partial."
"TBY-MED-001.action": "Re-copy the store from the source instance, or re-run the mirror synchronization that produces it. Nothing can be pushed from a medium without an inventory, and this refusal has no override."

"TBY-MED-002.what": "The media manifest cannot be read."
"TBY-MED-002.cause": "{{.path}} is truncated, unparseable, or internally inconsistent: {{.detail}}."
"TBY-MED-002.action": "Re-copy the store from the source instance and verify again. A manifest that does not parse leaves nothing to check the medium against, and this refusal has no override."

"TBY-MED-003.what": "The media manifest uses an unsupported format version."
"TBY-MED-003.cause": "The medium declares media manifest format {{.found}}; this build reads format {{.supported}}."
"TBY-MED-003.action": "Use a Tobby release matching the medium on this side, or re-produce the medium with the release running here."

"TBY-MED-004.what": "The medium uses an unsupported store format version."
"TBY-MED-004.cause": "The medium declares store format {{.found}}; this build reads format {{.supported}}."
"TBY-MED-004.action": "Use a Tobby release matching the medium, or move the content through the OCI image layout with standard tooling (skopeo, oras, crane)."

"TBY-MED-005.what": "The medium's recipe graph does not match its inventory."
"TBY-MED-005.cause": "{{.path}} hashes to {{.actual}} but the manifest records {{.expected}} — the list of what the medium delivers has changed since the manifest was written."
"TBY-MED-005.action": "Re-copy the store from the source instance. The recipe graph is what every per-recipe verdict is computed from, so an altered one blocks the whole medium and has no override."

"TBY-MED-006.what": "The medium is addressed to another zone."
"TBY-MED-006.cause": "The manifest names zone {{.found}}; this instance serves zone {{.expected}}."
"TBY-MED-006.action": "Check that this is the medium intended for this zone. An administrator may override the refusal deliberately; the override is recorded in the audit journal."

"TBY-MED-007.what": "The medium is older than the last one imported for this zone."
"TBY-MED-007.cause": "Medium {{.media}} was resolved at {{.resolved}}, while zone {{.zone}} last imported content resolved at {{.recorded}} — importing it would roll the zone backwards."
"TBY-MED-007.action": "Check that you plugged in the current medium. An administrator may override the refusal deliberately — to restore an older delivery on purpose, for instance; the override is recorded in the audit journal."

"TBY-MED-010.what": "A file the recipe needs is missing from the medium."
"TBY-MED-010.cause": "{{.recipe}} reaches {{.path}}, which the medium does not carry — the copy was partial, or the file was removed."
"TBY-MED-010.action": "Re-copy the store from the source instance. The recipe is blocked whole and has no override; recipes intact on the same medium remain pushable."

"TBY-MED-011.what": "A file on the medium has the wrong size."
"TBY-MED-011.cause": "{{.path}} holds {{.actual}} bytes but the manifest records {{.expected}} — the file was truncated or altered after the manifest was written."
"TBY-MED-011.action": "Re-copy the store from the source instance. The recipe reaching this file is blocked whole and has no override."

"TBY-MED-012.what": "A file on the medium does not match its recorded digest."
"TBY-MED-012.cause": "{{.path}} hashes to {{.actual}} but the manifest records {{.expected}} — the content was corrupted or tampered with in transport."
"TBY-MED-012.action": "Re-copy the store from the source instance. The recipe reaching this file is blocked whole and has no override."

"TBY-MED-013.what": "A file the recipe needs is absent from the inventory."
"TBY-MED-013.cause": "{{.recipe}} reaches {{.path}}, which the media manifest does not list — the manifest cannot vouch for it."
"TBY-MED-013.action": "Re-produce the medium from the source instance so the manifest covers everything the recipes reach. The recipe is blocked whole and has no override."

"TBY-MED-014.what": "A manifest on the medium cannot be read."
"TBY-MED-014.cause": "{{.path}} is not readable as an OCI manifest or index: {{.detail}}."
"TBY-MED-014.action": "Re-copy the store from the source instance. What the recipe delivers cannot be established from an unreadable manifest, so the recipe is blocked whole."

"TBY-MED-015.what": "A blob on the medium is stored under the wrong digest."
"TBY-MED-015.cause": "{{.path}} is addressed as {{.expected}} but its bytes hash to {{.actual}} — the content-addressed store disagrees with itself."
"TBY-MED-015.action": "Re-copy the store from the source instance. The recipe reaching this blob is blocked whole and has no override."

"TBY-MED-020.what": "A file on the medium is not covered by the inventory."
"TBY-MED-020.cause": "{{.path}} lies under manifest coverage but the manifest does not list it — it was added after the manifest was written."
"TBY-MED-020.action": "Nothing to do to proceed: extraneous content is never pushed. Investigate how it got onto the medium if you did not put it there."

"TBY-MED-021.what": "A file on the medium is reached by no recipe."
"TBY-MED-021.cause": "{{.path}} is inventoried but no recipe of this medium delivers it — leftover content from an earlier delivery, most often."
"TBY-MED-021.action": "Nothing to do to proceed: content reachable from no recipe is never pushed. Prune the source store if you want the medium to carry less."

"TBY-MED-022.what": "A bookkeeping file on the medium does not match its recorded digest."
"TBY-MED-022.cause": "{{.path}} does not match its inventory entry — the store's own bookkeeping was altered after the manifest was written."
"TBY-MED-022.action": "Nothing is pushed from this file, so verification continues; re-copy the store from the source instance if you did not alter it deliberately."

"TBY-MED-030.what": "This medium has not been verified yet, so nothing is served from it."
"TBY-MED-030.cause": "{{.surface}} is closed because medium {{.media}} arrived from another zone and no verification has established that its content is intact and signed (FR-054). The instance itself is running normally."
"TBY-MED-030.action": "Open {{.screen}} in the web interface and run Verify — it re-hashes the medium and can take several minutes on a full disk — or call POST /api/v1/media/verify on this instance. This surface opens by itself as soon as the medium clears. `tobby media verify` reports the same verdict but runs in its own process and does not open this instance's surfaces: only a verification the instance itself performs does."

"TBY-MED-031.what": "A verification of this medium is already running."
"TBY-MED-031.cause": "One run is walking the medium (stage: {{.stage}}); starting a second would halve both and answer nothing new."
"TBY-MED-031.action": "Wait for the run in progress. Its verdict lands on the Media screen and on GET /api/v1/media/verification."

"TBY-MED-032.what": "This medium did not clear verification, so nothing is served from it."
"TBY-MED-032.cause": "{{.surface}} is closed because medium {{.media}} verified as {{.verdict}} rather than whole. Serving is a property of the store as a whole — a blob a blocked recipe reaches is exactly the content that failed — so unlike the push decision it is not taken recipe by recipe."
"TBY-MED-032.action": "Read the report on {{.screen}}: it names each blocked recipe and the file that failed. Re-copy the medium from the source instance and verify again. The intact recipes can still be pushed into the zone registry, which then serves them."

"TBY-STO-004.what": "The operation was refused before it started: the target does not have enough free space."
"TBY-STO-004.cause": "{{.path}} needs {{.needed}} bytes and only {{.available}} are usable — {{.free}} bytes are free, minus the {{.margin}} % safety margin. It is short by {{.shortfall}} bytes."
"TBY-STO-004.action": "Free at least {{.shortfall}} bytes on the target, point the operation at a larger volume, or remove content that is no longer referenced. Lower preflight.safetyMarginPercent only if you accept filling the volume."

"TBY-STO-005.what": "The target filesystem cannot hold a file this large."
"TBY-STO-005.cause": "{{.path}} is formatted as {{.filesystem}}, whose largest single file is {{.limit}} bytes; the {{.what}} would write a file of {{.size}} bytes."
"TBY-STO-005.action": "Reformat the medium with a filesystem that has no such limit (exFAT, NTFS, ext4, XFS), or split the transfer so that no single file exceeds the limit."

"TBY-STO-006.what": "The store was not reset."
"TBY-STO-006.cause": "The typed confirmation did not match: resetting the store requires typing {{.phrase}} exactly, in capitals, with nothing else."
"TBY-STO-006.action": "Type {{.phrase}} in the confirmation field and submit again. A reset removes every artifact of this store; the operation history and the task logs are kept."

"TBY-LAY-001.what": "This is not a usable OCI image layout."
"TBY-LAY-001.cause": "{{.path}} could not be read as one: {{.detail}}"
"TBY-LAY-001.action": "Check that the path is the layout itself — the directory (or the uncompressed tar of it) holding `oci-layout`, `index.json` and `blobs/`. A compressed archive must be decompressed first. `skopeo copy oci:<path>:<tag> …` on the same path tells you whether any OCI tool can read it either."

"TBY-LAY-002.what": "The archive was refused: one of its entries has no place in an image layout."
"TBY-LAY-002.cause": "In {{.path}}, the entry {{.entry}} was refused — {{.reason}}."
"TBY-LAY-002.action": "Nothing was written. An OCI image layout archive contains only `oci-layout`, `index.json` and `blobs/<algorithm>/<digest>` files: an archive that also carries links or paths leading outside it was not produced by an OCI tool. Get the medium re-made at its source, and report it as an incident if it arrived from outside your organization."

"TBY-LAY-003.what": "The export destination already exists."
"TBY-LAY-003.cause": "{{.path}} is already there, and this export was not allowed to replace it."
"TBY-LAY-003.action": "Choose another destination, or re-run the export with the replace option (`--overwrite` on the command line) once you are sure what is there can be lost."

"TBY-SCN-001.what": "The vulnerability scanner is unavailable: content is not being scanned."
"TBY-SCN-001.cause": "{{.detail}}"
"TBY-SCN-001.action": "Make the scanner available for this platform: in the container image it is bundled; on a Linux or Windows host, synchronize the tobby-system recipe that carries it; on macOS, install trivy on the PATH. Under `scan.mode: block`, nothing that could not be scanned is pushed until then."

"TBY-SCN-002.what": "The scanner binary at {{.path}} does not match its pinned digest and was not executed."
"TBY-SCN-002.cause": "Expected {{.expected}}, found {{.actual}}: the file was replaced or damaged after it was pinned."
"TBY-SCN-002.action": "Restore the binary from the tobby-system recipe (or from the pinned release), or update `scan.trivy.digest` if the change is deliberate. Content is reported not scanned until then."

"TBY-SCN-003.what": "No vulnerability database is available: content is not being scanned."
"TBY-SCN-003.cause": "The store holds no database under {{.repository}}."
"TBY-SCN-003.action": "Synchronize the tobby-system recipe that carries the database first — through the mirror medium in an isolated zone. Media verification does not need the database."

"TBY-SCN-004.what": "The vulnerability database is {{.age}} old, beyond the {{.max}} this instance accepts."
"TBY-SCN-004.cause": "The database has not been refreshed recently enough: findings published since it was built are unknown to the scanner."
"TBY-SCN-004.action": "Synchronize the tobby-system recipe to bring a fresh database — through the next medium in an isolated zone. Under `scan.maxDbAgeAction: block`, items scanned with a stale database are not pushed until then."

"TBY-SCN-005.what": "{{.reference}} violates the vulnerability policy and was not pushed."
"TBY-SCN-005.cause": "Findings at or above the threshold of {{.threshold}} (set at the {{.level}} level) are not covered by any exception: {{.violations}}."
"TBY-SCN-005.action": "Publish a fixed version upstream and update the recipe, or — if the risk is accepted in this zone — list the CVE as an exception in the Retriever's `spec.scanPolicy` or in `scan.exceptions`, with its justification."

"TBY-SCN-006.what": "{{.reference}} violates the vulnerability policy; it was pushed because the policy is advisory."
"TBY-SCN-006.cause": "Findings at or above the threshold of {{.threshold}} (set at the {{.level}} level) are not covered by any exception: {{.violations}}."
"TBY-SCN-006.action": "Review the findings. To refuse such content instead of reporting it, set `scan.mode: block`; to accept a specific CVE in this zone, list it as an exception with its justification."

"TBY-SCN-007.what": "{{.reference}} could not be scanned."
"TBY-SCN-007.cause": "The scanner stopped with an error: {{.detail}}"
"TBY-SCN-007.action": "Retry the synchronization. If the error persists, the instance log carries the scanner's output under the same correlation identifier. Under `scan.mode: block` the item is not pushed until it scans."

"TBY-SCN-020.what": "The scan threshold carried by {{.recipe}} was ignored."
"TBY-SCN-020.cause": "The recipe asks for {{.annotation}}, above the {{.threshold}} in effect for this zone; a recipe can lower the threshold, never raise it."
"TBY-SCN-020.action": "Nothing to do on this instance: the zone's threshold applies. The recipe author may remove or lower the `recipe.tobby.dev/scan-threshold` annotation."

"TBY-SCN-021.what": "The exception for {{.id}} expired on {{.expires}} and no longer applies."
"TBY-SCN-021.cause": "The exception declared at the {{.level}} level carries an expiry date that has passed."
"TBY-SCN-021.action": "Renew the exception with a new `expires` and its justification if the risk is still accepted, or remove it and deal with the finding."

"TBY-SCN-022.what": "{{.reference}} carries findings with no severity score: {{.ids}}."
"TBY-SCN-022.cause": "The advisory sources give these vulnerabilities neither a CVSS score nor a severity, so the policy cannot compare them with its threshold."
"TBY-SCN-022.action": "Review them by hand. They are not counted against the threshold; if one must be refused, have the content fixed upstream."

"TBY-INT-001.what": "The blob {{.path}} does not match its digest."
"TBY-INT-001.cause": "Its content hashes to {{.actual}} instead of {{.expected}}: the file was damaged or altered on disk."
"TBY-INT-001.action": "The verification changes nothing. Re-synchronize the recipes that reach this blob to fetch it again, or restore the store from a sound copy; check the disk for errors."

"TBY-INT-002.what": "{{.reference}} is incomplete in the store."
"TBY-INT-002.cause": "It references content the store does not hold: {{.missing}}."
"TBY-INT-002.action": "Re-synchronize the recipe that reaches it to fetch the missing content, or restore the store from a sound copy."

"TBY-INT-003.what": "{{.path}} is reachable from no recipe."
"TBY-INT-003.cause": "No recorded recipe and no protected root (unit imports, vulnerability database, seeded content) reaches this content."
"TBY-INT-003.action": "Nothing is required. To reclaim the space, prune to the Retriever or remove the recipe that used to hold it; the verification itself never deletes."

"TBY-INT-004.what": "A store verification is already running."
"TBY-INT-004.cause": "Verification {{.task}} is walking the store; running two at once would halve both and answer nothing new."
"TBY-INT-004.action": "Follow the running verification on the tasks screen, or wait for it to finish and start a new one."

"TBY-INT-005.what": "{{.path}} cannot be read as a manifest."
"TBY-INT-005.cause": "{{.detail}}"
"TBY-INT-005.action": "Re-synchronize the recipe that reaches it, or restore the store from a sound copy; what this manifest references could not be checked."

"TBY-TSK-001.what": "The task does not exist."
"TBY-TSK-001.cause": "No task with identifier {{.id}} on this instance — wrong link, or the store was reset."
"TBY-TSK-001.action": "Open the task list and follow the link of an existing task."

"TBY-SRV-001.what": "An internal error occurred."
"TBY-SRV-001.cause": "An unexpected condition interrupted the request; details are in the instance logs."
"TBY-SRV-001.action": "Retry; if it persists, search the instance logs for the correlation identifier shown with this error."

"TBY-SRV-002.what": "This resource does not exist."
"TBY-SRV-002.cause": "The address is wrong, or the content was removed."
"TBY-SRV-002.action": "Go back to the content browser or use the search."

"TBY-SRV-003.what": "The instance is unreachable."
"TBY-SRV-003.cause": "The network connection dropped, or the instance is restarting."
"TBY-SRV-003.action": "Check your network link and retry; the page resumes as soon as the instance answers."

# Exit-code table (FR-066 amendment R-08). Not error codes: the rows of
# the published command-line contract, rendered by ExitCodeTable into the
# reference pages and covered by the semantic-versioning promise.
"exit.column.code": "Code"
"exit.column.name": "Name"
"exit.column.meaning": "Meaning"

"exit.ok.title": "Success"
"exit.ok.meaning": "The command did what was asked."
"exit.failure.title": "Operational failure"
"exit.failure.meaning": "Network, storage or internal error — everything that failed without a policy or a verification verdict. Every code of the operational class exits here, and so does a command that started a task the instance then failed."
"exit.usage.title": "Usage error"
"exit.usage.meaning": "Bad flag, unknown command, or a command asked for something it cannot honour. The message carries a `see 'tobby … --help'` hint naming the command that misparsed."
"exit.policy.title": "Policy refusal"
"exit.policy.meaning": "Refused by explicit policy or authorization: registry allow-list, roles, secure-by-default startup refusals, immutable recipe tags, the two waivable media guards."
"exit.verification.title": "Verification failure"
"exit.verification.meaning": "A failed integrity or authenticity check: signatures, pinned digests, artifact types, media checksums. The most severe class, and the one no override reopens."
"exit.changes-planned.title": "Changes planned"
"exit.changes-planned.meaning": "A side-effect-free run found work to do — `tobby sync --dry-run` over a Retriever with pending changes. A success with something to say, so a gate can branch on it without treating it as a broken build."
