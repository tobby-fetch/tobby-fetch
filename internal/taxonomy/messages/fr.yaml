# SPDX-License-Identifier: GPL-3.0-only
# Messages français de la taxonomie d'erreurs (R-03). Fidélité au sens,
# français technique correct, franglais assumé pour les termes sans
# équivalent (digest, tag, store) — directive i18n du jalon 2.

"TBY-AUTH-001.what": "L'instance refuse de démarrer : aucun compte local n'est configuré."
"TBY-AUTH-001.cause": "Aucun compte administrateur n'a encore été créé sur cette instance, ou son répertoire d'état a été réinitialisé."
"TBY-AUTH-001.action": "Sur l'hôte de l'instance, exécutez `tobby user add --role admin <nom>` (l'outil calcule le hachage du mot de passe), puis redémarrez l'instance. Tobby ne démarre jamais avec une interface ouverte."

"TBY-AUTH-002.what": "L'authentification a échoué."
"TBY-AUTH-002.cause": "Les identifiants sont inconnus ou le mot de passe est erroné."
"TBY-AUTH-002.action": "Vérifiez le nom du compte et le mot de passe, puis réessayez. Les comptes se gèrent sur l'hôte avec `tobby user`."

"TBY-AUTH-003.what": "Cette action n'est pas autorisée pour votre rôle."
"TBY-AUTH-003.cause": "Elle requiert le rôle {{.role}}."
"TBY-AUTH-003.action": "Connectez-vous avec un compte disposant du rôle {{.role}}, ou demandez à un administrateur de vous l'accorder."

"TBY-AUTH-004.what": "Le formulaire n'a pas pu être soumis en toute sécurité."
"TBY-AUTH-004.cause": "Le jeton anti-falsification est absent ou a expiré — la page est probablement restée ouverte longtemps."
"TBY-AUTH-004.action": "Le formulaire a été rechargé avec un jeton neuf : soumettez-le à nouveau."

"TBY-AUTH-005.what": "Votre session a expiré."
"TBY-AUTH-005.cause": "Aucune activité pendant une durée supérieure à la vie de la session, ou l'instance a redémarré."
"TBY-AUTH-005.action": "Reconnectez-vous ; vous reviendrez à la page où vous étiez."

"TBY-AUTH-006.what": "Le mot de passe actuel est erroné."
"TBY-AUTH-006.cause": "Le mot de passe actuel envoyé avec la demande de changement ne correspond pas à celui du compte."
"TBY-AUTH-006.action": "Saisissez à nouveau votre mot de passe actuel, puis réessayez. S'il est perdu, un administrateur peut en définir un nouveau sur l'hôte de l'instance avec `tobby user passwd <nom>`."

"TBY-AUTH-007.what": "Le nouveau mot de passe a été refusé."
"TBY-AUTH-007.cause": "Il est vide, identique au mot de passe actuel, ou sa confirmation ne correspond pas."
"TBY-AUTH-007.action": "Choisissez un mot de passe non vide et différent de l'actuel, saisissez la même valeur dans les deux champs du nouveau mot de passe, puis soumettez à nouveau."

"TBY-AUTH-008.what": "Le compte n'a pas pu être créé ou modifié."
"TBY-AUTH-008.cause": "Le login est vide, le rôle n'est pas l'un des trois (viewer, operator, admin), ou le mot de passe est vide ou mal ressaisi dans le champ de confirmation."
"TBY-AUTH-008.action": "Indiquez un login non vide, choisissez l'un des trois rôles, et saisissez le même mot de passe non vide dans les deux champs, puis soumettez à nouveau."

"TBY-AUTH-009.what": "Le compte {{.name}} existe déjà."
"TBY-AUTH-009.cause": "Cette instance possède déjà un compte local portant ce login ; les logins sont uniques."
"TBY-AUTH-009.action": "Choisissez un autre login, ou gérez le compte existant depuis l'écran des comptes — son rôle se change et son mot de passe se réinitialise sans en créer un second."

"TBY-AUTH-010.what": "Aucun compte nommé {{.name}} sur cette instance."
"TBY-AUTH-010.cause": "Le compte a été supprimé, ou le login est mal orthographié — l'écran depuis lequel vous avez agi est peut-être antérieur à la suppression."
"TBY-AUTH-010.action": "Rechargez l'écran des comptes pour voir la liste à jour, puis réessayez sur un compte qui y figure."

"TBY-AUTH-011.what": "Refusé : {{.name}} est le dernier administrateur de cette instance."
"TBY-AUTH-011.cause": "Le supprimer, ou lui retirer le rôle admin, ne laisserait plus personne pour administrer l'instance — et une instance sans aucun compte refuse purement et simplement de démarrer."
"TBY-AUTH-011.action": "Créez d'abord un second compte admin, puis réessayez. Sur l'hôte de l'instance, `tobby user add --role admin <nom>` donne le même résultat."

"TBY-AUTH-012.what": "Trop de tentatives d'authentification échouées depuis votre adresse réseau ; les tentatives suivantes sont temporairement refusées."
"TBY-AUTH-012.cause": "Des identifiants erronés ont été présentés à répétition depuis la même origine. Chaque vérification échouée est volontairement coûteuse, l'instance limite donc les origines qui échouent en boucle plutôt que de brûler CPU et mémoire pour elles."
"TBY-AUTH-012.action": "Patientez un instant, vérifiez l'identifiant (mot de passe du compte ou secret du jeton), puis réessayez. Si cette adresse est une sortie partagée, un autre client derrière elle est peut-être mal configuré — le journal d'audit liste les tentatives échouées et les noms de compte revendiqués."

"TBY-CFG-001.what": "La configuration est invalide."
"TBY-CFG-001.cause": "{{.detail}}"
"TBY-CFG-001.action": "Corrigez le réglage indiqué (précédence : drapeaux, puis variables d'environnement TOBBY_*, puis fichier YAML), vérifiez le résultat avec `tobby config dump`, puis redémarrez."

"TBY-CFG-002.what": "L'instance refuse de démarrer : un fichier de secret est configuré à l'intérieur du store transportable."
"TBY-CFG-002.cause": "{{.paths}} se résout sous la racine du store {{.root}}. Le store est confié à un porteur puis branché sur une machine d'une autre zone : tout ce qui est dessous est réputé lu par quelqu'un d'autre — identifiants de registre, clés privées TLS, base d'utilisateurs locale et jetons statiques ne doivent jamais voyager dessus."
"TBY-CFG-002.action": "Déplacez chaque fichier listé dans un répertoire hors du store — le répertoire d'état (`state.root`) est sa place — mettez le réglage à jour vers le nouvel emplacement, puis redémarrez l'instance. Un chemin qui se résout dans le store via un lien symbolique compte comme étant dedans : c'est le chemin résolu indiqué qui tranche."

"TBY-NET-001.what": "La configuration du proxy sortant est inutilisable : l'instance refuse de démarrer."
"TBY-NET-001.cause": "{{.setting}} vaut {{.proxy}}, qui n'est pas une URL de proxy exploitable (http:// ou https:// avec un hôte attendus)."
"TBY-NET-001.action": "Corrigez {{.setting}} sous la forme http://proxy.example.com:3128, sans identifiants dans l'URL : ceux-ci relèvent de network.proxy.username et network.proxy.password, qui n'apparaissent jamais dans les journaux ni dans `tobby config dump`. Puis redémarrez."

"TBY-NET-002.what": "Une autorité de certification configurée n'a pas pu être chargée."
"TBY-NET-002.cause": "{{.source}} est illisible, ne contient aucun bloc PEM CERTIFICATE, ou n'ajoute aucune autorité que l'instance ne connaissait déjà."
"TBY-NET-002.action": "Vérifiez que {{.source}} existe, est lisible par l'instance et contient bien le certificat de l'autorité au format PEM (`openssl x509 -in <fichier> -noout -subject` doit afficher un sujet). Puis redémarrez. Faire confiance à une autorité privée est la voie prévue pour joindre une registry interne ; aucun réglage ne désactive la vérification des certificats."

"TBY-NET-003.what": "Le certificat de l'écouteur est inutilisable : l'instance refuse de servir."
"TBY-NET-003.cause": "{{.source}} est absent, illisible, n'est pas une paire certificat/clé au format PEM, ou la clé ne correspond pas au certificat."
"TBY-NET-003.action": "Vérifiez server.tls.certFile et server.tls.keyFile : deux fichiers PEM lisibles formant une même paire (`openssl x509 -noout -modulus` et `openssl rsa -noout -modulus` doivent concorder). Retirez les deux pour laisser Tobby générer un certificat auto-signé — son empreinte est affichée au démarrage. Puis redémarrez."

"TBY-NET-004.what": "La paire de certificat soumise a été refusée ; l'instance continue de servir le certificat qu'elle avait déjà."
"TBY-NET-004.cause": "{{.detail}}"
"TBY-NET-004.action": "Soumettez un certificat PEM et la clé privée correspondante (`openssl x509 -noout -pubkey` et `openssl pkey -pubout` doivent afficher la même clé publique), encore valide, sur une instance dont server.tls.certFile et server.tls.keyFile sont configurés. Rien n'a été écrit : l'écouteur n'est pas affecté."

"TBY-VAL-001.what": "Le fichier recipe ou retriever est invalide."
"TBY-VAL-001.cause": "Dans {{.file}}, à {{.path}} : {{.constraint}}."
"TBY-VAL-001.action": "Corrigez le champ {{.path}} pour satisfaire la contrainte, puis soumettez le fichier à nouveau."

"TBY-REG-001.what": "La référence n'a pas pu être interprétée."
"TBY-REG-001.cause": "{{.reference}} n'est pas une référence valide d'image ou de chart."
"TBY-REG-001.action": "Utilisez la forme registry/repository:tag ou registry/repository@sha256:… — par exemple docker.io/library/redis:7.2."

"TBY-REG-002.what": "Le registre source est injoignable."
"TBY-REG-002.cause": "Aucune route réseau vers {{.host}}, ou le registre est arrêté (DNS, proxy ou pare-feu sur le chemin)."
"TBY-REG-002.action": "Vérifiez la connectivité vers {{.host}} depuis l'hôte de l'instance et les réglages de proxy, puis réessayez."

"TBY-REG-003.what": "Le registre source a refusé l'authentification."
"TBY-REG-003.cause": "Identifiants absents ou expirés pour {{.host}}."
"TBY-REG-003.action": "Renseignez registries.credentials pour {{.host}} dans la configuration, puis relancez l'import."

"TBY-REG-004.what": "L'inspection a dépassé le délai."
"TBY-REG-004.cause": "{{.host}} n'a pas répondu en {{.timeout}}."
"TBY-REG-004.action": "Réessayez ; si cela persiste, vérifiez le chemin réseau vers {{.host}} ou augmentez import.inspectTimeout dans la configuration."

"TBY-REG-006.what": "Aucune version disponible ne satisfait l'expression demandée."
"TBY-REG-006.cause": "Pour {{.reference}}, l'expression {{.constraint}} ne correspond à aucun des tags disponibles : {{.detail}}."
"TBY-REG-006.action": "Confrontez l'expression de version aux tags réellement publiés (les contraintes semver ne considèrent que les tags interprétables en semver). Tobby ne se replie jamais silencieusement sur une autre version."

"TBY-REG-007.what": "La source a renvoyé une réponse partielle inexploitable pendant la reprise d'un gros transfert."
"TBY-REG-007.cause": "Pour {{.reference}} : {{.detail}}. Le registre source, ou un cache placé devant lui, n'honore pas les plages d'octets de manière cohérente."
"TBY-REG-007.action": "Relancez la tâche : le transfert repart de la dernière position vérifiée, ou de zéro si le contenu de la source a changé. Si cela se reproduit sur la même source, mettez transfer.resumeThreshold à 0 pour désactiver la reprise intra-blob sur cette instance, et vérifiez le proxy cache éventuel sur le chemin vers ce registre."

"TBY-REG-005.what": "La référence n'existe pas sur le registre source."
"TBY-REG-005.cause": "{{.reference}} est introuvable — nom ou tag erroné, ou supprimée en amont."
"TBY-REG-005.action": "Vérifiez le nom du dépôt et le tag sur le registre source, puis corrigez la référence."

"TBY-POL-001.what": "Le registre n'est pas dans la liste blanche."
"TBY-POL-001.cause": "{{.host}} ne fait pas partie des registres autorisés en source ou en destination ; le transfert a été refusé avant tout échange."
"TBY-POL-001.action": "Si ce registre est légitime, ajoutez {{.host}} à registries.allowlist dans la configuration ; la modification est journalisée en audit."

"TBY-POL-002.what": "Ce contenu ne peut pas être supprimé individuellement."
"TBY-POL-002.cause": "{{.repository}} est géré par {{.recipes}} : le supprimer ici serait défait par la prochaine synchronisation."
"TBY-POL-002.action": "Supprimez plutôt la recipe qui le gère — son contenu exclusif est nettoyé avec elle. Seul le contenu importé unitairement est supprimable individuellement."

"TBY-POL-003.what": "Ce contenu ne peut pas être supprimé d'ici."
"TBY-POL-003.cause": "{{.repository}} a été poussé via l'API registre standard (/v2/) par un client externe : sa provenance n'est ni une recipe ni un import unitaire."
"TBY-POL-003.action": "La suppression individuelle ne couvre que le contenu importé unitairement (FR-044). Gérez le contenu poussé directement avec l'outillage registre standard qui l'a poussé."

"TBY-POL-004.what": "Cette version de recipe est déjà publiée, avec un contenu différent."
"TBY-POL-004.cause": "{{.reference}} pointe déjà sur {{.published}} ; le document proposé publierait {{.candidate}}. Une recipe cuite est immuable (RECIPE-SPEC §8)."
"TBY-POL-004.action": "Publiez le changement sous un nouveau metadata.version et un nouveau tag. Republier une version sur un contenu différent changerait en silence ce que des zones ont déjà résolu."

"TBY-SIG-001.what": "La signature de la recipe n'a pas pu être vérifiée."
"TBY-SIG-001.cause": "Aucune clé de confiance configurée ne valide la signature de {{.recipe}} (clés essayées : {{.fingerprints}})."
"TBY-SIG-001.action": "Vérifiez que les clés de confiance de la zone incluent la clé qui a signé cette recipe. Une recipe non vérifiée n'est jamais admise."

"TBY-SIG-002.what": "Un digest épinglé ne correspond pas au contenu récupéré."
"TBY-SIG-002.cause": "{{.reference}} épingle {{.expected}} mais le registre a servi {{.actual}} — le contenu a changé ou a été altéré."
"TBY-SIG-002.action": "Ne forcez pas le transfert. Vérifiez le registre source et la recipe ; si le changement est légitime, une recipe re-signée épinglant le nouveau digest est nécessaire."

"TBY-SIG-003.what": "Le type de l'artefact ne correspond pas à la déclaration de la recipe."
"TBY-SIG-003.cause": "{{.reference}} déclare l'artifactType {{.expected}} mais le registre a servi {{.actual}} — le tag a pu être réutilisé pour un autre contenu."
"TBY-SIG-003.action": "Vérifiez le repository source. Si le changement de type est légitime, mettez à jour et re-signez la recipe ; sinon considérez la source comme compromise."

"TBY-DST-001.what": "Le registre de destination ne peut pas stocker cette référence."
"TBY-DST-001.cause": "{{.reference}} dépasse une limite de la destination : {{.limit}}."
"TBY-DST-001.action": "Raccourcissez le chemin relocalisé ou ajustez le nommage de destination ; le refus a eu lieu avant tout push."

"TBY-CHT-001.what": "Le chart Helm n'embarque pas une de ses dépendances."
"TBY-CHT-001.cause": "{{.chart}} déclare la dépendance {{.dependency}} mais ne l'embarque pas sous charts/ — il ne peut pas se déployer hors-ligne."
"TBY-CHT-001.action": "Ré-empaquetez le chart avec ses dépendances embarquées (helm dependency build puis helm package), publiez-le, puis relancez l'import."

"TBY-FIL-001.what": "L'ensemble de fichiers n'a pas pu être empaqueté."
"TBY-FIL-001.cause": "{{.detail}}"
"TBY-FIL-001.action": "Indiquez à `tobby fileset pack` un répertoire existant et non vide, et donnez à l'ensemble un nom en minuscules et une version (par exemple `tobby fileset pack ./repo site-docs:1.0.0`). Rien n'a été écrit dans le magasin."

"TBY-FIL-002.what": "Le répertoire contient une entrée qui ne peut pas être empaquetée sans risque."
"TBY-FIL-002.cause": "{{.detail}}"
"TBY-FIL-002.action": "Supprimez ou remplacez cette entrée, puis empaquetez à nouveau : un ensemble de fichiers est extrait et servi sur d'autres machines, donc les liens symboliques doivent rester dans le répertoire, les fichiers spéciaux et les bits setuid ne sont pas transportés, et les noms ne doivent pas commencer par `.wh.`. Rien n'a été écrit dans le magasin."

"TBY-FIL-003.what": "L'empaquetage de ce répertoire n'est pas autorisé depuis cette surface."
"TBY-FIL-003.cause": "{{.path}} est en dehors des répertoires que `files.packRoots` autorise l'interface web et l'API à lire ; sans entrée configurée, elles n'en lisent aucun."
"TBY-FIL-003.action": "Lancez `tobby fileset pack` sur l'hôte de l'instance, qui n'est pas restreint, ou ajoutez le répertoire à `files.packRoots` dans le fichier de configuration puis redémarrez l'instance."

"TBY-STO-001.what": "Le store local n'a pas pu être lu."
"TBY-STO-001.cause": "{{.detail}}"
"TBY-STO-001.action": "Vérifiez que le répertoire de stockage existe, est monté et lisible par l'instance, puis réessayez."

"TBY-STO-003.what": "L'écriture du téléchargement partiel dans le répertoire d'état a échoué."
"TBY-STO-003.cause": "{{.path}} n'a pas pu être écrit : {{.detail}} — le plus souvent un manque d'espace libre, ou des permissions que l'utilisateur de l'instance n'a pas sur la racine d'état."
"TBY-STO-003.action": "Libérez de l'espace sur le répertoire d'état (il héberge temporairement une copie de chaque blob reprenable) ou corrigez ses permissions, puis relancez la tâche. Abaissez transfer.resumeThreshold pour rendre moins de blobs reprenables, ou mettez-le à 0 pour transférer chaque blob directement vers le store sans fichier temporaire."

"TBY-STO-002.what": "L'écriture dans le store local a échoué."
"TBY-STO-002.cause": "{{.detail}}"
"TBY-STO-002.action": "Vérifiez l'espace libre et les permissions du répertoire de stockage, puis relancez l'opération."

"TBY-MED-001.what": "Le support ne porte aucun manifeste de média."
"TBY-MED-001.cause": "{{.path}} est absent — le store n'a pas été produit par une synchronisation miroir menée à son terme, ou la copie sur le support est partielle."
"TBY-MED-001.action": "Recopiez le store depuis l'instance source, ou relancez la synchronisation miroir qui le produit. Rien ne peut être poussé depuis un support sans inventaire, et ce refus n'admet aucune dérogation."

"TBY-MED-002.what": "Le manifeste de média est illisible."
"TBY-MED-002.cause": "{{.path}} est tronqué, non analysable ou incohérent : {{.detail}}."
"TBY-MED-002.action": "Recopiez le store depuis l'instance source puis vérifiez à nouveau. Un manifeste qui ne s'analyse pas ne laisse rien à quoi confronter le support, et ce refus n'admet aucune dérogation."

"TBY-MED-003.what": "Le manifeste de média utilise une version de format non prise en charge."
"TBY-MED-003.cause": "Le support déclare le format de manifeste {{.found}} ; cette version de Tobby lit le format {{.supported}}."
"TBY-MED-003.action": "Utilisez de ce côté une version de Tobby correspondant au support, ou reproduisez le support avec la version qui tourne ici."

"TBY-MED-004.what": "Le support utilise une version de format de store non prise en charge."
"TBY-MED-004.cause": "Le support déclare le format de store {{.found}} ; cette version de Tobby lit le format {{.supported}}."
"TBY-MED-004.action": "Utilisez une version de Tobby correspondant au support, ou transférez le contenu via le format OCI image layout avec l'outillage standard (skopeo, oras, crane)."

"TBY-MED-005.what": "Le graphe de recipes du support ne correspond pas à son inventaire."
"TBY-MED-005.cause": "{{.path}} a pour empreinte {{.actual}} alors que le manifeste enregistre {{.expected}} — la liste de ce que le support livre a changé depuis l'écriture du manifeste."
"TBY-MED-005.action": "Recopiez le store depuis l'instance source. Le graphe de recipes est ce à partir de quoi chaque verdict par recipe est calculé : un graphe altéré bloque le support entier, sans dérogation."

"TBY-MED-006.what": "Le support est adressé à une autre zone."
"TBY-MED-006.cause": "Le manifeste nomme la zone {{.found}} ; cette instance sert la zone {{.expected}}."
"TBY-MED-006.action": "Vérifiez qu'il s'agit bien du support destiné à cette zone. Un administrateur peut lever le refus délibérément ; la dérogation est consignée au journal d'audit."

"TBY-MED-007.what": "Le support est plus ancien que le dernier importé pour cette zone."
"TBY-MED-007.cause": "Le support {{.media}} a été résolu le {{.resolved}}, alors que la zone {{.zone}} a importé en dernier un contenu résolu le {{.recorded}} — l'importer ferait reculer la zone."
"TBY-MED-007.action": "Vérifiez que vous avez branché le support courant. Un administrateur peut lever le refus délibérément — pour restaurer volontairement une livraison antérieure, par exemple ; la dérogation est consignée au journal d'audit."

"TBY-MED-010.what": "Un fichier nécessaire à la recipe est absent du support."
"TBY-MED-010.cause": "{{.recipe}} atteint {{.path}}, que le support ne porte pas — copie partielle, ou fichier supprimé."
"TBY-MED-010.action": "Recopiez le store depuis l'instance source. La recipe est bloquée entière, sans dérogation ; les recipes intactes du même support restent poussables."

"TBY-MED-011.what": "Un fichier du support n'a pas la taille attendue."
"TBY-MED-011.cause": "{{.path}} contient {{.actual}} octets alors que le manifeste enregistre {{.expected}} — le fichier a été tronqué ou modifié après l'écriture du manifeste."
"TBY-MED-011.action": "Recopiez le store depuis l'instance source. La recipe qui atteint ce fichier est bloquée entière, sans dérogation."

"TBY-MED-012.what": "Un fichier du support ne correspond pas à son empreinte enregistrée."
"TBY-MED-012.cause": "{{.path}} a pour empreinte {{.actual}} alors que le manifeste enregistre {{.expected}} — le contenu a été corrompu ou altéré pendant le transport."
"TBY-MED-012.action": "Recopiez le store depuis l'instance source. La recipe qui atteint ce fichier est bloquée entière, sans dérogation."

"TBY-MED-013.what": "Un fichier nécessaire à la recipe est absent de l'inventaire."
"TBY-MED-013.cause": "{{.recipe}} atteint {{.path}}, que le manifeste de média ne liste pas — le manifeste ne peut donc pas en répondre."
"TBY-MED-013.action": "Reproduisez le support depuis l'instance source pour que le manifeste couvre tout ce que les recipes atteignent. La recipe est bloquée entière, sans dérogation."

"TBY-MED-014.what": "Un manifeste du support est illisible."
"TBY-MED-014.cause": "{{.path}} n'est pas lisible comme manifeste ou index OCI : {{.detail}}."
"TBY-MED-014.action": "Recopiez le store depuis l'instance source. Ce que la recipe livre ne peut pas être établi à partir d'un manifeste illisible : la recipe est bloquée entière."

"TBY-MED-015.what": "Un blob du support est rangé sous une mauvaise empreinte."
"TBY-MED-015.cause": "{{.path}} est adressé comme {{.expected}} mais ses octets ont pour empreinte {{.actual}} — le stockage adressé par contenu se contredit."
"TBY-MED-015.action": "Recopiez le store depuis l'instance source. La recipe qui atteint ce blob est bloquée entière, sans dérogation."

"TBY-MED-020.what": "Un fichier du support n'est pas couvert par l'inventaire."
"TBY-MED-020.cause": "{{.path}} se trouve sous la couverture du manifeste mais celui-ci ne le liste pas — il a été ajouté après l'écriture du manifeste."
"TBY-MED-020.action": "Rien à faire pour continuer : le contenu surnuméraire n'est jamais poussé. Cherchez comment il est arrivé sur le support si ce n'est pas vous qui l'y avez mis."

"TBY-MED-021.what": "Un fichier du support n'est atteint par aucune recipe."
"TBY-MED-021.cause": "{{.path}} est inventorié mais aucune recipe de ce support ne le livre — le plus souvent, un reliquat d'une livraison antérieure."
"TBY-MED-021.action": "Rien à faire pour continuer : un contenu atteint par aucune recipe n'est jamais poussé. Élaguez le store source si vous voulez que le support porte moins."

"TBY-MED-022.what": "Un fichier de tenue de registre du support ne correspond pas à son empreinte enregistrée."
"TBY-MED-022.cause": "{{.path}} ne correspond pas à son entrée d'inventaire — la comptabilité interne du store a été modifiée après l'écriture du manifeste."
"TBY-MED-022.action": "Rien n'est poussé depuis ce fichier, la vérification continue ; recopiez le store depuis l'instance source si vous ne l'avez pas modifié délibérément."

"TBY-STO-004.what": "L'opération a été refusée avant de démarrer : la cible n'a pas assez d'espace libre."
"TBY-STO-004.cause": "{{.path}} demande {{.needed}} octets et seuls {{.available}} sont utilisables — {{.free}} octets sont libres, moins la marge de sécurité de {{.margin}} %. Il manque {{.shortfall}} octets."
"TBY-STO-004.action": "Libérez au moins {{.shortfall}} octets sur la cible, visez un volume plus grand, ou supprimez du contenu qui n'est plus référencé. N'abaissez preflight.safetyMarginPercent que si vous acceptez de remplir le volume."

"TBY-STO-005.what": "Le système de fichiers de la cible ne peut pas contenir un fichier de cette taille."
"TBY-STO-005.cause": "{{.path}} est formaté en {{.filesystem}}, dont le plus gros fichier possible fait {{.limit}} octets ; le transfert ({{.what}}) écrirait un fichier de {{.size}} octets."
"TBY-STO-005.action": "Reformatez le support avec un système de fichiers sans cette limite (exFAT, NTFS, ext4, XFS), ou découpez le transfert pour qu'aucun fichier ne dépasse la limite."

"TBY-STO-006.what": "Le store n'a pas été réinitialisé."
"TBY-STO-006.cause": "La confirmation saisie ne correspond pas : la remise à zéro du store exige de taper {{.phrase}} exactement, en majuscules, et rien d'autre."
"TBY-STO-006.action": "Saisissez {{.phrase}} dans le champ de confirmation et validez de nouveau. Une remise à zéro supprime tous les artefacts de ce store ; l'historique des opérations et les journaux de tâches sont conservés."

"TBY-LAY-001.what": "Ce n'est pas un OCI image layout exploitable."
"TBY-LAY-001.cause": "{{.path}} n'a pas pu être lu comme tel : {{.detail}}"
"TBY-LAY-001.action": "Vérifiez que le chemin désigne bien le layout lui-même — le répertoire (ou son tar non compressé) contenant `oci-layout`, `index.json` et `blobs/`. Une archive compressée doit d'abord être décompressée. `skopeo copy oci:<chemin>:<tag> …` sur le même chemin vous dira si un outil OCI y arrive davantage."

"TBY-LAY-002.what": "L'archive a été refusée : une de ses entrées n'a rien à faire dans un image layout."
"TBY-LAY-002.cause": "Dans {{.path}}, l'entrée {{.entry}} a été refusée — {{.reason}}."
"TBY-LAY-002.action": "Rien n'a été écrit. Une archive OCI image layout ne contient que `oci-layout`, `index.json` et des fichiers `blobs/<algorithme>/<digest>` : une archive qui porte en plus des liens ou des chemins sortant d'elle-même n'a pas été produite par un outil OCI. Faites refabriquer le support à sa source, et signalez-le comme incident s'il provient de l'extérieur de votre organisation."

"TBY-LAY-003.what": "La destination de l'export existe déjà."
"TBY-LAY-003.cause": "{{.path}} est déjà présent, et cet export n'était pas autorisé à le remplacer."
"TBY-LAY-003.action": "Choisissez une autre destination, ou relancez l'export avec l'option de remplacement (`--overwrite` en ligne de commande) une fois certain que ce qui s'y trouve peut être perdu."

"TBY-TSK-001.what": "La tâche n'existe pas."
"TBY-TSK-001.cause": "Aucune tâche d'identifiant {{.id}} sur cette instance — lien erroné, ou store réinitialisé."
"TBY-TSK-001.action": "Ouvrez la liste des tâches et suivez le lien d'une tâche existante."

"TBY-SRV-001.what": "Une erreur interne s'est produite."
"TBY-SRV-001.cause": "Une condition inattendue a interrompu la requête ; le détail est dans les journaux de l'instance."
"TBY-SRV-001.action": "Réessayez ; si cela persiste, cherchez dans les journaux de l'instance l'identifiant de corrélation affiché avec cette erreur."

"TBY-SRV-002.what": "Cette ressource n'existe pas."
"TBY-SRV-002.cause": "L'adresse est erronée, ou le contenu a été supprimé."
"TBY-SRV-002.action": "Revenez au navigateur de contenu ou utilisez la recherche."

"TBY-SRV-003.what": "L'instance est injoignable."
"TBY-SRV-003.cause": "La connexion réseau est tombée, ou l'instance redémarre."
"TBY-SRV-003.action": "Vérifiez votre liaison réseau et réessayez ; la page reprend dès que l'instance répond."
