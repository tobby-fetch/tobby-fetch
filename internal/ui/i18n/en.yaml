# File sets: what the instance holds and serves under /files/ (FR-047), and
# the packing of a local directory into one (FR-048).
"filesets.title": "File sets"
"filesets.subtitle": "Files packaged as OCI images: what this instance holds, what it serves read-only under /files/, and how to package a directory of the host into one."
"filesets.no_upload": "There is no upload here, by design. The form takes a PATH on the instance host: the files are packaged as an OCI image and imported into the store, so the content stays addressed by its digest, inventoried and removable like everything else."
"filesets.admin_only": "Packing requires the administrator role: it reads a directory of the instance host and puts unsigned content into the store."
"filesets.inert": "No directory is allowed for packing from here. Add the directory to files.packRoots in the configuration file and restart the instance, or run `tobby fileset pack` on the host, which is not restricted."
"filesets.pack_title": "Package a directory"
"filesets.source_label": "Directory on the instance host"
"filesets.source_help": "An absolute path, readable by the instance, inside one of the directories files.packRoots allows."
"filesets.name_label": "File set name"
"filesets.name_help": "Lowercase, one word: it becomes the last part of the reference and the /files/<name>/ segment that serves it."
"filesets.version_label": "Version"
"filesets.version_help": "The tag the packaged image carries, for example 1.0.0. Packing the same directory again under the same version writes nothing: the digest is identical."
"filesets.submit": "Package and import"
"filesets.packed": "{{.Reference}} version {{.Version}} was packaged and imported."
"filesets.packed_counts": "{{.Files}} files, {{.Directories}} directories, {{.Symlinks}} symbolic links, {{.Size}}."
"filesets.copy_digest": "Copy the digest"
"filesets.unsigned_note": "This file set is unsigned and of local origin. Tobby holds no private key and signs nothing (ADR-0007), so nothing here proves where these files came from — the listing records it as a manual import for that reason."
"filesets.serve_title": "Serving it"
"filesets.serve_note": "Serving is a separate, explicit step: nothing is served until the configuration says so (FR-047). Add this block to the configuration file and restart the instance."
"filesets.serve_snippet_label": "configuration block"
"filesets.copy_snippet": "Copy the configuration block"
"filesets.toast_packed": "{{.Reference}} was packaged and imported."
"filesets.rules_title": "What is refused"
"filesets.rule_symlink": "A symbolic link pointing outside the directory, or to an absolute path: it would escape the file set wherever it is extracted."
"filesets.rule_special": "A device node, a FIFO, a socket, or a setuid bit: extraction never carries these, so packaging them would promise files nobody receives."
