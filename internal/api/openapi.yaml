#
# OpenAPI 3.1 contract of the Tobby REST API (FR-060). The API is the
# strict mirror of the web UI (FR-061): every endpoint carries exactly the
# parameters of its screen, and every error is an entry of the single
# error taxonomy rendered as an RFC 9457 problem document. A test
# cross-checks this document against the registered routes.
openapi: 3.1.0
info:
  title: Tobby REST API
  # The API major version. The binary's build version is shown on /about
  # and in the tobby_build_info metric — this document is static.
  version: v1
  description: >
    Versioned REST API of a Tobby instance, in strict parity with the web
    UI (FR-061): same parameters, same error taxonomy. Payloads carry raw
    bytes and RFC 3339 timestamps exclusively; localization is a UI
    concern. Errors are RFC 9457 problem documents whose extension members
    (code, probable_cause, action, correlation_id) come from the embedded
    error taxonomy; the "type" member is the in-instance troubleshooting
    anchor /help#<code>, resolvable offline.
  license:
    name: GPL-3.0-only
    identifier: GPL-3.0-only
servers:
  - url: /
    description: The instance itself (single listener, ADR-0015).
security:
  - basicAuth: []
  - bearerAuth: []
paths:
  /api/v1/openapi.yaml:
    get:
      summary: This document, as application/yaml. Role viewer.
      responses:
        "200":
          description: The embedded OpenAPI 3.1 document.
          content:
            application/yaml:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/content:
    get:
      summary: >-
        List the repositories of the local store, grouped and paginated.
        Mirror of the /content screen. Role viewer.
      parameters:
        - name: q
          in: query
          required: false
          description: Substring filter on the full relocated path.
          schema:
            type: string
        - name: kind
          in: query
          required: false
          description: Keep only the listed kinds (repeatable).
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Kind"
        - name: prefix
          in: query
          required: false
          description: Keep repositories under an exact path prefix.
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: 1-based page number.
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: One page of repositories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/content/{repo}:
    get:
      summary: >-
        Repository detail with its tags. Mirror of the /content/{repo}
        screen. Role viewer.
      parameters:
        - $ref: "#/components/parameters/Repo"
      responses:
        "200":
          description: The repository and its tags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentRepo"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      summary: >-
        Remove one unit-imported repository and garbage-collect (FR-044
        amendment). Mirror of the repository page's removal action.
        Recipe-managed content is refused with TBY-POL-002 naming the
        managing recipes; seeded content (pushed through /v2/) with
        TBY-POL-003 — only unit-import provenance is removable. Audited
        (FR-094). Role admin.
      parameters:
        - $ref: "#/components/parameters/Repo"
      responses:
        "204":
          description: The repository was removed and the store swept.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/content/{repo}/-/tags/{tag}:
    get:
      summary: >-
        Manifest detail of one tag, platforms and local presence included
        (sparse index, FR-022). The "/-/" separator is the deterministic
        repository/sub-resource split (ADR-0015). Role viewer.
      parameters:
        - $ref: "#/components/parameters/Repo"
        - name: tag
          in: path
          required: true
          description: The tag name.
          schema:
            type: string
      responses:
        "200":
          description: The manifest detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentManifest"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/import:
    post:
      summary: >-
        Enqueue one unit-import task from a prior inspection. The digests
        are re-verified at commit (FR-026). Mirror of the /import screen's
        confirmation. Role operator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "201":
          description: The created task.
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/import/inspect:
    get:
      summary: >-
        Inspect a remote reference before importing — bounded by
        import.inspectTimeout. Mirror of the /import screen's step 2.
        Role operator.
      parameters:
        - name: ref
          in: query
          required: true
          description: "The reference to inspect (registry/repo:tag or @digest)."
          schema:
            type: string
      responses:
        "200":
          description: The inspection report with per-platform status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectReport"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks:
    get:
      summary: >-
        List the tasks of the persistent queue, newest first. Mirror of
        the /tasks screen (same q, status, type parameters). Role viewer.
      parameters:
        - name: q
          in: query
          required: false
          description: Substring filter on the task reference.
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Keep only tasks in this status.
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - name: type
          in: query
          required: false
          description: Keep only tasks of this type ("unit-import").
          schema:
            type: string
      responses:
        "200":
          description: The matching tasks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{id}:
    get:
      summary: One task with its items and aggregates. Role viewer.
      parameters:
        - $ref: "#/components/parameters/TaskID"
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{id}/logs:
    get:
      summary: >-
        Task logs: ?format=raw downloads the whole log as text/plain
        (Content-Disposition names task and run); otherwise ?after=N
        answers the incremental {chunk, next} cursor contract of the
        screen's log follow. Role viewer.
      parameters:
        - $ref: "#/components/parameters/TaskID"
        - name: format
          in: query
          required: false
          description: '"raw" downloads the complete log as text/plain.'
          schema:
            type: string
            enum: [raw]
        - name: after
          in: query
          required: false
          description: Byte cursor of the incremental read (default 0).
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: The log chunk (JSON cursor form, or raw text).
          content:
            application/json:
              schema:
                type: object
                properties:
                  chunk:
                    type: string
                    description: Log bytes after the cursor.
                  next:
                    type: integer
                    description: The cursor for the next read.
            text/plain:
              schema:
                type: string
                description: The complete log (?format=raw).
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/recipes:
    get:
      summary: >-
        List the recipe graph recorded in the local store, one entry per
        recorded recipe version, name-ordered and most recently resolved
        first. Mirror of the /recipes screen. An admitted-unsigned recipe
        carries verified=false plus the declared trust_scope that admitted
        it (FR-033) — never silently. Role viewer.
      responses:
        "200":
          description: The recorded recipes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipes:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecipeRecord"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/recipes/{recipe}/mapping:
    get:
      summary: >-
        The source→destination mapping of one recipe (FR-035, FR-065):
        every recorded version, most recently resolved first, with its
        ingredient rows — kind, local relocated repository path, tag, and
        pinned digest. Mirror of the /recipes/{recipe}/mapping screen.
        Role viewer.
      parameters:
        - name: recipe
          in: path
          required: true
          description: The recipe name.
          schema:
            type: string
      responses:
        "200":
          description: The recorded versions and their ingredient mapping.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipe:
                    type: string
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecipeRecord"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/sync:
    post:
      summary: >-
        Trigger one synchronization (FR-014): enqueue a sync task whose
        reference is the configured Retriever source (FR-010); the runner
        discovers the items. Mirror of the screens' "Synchronize" button.
        Without a configured source the trigger answers TBY-CFG-001.
        Audited (FR-094). Role operator.
      responses:
        "201":
          description: The created task.
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/retriever:
    get:
      summary: >-
        The Retriever configuration in effect, read-only — the
        configuration itself comes from file, environment, and flags only
        (FR-003). Mirror of the /admin/retriever screen: configured
        source (FR-010), declared relaxed trust scopes (FR-033),
        anonymously served FileSets (FR-047), and the latest sync task.
        Role admin.
      responses:
        "200":
          description: The Retriever configuration and the last sync.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Retriever"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/account/password:
    post:
      summary: >-
        Change the authenticated account's own password. Mirror of the
        /account screen (FR-061), any authenticated role — administrators
        manage other accounts through /admin/accounts. The new password
        must be non-empty and different from the current one
        (TBY-AUTH-007); a wrong current password answers TBY-AUTH-006.
        API tokens carry no password and fail the current-password check.
        On success every UI session of the account is closed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, new]
              properties:
                current:
                  type: string
                  description: The account's current password.
                new:
                  type: string
                  description: >-
                    The new password — non-empty, different from the
                    current one.
      responses:
        "204":
          description: >-
            The password was changed; other sessions of the account are
            signed out.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/accounts:
    get:
      summary: >-
        List the local accounts — never password hashes. Mirror of the
        /admin/accounts screen. Role admin.
      responses:
        "200":
          description: The accounts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
        default:
          $ref: "#/components/responses/Problem"
    post:
      summary: >-
        Create a local account (FR-073). The instance derives the argon2id
        password hash: there is no hash field, and a password hash is
        never submitted (FR-066). Mirror of the account creation form of
        the /admin/accounts screen. Role admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role, password]
              properties:
                name:
                  type: string
                  description: Unique login among the local accounts.
                role:
                  $ref: "#/components/schemas/Role"
                password:
                  type: string
                  description: >-
                    The clear password, hashed with argon2id by the
                    instance. Non-empty (TBY-AUTH-008).
      responses:
        "201":
          description: The created account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: "#/components/schemas/Account"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/accounts/{name}:
    patch:
      summary: >-
        Change an account's role (FR-074). Demoting the last administrator
        is refused with TBY-AUTH-011: the instance would become
        unmanageable. Every UI session of the account is closed on
        success — a session carries the role it was opened with. Role
        admin.
      parameters:
        - name: name
          in: path
          required: true
          description: The account login.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: "#/components/schemas/Account"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      summary: >-
        Delete a local account (FR-073). Deleting the last administrator is
        refused with TBY-AUTH-011. Open UI sessions of the account are
        closed. Role admin.
      parameters:
        - name: name
          in: path
          required: true
          description: The account login.
          schema:
            type: string
      responses:
        "204":
          description: The account was deleted and its sessions closed.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tokens:
    get:
      summary: >-
        List the static API tokens, revoked included — never secrets.
        Role admin.
      responses:
        "200":
          description: The tokens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/Token"
        default:
          $ref: "#/components/responses/Problem"
    post:
      summary: >-
        Create a static API token (FR-072). The clear secret is returned
        exactly once, in this response; only its SHA-256 is stored.
        Role admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role]
              properties:
                name:
                  type: string
                  description: Unique name among the active tokens.
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "201":
          description: The created token with its one-time secret.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  role:
                    $ref: "#/components/schemas/Role"
                  secret:
                    type: string
                    description: >-
                      The clear token secret ("tby_…") — shown exactly
                      once, never re-displayable.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tokens/{name}/revoke:
    post:
      summary: >-
        Revoke a token immediately and permanently (FR-072). Role admin.
      parameters:
        - name: name
          in: path
          required: true
          description: The token name.
          schema:
            type: string
      responses:
        "200":
          description: The revoked token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    $ref: "#/components/schemas/Token"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: >-
        Account name and password, or token name and token secret — the
        same accounts as the web UI and the embedded registry (FR-076).
    bearerAuth:
      type: http
      scheme: bearer
      description: A static API token secret ("tby_…", FR-072).
  parameters:
    Repo:
      name: repo
      in: path
      required: true
      description: >-
        The relocated repository path; may contain slashes
        (e.g. docker.io/library/redis).
      schema:
        type: string
    TaskID:
      name: id
      in: path
      required: true
      description: The task identifier.
      schema:
        type: string
  responses:
    Problem:
      description: >-
        Any error, as an RFC 9457 problem document carrying the taxonomy
        entry (application/problem+json) with its entry's HTTP status.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: >-
        RFC 9457 problem document. The extension members come from the
        single error taxonomy; "type" is the in-instance troubleshooting
        anchor, resolvable offline.
      properties:
        type:
          type: string
          description: In-instance troubleshooting anchor, "/help#<code>".
        title:
          type: string
          description: What happened, in the negotiated language.
        status:
          type: integer
          description: The HTTP status of the response.
        code:
          type: string
          description: The stable taxonomy code ("TBY-REG-003").
        probable_cause:
          type: string
          description: The probable cause, in the negotiated language.
        action:
          type: string
          description: The corrective action, in the negotiated language.
        correlation_id:
          type: string
          description: Run or task identifier for log correlation (FR-090).
      required: [type, title, status, code, probable_cause, action]
    Kind:
      type: string
      description: The five frozen ingredient kinds (never translated).
      enum: [ContainerImage, HelmChart, OCIArtifact, FileSet, Recipe]
    Role:
      type: string
      description: The closed role ladder (ADR-0009).
      enum: [viewer, operator, admin]
    TaskStatus:
      type: string
      description: >-
        Stored task and item statuses. "Done with errors" is a rendering
        of failed plus aggregates, not a stored state.
      enum: [pending, running, done, failed, skipped]
    ContentList:
      type: object
      properties:
        repositories:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              kind:
                $ref: "#/components/schemas/Kind"
              tags:
                type: integer
              sizeBytes:
                type: integer
                description: Logical size in bytes (deduplicated per repository).
        page:
          type: integer
        totalPages:
          type: integer
        total:
          type: integer
    ContentRepo:
      type: object
      properties:
        name:
          type: string
        kind:
          $ref: "#/components/schemas/Kind"
        tags:
          type: array
          items:
            type: object
            properties:
              tag:
                type: string
              digest:
                type: string
              sizeBytes:
                type: integer
              platforms:
                type: integer
                description: Index entries, locally present or not.
              presentPlatforms:
                type: integer
                description: Entries whose manifest is locally held (sparse index, FR-022).
    ContentManifest:
      type: object
      properties:
        repo:
          type: string
        tag:
          type: string
        digest:
          type: string
          description: The pinned original index digest (sparse index, FR-022).
        mediaType:
          type: string
        kind:
          $ref: "#/components/schemas/Kind"
        sizeBytes:
          type: integer
        annotations:
          type: object
          additionalProperties:
            type: string
        platforms:
          type: array
          items:
            type: object
            properties:
              os:
                type: string
              arch:
                type: string
              variant:
                type: string
              digest:
                type: string
              sizeBytes:
                type: integer
              present:
                type: boolean
                description: False for a sparse-index entry absent locally.
    ImportRequest:
      type: object
      required: [reference, platforms]
      properties:
        reference:
          type: string
          description: >-
            The reference to import: registry/repo:tag or @digest, the
            oci:// notation, or an https:// Helm chart-repository URL
            (https://<base>/<chart>[:<version>], FR-024).
        vendorDependencies:
          type: boolean
          default: false
          description: >-
            FR-025 opt-in: embed a chart's missing declared dependencies
            before the artifact lands. Breaks the upstream digest and any
            upstream signature; the substitution is traced on the manifest
            (dev.tobby.vendored/* annotations), in the task report, and in
            the logs. Without it a chart unusable offline is refused
            (TBY-CHT-001).
        platforms:
          type: array
          description: The selected platforms of a prior inspection.
          items:
            type: object
            required: [name, digest]
            properties:
              name:
                type: string
                description: '"os/arch[/variant]", or the reference name.'
              digest:
                type: string
                description: The digest pinned by the inspection.
    InspectReport:
      type: object
      properties:
        reference:
          type: string
        repository:
          type: string
          description: The relocated destination repository.
        tag:
          type: string
        index_digest:
          type: string
        media_type:
          type: string
        kind:
          $ref: "#/components/schemas/Kind"
        multi_arch:
          type: boolean
        platforms:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              os:
                type: string
              arch:
                type: string
              variant:
                type: string
              digest:
                type: string
              size_bytes:
                type: integer
              status:
                type: string
                description: Per-digest status against the local store (FR-026).
                enum: [new, outdated, up-to-date]
    Task:
      type: object
      description: >-
        One task of the persistent queue: the stored schema plus read-time
        aggregates and the principal taxonomy code of a failed task.
      properties:
        id:
          type: string
        run_id:
          type: string
          description: The FR-090 correlation identifier of the run.
        type:
          type: string
          description: The task type ("unit-import" at this milestone).
        reference:
          type: string
        actor:
          type: string
          description: The authenticated identity that created the task.
        status:
          $ref: "#/components/schemas/TaskStatus"
        created:
          type: string
          format: date-time
        started:
          type: string
          format: date-time
        finished:
          type: string
          format: date-time
        resumed:
          type: boolean
          description: True after an instance-restart re-queue (FR-029).
        vendor_dependencies:
          type: boolean
          description: True when the FR-025 vendoring opt-in was requested.
        error:
          $ref: "#/components/schemas/ItemError"
        items:
          type: array
          items:
            $ref: "#/components/schemas/TaskItem"
        chart_dependencies:
          type: array
          description: Helm chart dependency report (FR-024).
          items:
            type: object
            properties:
              name:
                type: string
              version:
                type: string
              repository:
                type: string
              embedded:
                type: boolean
        items_total:
          type: integer
        items_done:
          type: integer
        items_failed:
          type: integer
        items_skipped:
          type: integer
        principal_code:
          type: string
          description: >-
            The principal taxonomy code of a failed task, computed by the
            single aggregation rule (taxonomy.Principal).
    TaskItem:
      type: object
      properties:
        name:
          type: string
        digest:
          type: string
        size_bytes:
          type: integer
        status:
          $ref: "#/components/schemas/TaskStatus"
        error:
          $ref: "#/components/schemas/ItemError"
    ItemError:
      type: object
      description: >-
        A persisted failure: taxonomy code plus typed parameters — never a
        localized sentence (ADR-0015), so history re-renders in any
        language.
      properties:
        code:
          type: string
        params:
          type: object
          additionalProperties: true
    RecipeRecord:
      type: object
      description: >-
        One recorded recipe graph entry: the recipe artifact and the
        content it manages. The ingredient list is the reachability set of
        FR-044/FR-045; zone and resolvedAt feed the media manifest
        (FR-054).
      properties:
        name:
          type: string
        version:
          type: string
        cookbookRepo:
          type: string
          description: The relocated repository holding the recipe artifact.
        digest:
          type: string
          description: The pinned digest of the recipe artifact.
        runId:
          type: string
          description: The FR-090 correlation identifier of the recording run.
        zone:
          type: string
        resolvedAt:
          type: string
          format: date-time
        verified:
          type: boolean
          description: >-
            True when the recipe signature was verified against a trust
            root (FR-033).
        trustScope:
          type: string
          description: >-
            The declared relaxed scope that admitted the recipe when
            verified is false — never empty in that case (FR-033: no
            undeclared bypass exists).
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/IngredientRecord"
    IngredientRecord:
      type: object
      description: >-
        One ingredient of a recorded recipe: where it landed locally
        (relocated path, FR-035) and under which pinned digest.
      properties:
        name:
          type: string
        kind:
          $ref: "#/components/schemas/Kind"
        repo:
          type: string
          description: The local relocated repository path (ADR-0013).
        tag:
          type: string
        digest:
          type: string
    Retriever:
      type: object
      description: >-
        The Retriever configuration in effect — read-only, mirror of the
        /admin/retriever screen.
      properties:
        source:
          type: string
          description: >-
            The configured desired-state source (FR-010); empty when not
            configured.
        relaxed_trust_scopes:
          type: array
          description: The declared allowUnsigned trust scopes (FR-033).
          items:
            type: string
        anonymous_filesets:
          type: array
          description: FileSets served without authentication (FR-047).
          items:
            type: string
        last_sync:
          $ref: "#/components/schemas/Task"
    Account:
      type: object
      properties:
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        created:
          type: string
          format: date-time
        last_login:
          type: string
          format: date-time
    Token:
      type: object
      properties:
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        created:
          type: string
          format: date-time
        revoked:
          type: boolean
