#
# OpenAPI 3.1 contract of the Tobby REST API (FR-060). The API is the
# strict mirror of the web UI (FR-061): every endpoint carries exactly the
# parameters of its screen, and every error is an entry of the single
# error taxonomy rendered as an RFC 9457 problem document. A test
# cross-checks this document against the registered routes.
openapi: 3.1.0
info:
  title: Tobby REST API
  # The API major version. The binary's build version is shown on /about
  # and in the tobby_build_info metric — this document is static.
  version: v1
  description: >
    Versioned REST API of a Tobby instance, in strict parity with the web
    UI (FR-061): same parameters, same error taxonomy. Payloads carry raw
    bytes and RFC 3339 timestamps exclusively; localization is a UI
    concern. Errors are RFC 9457 problem documents whose extension members
    (code, probable_cause, action, correlation_id) come from the embedded
    error taxonomy; the "type" member is the in-instance troubleshooting
    anchor /help#<code>, resolvable offline.
  license:
    name: GPL-3.0-only
    identifier: GPL-3.0-only
servers:
  - url: /
    description: The instance itself (single listener, ADR-0015).
security:
  - basicAuth: []
  - bearerAuth: []
paths:
  /api/v1/openapi.yaml:
    get:
      summary: This document, as application/yaml. Role viewer.
      responses:
        "200":
          description: The embedded OpenAPI 3.1 document.
          content:
            application/yaml:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/content:
    get:
      summary: >-
        List the repositories of the local store, grouped and paginated.
        Mirror of the /content screen. Role viewer.
      parameters:
        - name: q
          in: query
          required: false
          description: Substring filter on the full relocated path.
          schema:
            type: string
        - name: kind
          in: query
          required: false
          description: Keep only the listed kinds (repeatable).
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Kind"
        - name: prefix
          in: query
          required: false
          description: Keep repositories under an exact path prefix.
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: 1-based page number.
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: One page of repositories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/content/{repo}:
    get:
      summary: >-
        Repository detail with its tags. Mirror of the /content/{repo}
        screen. Role viewer.
      parameters:
        - $ref: "#/components/parameters/Repo"
      responses:
        "200":
          description: The repository and its tags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentRepo"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      summary: >-
        Remove one unit-imported repository and garbage-collect (FR-044
        amendment). Mirror of the repository page's removal action.
        Recipe-managed content is refused with TBY-POL-002 naming the
        managing recipes; seeded content (pushed through /v2/) with
        TBY-POL-003 — only unit-import provenance is removable. Audited
        (FR-094). Role admin.
      parameters:
        - $ref: "#/components/parameters/Repo"
      responses:
        "204":
          description: The repository was removed and the store swept.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/content/{repo}/-/tags/{tag}:
    get:
      summary: >-
        Manifest detail of one tag, platforms and local presence included
        (sparse index, FR-022). The "/-/" separator is the deterministic
        repository/sub-resource split (ADR-0015). Role viewer.
      parameters:
        - $ref: "#/components/parameters/Repo"
        - name: tag
          in: path
          required: true
          description: The tag name.
          schema:
            type: string
      responses:
        "200":
          description: The manifest detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentManifest"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/import:
    post:
      summary: >-
        Enqueue one unit-import task from a prior inspection. The digests
        are re-verified at commit (FR-026). Mirror of the /import screen's
        confirmation. Role operator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "201":
          description: The created task.
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/import/inspect:
    get:
      summary: >-
        Inspect a remote reference before importing — bounded by
        import.inspectTimeout. Mirror of the /import screen's step 2.
        Role operator.
      parameters:
        - name: ref
          in: query
          required: true
          description: "The reference to inspect (registry/repo:tag or @digest)."
          schema:
            type: string
      responses:
        "200":
          description: The inspection report with per-platform status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectReport"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks:
    get:
      summary: >-
        List the tasks of the persistent queue, newest first, paginated
        like the content listing. Mirror of the /tasks screen (same q,
        status, type, page parameters). Role viewer.
      parameters:
        - name: q
          in: query
          required: false
          description: Substring filter on the task reference.
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Keep only tasks in this status.
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - name: type
          in: query
          required: false
          description: Keep only tasks of this type ("unit-import").
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: 1-based page number.
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: One page of matching tasks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
                  page:
                    type: integer
                  totalPages:
                    type: integer
                  total:
                    type: integer
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{id}:
    get:
      summary: One task with its items and aggregates. Role viewer.
      parameters:
        - $ref: "#/components/parameters/TaskID"
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{id}/logs:
    get:
      summary: >-
        Task logs: ?format=raw downloads the whole log as text/plain
        (Content-Disposition names task and run); otherwise ?after=N
        answers the incremental {chunk, next} cursor contract of the
        screen's log follow. Role viewer.
      parameters:
        - $ref: "#/components/parameters/TaskID"
        - name: format
          in: query
          required: false
          description: '"raw" downloads the complete log as text/plain.'
          schema:
            type: string
            enum: [raw]
        - name: after
          in: query
          required: false
          description: Byte cursor of the incremental read (default 0).
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: The log chunk (JSON cursor form, or raw text).
          content:
            application/json:
              schema:
                type: object
                properties:
                  chunk:
                    type: string
                    description: Log bytes after the cursor.
                  next:
                    type: integer
                    description: The cursor for the next read.
            text/plain:
              schema:
                type: string
                description: The complete log (?format=raw).
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/recipes:
    get:
      summary: >-
        List the recipe graph recorded in the local store, one entry per
        recorded recipe version, name-ordered and most recently resolved
        first. Mirror of the /recipes screen. An admitted-unsigned recipe
        carries verified=false plus the declared trust_scope that admitted
        it (FR-033) — never silently. Role viewer.
      responses:
        "200":
          description: The recorded recipes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipes:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecipeRecord"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/recipes/{recipe}/mapping:
    get:
      summary: >-
        The source→destination mapping of one recipe (FR-035, FR-065):
        every recorded version, most recently resolved first, with its
        ingredient rows — kind, local relocated repository path, tag, and
        pinned digest. Mirror of the /recipes/{recipe}/mapping screen.
        Role viewer.
      parameters:
        - name: recipe
          in: path
          required: true
          description: The recipe name.
          schema:
            type: string
      responses:
        "200":
          description: The recorded versions and their ingredient mapping.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipe:
                    type: string
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecipeRecord"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/sync:
    post:
      summary: >-
        Trigger one synchronization (FR-014): enqueue a sync task whose
        reference is the configured Retriever source (FR-010); the runner
        discovers the items. Mirror of the screens' "Synchronize" button.
        Without a configured source the trigger answers TBY-CFG-001.
        Audited (FR-094). Role operator.
      responses:
        "201":
          description: The created task.
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/retriever:
    get:
      summary: >-
        The Retriever configuration in effect, read-only — the
        configuration itself comes from file, environment, and flags only
        (FR-003), with the single exception of the reconciliation
        interval below. Mirror of the /admin/retriever screen: configured
        source (FR-010), promotion target (FR-013, FR-034), declared
        relaxed trust scopes (FR-033), anonymously served FileSets
        (FR-047), and the latest sync task. Role admin.
      responses:
        "200":
          description: The Retriever configuration and the last sync.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Retriever"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/retriever/interval:
    put:
      summary: >-
        Set the reconciliation interval of a running instance (FR-013:
        the interval is changeable without redeployment). The override is
        persisted in the state directory and survives a restart; it wins
        over sync.interval until it is cleared. Role admin, audited as a
        sensitive configuration change (FR-094). Mirror of the interval
        form on /admin/retriever. An instance with no reconciliation loop
        — mirror mode, where FR-014 requires manual triggering — answers
        TBY-CFG-001.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [interval]
              properties:
                interval:
                  type: string
                  description: >-
                    A Go duration ("30m", "2h"), or "0" to stop the
                    periodic reconciliation without affecting the manual
                    trigger. Anything unparseable, or below the reported
                    minimum without being zero, answers TBY-VAL-001.
      responses:
        "200":
          description: The interval now in effect.
          content:
            application/json:
              schema:
                type: object
                properties:
                  interval:
                    $ref: "#/components/schemas/Interval"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      summary: >-
        Clear the interval override and return to the configured value
        (FR-003 precedence). Clearing an absent override succeeds. Role
        admin, audited (FR-094). Mirror of submitting the interval form
        with an empty field.
      responses:
        "200":
          description: The interval now in effect.
          content:
            application/json:
              schema:
                type: object
                properties:
                  interval:
                    $ref: "#/components/schemas/Interval"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/account/password:
    post:
      summary: >-
        Change the authenticated account's own password. Mirror of the
        /account screen (FR-061), any authenticated role — administrators
        manage other accounts through /admin/accounts. The new password
        must be non-empty and different from the current one
        (TBY-AUTH-007); a wrong current password answers TBY-AUTH-006.
        API tokens carry no password and fail the current-password check.
        On success every UI session of the account is closed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, new]
              properties:
                current:
                  type: string
                  description: The account's current password.
                new:
                  type: string
                  description: >-
                    The new password — non-empty, different from the
                    current one.
      responses:
        "204":
          description: >-
            The password was changed; other sessions of the account are
            signed out.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/accounts:
    get:
      summary: >-
        List the local accounts — never password hashes. Mirror of the
        /admin/accounts screen. Role admin.
      responses:
        "200":
          description: The accounts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
        default:
          $ref: "#/components/responses/Problem"
    post:
      summary: >-
        Create a local account (FR-073). The instance derives the argon2id
        password hash: there is no hash field, and a password hash is
        never submitted (FR-066). Mirror of the account creation form of
        the /admin/accounts screen. Role admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role, password]
              properties:
                name:
                  type: string
                  description: Unique login among the local accounts.
                role:
                  $ref: "#/components/schemas/Role"
                password:
                  type: string
                  description: >-
                    The clear password, hashed with argon2id by the
                    instance. Non-empty (TBY-AUTH-008).
      responses:
        "201":
          description: The created account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: "#/components/schemas/Account"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/accounts/{name}:
    patch:
      summary: >-
        Change an account's role (FR-074). Demoting the last administrator
        is refused with TBY-AUTH-011: the instance would become
        unmanageable. Every UI session of the account is closed on
        success — a session carries the role it was opened with. Role
        admin.
      parameters:
        - name: name
          in: path
          required: true
          description: The account login.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: "#/components/schemas/Account"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      summary: >-
        Delete a local account (FR-073). Deleting the last administrator is
        refused with TBY-AUTH-011. Open UI sessions of the account are
        closed. Role admin.
      parameters:
        - name: name
          in: path
          required: true
          description: The account login.
          schema:
            type: string
      responses:
        "204":
          description: The account was deleted and its sessions closed.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tokens:
    get:
      summary: >-
        List the static API tokens, revoked included — never secrets.
        Role admin.
      responses:
        "200":
          description: The tokens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/Token"
        default:
          $ref: "#/components/responses/Problem"
    post:
      summary: >-
        Create a static API token (FR-072). The clear secret is returned
        exactly once, in this response; only its SHA-256 is stored.
        Role admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role]
              properties:
                name:
                  type: string
                  description: Unique name among the active tokens.
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "201":
          description: The created token with its one-time secret.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  role:
                    $ref: "#/components/schemas/Role"
                  secret:
                    type: string
                    description: >-
                      The clear token secret ("tby_…") — shown exactly
                      once, never re-displayable.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tokens/{name}/revoke:
    post:
      summary: >-
        Revoke a token immediately and permanently (FR-072). Role admin.
      parameters:
        - name: name
          in: path
          required: true
          description: The token name.
          schema:
            type: string
      responses:
        "200":
          description: The revoked token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    $ref: "#/components/schemas/Token"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/recipes/publish:
    post:
      summary: >-
        Validate a recipe document and publish it into a cookbook as the
        RECIPE-SPEC §11.2 artifact (R-40). Mirror of the /recipes/publish
        screen and of `tobby recipe push`. The document is validated
        before anything is sent: a draft, a name or version contradicting
        the reference, or an oversized document answers TBY-VAL-001; a tag
        already holding different content answers TBY-POL-004 (a published
        recipe version is immutable); a destination outside the allowlist
        answers TBY-POL-001. Publishing the same document twice is a
        no-op, reported as unchanged. Tobby signs nothing and holds no
        private key (ADR-0007): the returned digest is what `cosign sign`
        takes. Audited (FR-094). Role operator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference, document]
              properties:
                reference:
                  type: string
                  description: >-
                    The destination, registry/cookbook/name:version. A tag
                    is required — the tag carries metadata.version (§11.3)
                    — so a digest reference is refused with TBY-REG-001.
                  examples: ["registry.example.com/cookbook/wordpress:6.8.2"]
                document:
                  type: string
                  description: The recipe document (YAML), published byte for byte.
      responses:
        "200":
          description: The published artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/oci-layout/plan:
    post:
      summary: >-
        What an export would contain and cost, writing nothing (FR-051,
        FR-055). Mirror of the estimate button of /admin/oci-layout and of
        `tobby export --dry-run`. Side-effect free by construction: the
        destination is never opened. `largestFileBytes` is the size of the
        biggest single file the export would write — the whole archive in
        tar form, the biggest blob in directory form — which is the number
        a target filesystem's per-file limit (FAT32's 4 GiB) is compared
        with. Role admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LayoutExportRequest"
      responses:
        "200":
          description: The projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LayoutProjection"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/oci-layout/export:
    post:
      summary: >-
        Export the store, or a selection of it, to a standard OCI image
        layout readable by skopeo, oras and crane (FR-051, ADR-0006).
        Mirror of /admin/oci-layout and of `tobby export`. A recipe
        selection carries its ingredients, the recipe artifact, and the
        cosign signature artifacts of both in either published layout
        (RECIPE-SPEC §12.2). The original index of a multi-platform image
        travels unchanged, sparse platform sets included, so its pinned
        digest survives (FR-042). Enqueues a task and answers it.
        Audited (FR-094). Role admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LayoutExportRequest"
      responses:
        "201":
          description: The enqueued export task.
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/oci-layout/import:
    post:
      summary: >-
        Import a standard OCI image layout into the store at identical
        digests (FR-051). Mirror of /admin/oci-layout and of `tobby
        import`. The layout is untrusted data: a manifest is accepted only
        if its bytes hash to the digest addressing it, every blob is
        committed against the digest its manifest pins, and an archive
        carrying an absolute path, a traversal or a link is refused with
        TBY-LAY-002 before anything is read (NFR-011). Compressed archives
        are refused. Entries are independent: one that did not survive the
        medium fails on its own task item. Enqueues a task and answers it.
        Audited (FR-094). Role admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input:
                  type: string
                  description: The layout to read — a directory, or an uncompressed tar of one.
                  examples: ["/media/usb/payload.tar"]
                repository:
                  type: string
                  description: >-
                    Where entries belong, for a layout that names them by
                    tag alone (one produced by `skopeo copy`). A layout
                    exported by Tobby names its repositories and needs
                    nothing here.
                  examples: ["docker.io/library/alpine"]
      responses:
        "201":
          description: The enqueued import task.
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/store/reset:
    post:
      summary: >-
        Empty the store (FR-046). Mirror of /admin/store. Requires the
        exact typed confirmation, which is a frozen untranslated phrase;
        anything else answers TBY-STO-004 and is recorded as a denied
        attempt. Removes every artifact and the ledgers describing them,
        keeps the operation history and the task logs. The instance is
        usable on an empty store when this returns. Audited (FR-094),
        including on an instance running under the FR-075 authentication
        override, where the entry records the unauthenticated context.
        Role admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  type: string
                  description: The exact confirmation phrase.
                  examples: ["RESET"]
      responses:
        "200":
          description: What the reset discarded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  repositories: { type: integer }
                  bytes: { type: integer, format: int64 }
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/network:
    get:
      summary: >-
        The instance's network posture (FR-082, FR-080, FR-081). Mirror of
        the /admin/network screen: the certificate the listener presents —
        supplied or self-signed fallback, with its fingerprint, subject,
        issuer, subject alternative names and validity — and the outbound
        posture. The private key is never returned in any form, and proxy
        credentials are reported as a boolean rather than a value
        (NFR-015). Role admin.
      responses:
        "200":
          description: The network posture.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/network/certificate:
    put:
      summary: >-
        Replace the listener's certificate pair (FR-082). Mirror of the
        replacement form of /admin/network. The pair is validated in full
        before anything is written and each file is installed atomically:
        a pair that does not hold together, an expired certificate, or an
        instance with no configured pair to replace answers TBY-NET-004
        and the current certificate keeps serving. The response carries
        the new certificate's identity and nothing derived from the key.
        Audited (FR-094). Role admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [certificate, key]
              properties:
                certificate:
                  type: string
                  description: The certificate chain, PEM.
                key:
                  type: string
                  description: >-
                    The matching private key, PEM. Consumed and written;
                    never returned, logged, or digested (NFR-015).
      responses:
        "200":
          description: The certificate now served.
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificate:
                    $ref: "#/components/schemas/Certificate"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: >-
        Account name and password, or token name and token secret — the
        same accounts as the web UI and the embedded registry (FR-076).
    bearerAuth:
      type: http
      scheme: bearer
      description: A static API token secret ("tby_…", FR-072).
  parameters:
    Repo:
      name: repo
      in: path
      required: true
      description: >-
        The relocated repository path; may contain slashes
        (e.g. docker.io/library/redis).
      schema:
        type: string
    TaskID:
      name: id
      in: path
      required: true
      description: The task identifier.
      schema:
        type: string
  responses:
    Problem:
      description: >-
        Any error, as an RFC 9457 problem document carrying the taxonomy
        entry (application/problem+json) with its entry's HTTP status.
        This includes the transversal 429 (TBY-AUTH-012): every
        credential-verifying surface answers it BEFORE any credential is
        checked once an origin exceeds its failure budget (v0.4.2
        hardening — each failed check costs an argon2id computation), so
        any operation can return it. The Retry-After header says when to
        try again, in seconds.
      headers:
        Retry-After:
          description: >-
            Seconds to wait before retrying — present on the 429
            rate-limiting answer (TBY-AUTH-012) only.
          required: false
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    LayoutExportRequest:
      type: object
      description: >-
        One OCI image layout export (FR-051). Both selection members empty
        exports the whole store, which is the interoperability escape
        hatch in its most useful form.
      required: [output]
      properties:
        output:
          type: string
          description: >-
            Destination path on the instance's host: the archive file to
            write, or the directory to fill.
          examples: ["/media/usb/payload.tar"]
        format:
          type: string
          enum: [tar, directory]
          default: tar
          description: >-
            The shape written there. A single uncompressed tar by default:
            one file crosses a physical transfer more reliably than a
            tree, and an uncompressed archive is what an import can read
            back by seeking rather than inflating.
        recipes:
          type: array
          items: { type: string }
          description: >-
            Recorded recipes to export, as "name" or "name@version". Each
            carries its ingredients, its own artifact, and the cosign
            signature artifacts of both.
        repositories:
          type: array
          items: { type: string }
          description: Relocated repository paths to export, with all their tags.
        overwrite:
          type: boolean
          default: false
          description: >-
            Allow replacing an existing destination. Off by default: the
            destination of an export is usually a medium somebody else
            prepared, and replacing it answers TBY-LAY-003 otherwise.
    LayoutProjection:
      type: object
      description: >-
        What a planned export would contain and cost (FR-055). Byte counts
        are raw; formatting is a UI concern.
      properties:
        format: { type: string, enum: [tar, directory] }
        references:
          type: array
          items: { type: string }
          description: The repository:tag pairs the selection resolved to.
        manifests: { type: integer }
        blobs: { type: integer }
        files:
          type: integer
          description: Total number of files the export writes, index.json and oci-layout included.
        contentBytes:
          type: integer
          format: int64
          description: The payload total, blobs deduplicated by digest.
        totalBytes:
          type: integer
          format: int64
          description: What the export occupies on the medium, tar framing included.
        largestFileBytes:
          type: integer
          format: int64
          description: >-
            The biggest single file the export writes — the whole archive
            in tar form, the biggest blob in directory form. This is the
            number a FAT32 target's 4 GiB per-file limit is compared with.
        missing:
          type: array
          description: >-
            What the selection named and the store does not hold. Reported
            rather than fatal: a partially transferred multi-platform image
            is missing platforms by construction, and the original index
            travels unchanged so its pinned digest survives.
            The reason is a stable untranslated label.
          items:
            type: object
            properties:
              repository: { type: string }
              tag: { type: string }
              digest: { type: string }
              reason: { type: string, enum: [tag, platform, blob] }
    Publication:
      type: object
      description: >-
        The result of one recipe publication (R-40). There is deliberately
        no signature member: Tobby holds no private key (ADR-0007).
      properties:
        reference:
          type: string
          description: The fully qualified reference that was written.
        digest:
          type: string
          description: >-
            The published manifest digest — the artifact's identity, and
            the argument `cosign sign` takes (cosign signs digests, never
            tags).
        unchanged:
          type: boolean
          description: >-
            The tag already pointed at this exact content: nothing was
            written. Publishing twice is a no-op, not a conflict (§8).
    Certificate:
      type: object
      description: >-
        The public identity of the served certificate — every member is
        something the listener already hands to any client that completes
        a handshake. Nothing here is derived from the private key.
      properties:
        self_signed:
          type: boolean
          description: >-
            The generated fallback rather than a supplied pair: a degraded
            posture, reported as one (FR-082).
        source:
          type: string
          description: The configured path, or the generated marker.
        fingerprint_sha256:
          type: string
          description: SHA-256 of the DER, colon-separated hex — what an operator pins.
        subject:
          type: string
        issuer:
          type: string
        dns_names:
          type: array
          items:
            type: string
        ip_addresses:
          type: array
          items:
            type: string
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
    Egress:
      type: object
      description: >-
        The outbound posture (FR-080, FR-081). The proxy appears in the
        only form it has here: without credentials.
      properties:
        proxy:
          type: string
        proxy_authenticated:
          type: boolean
          description: That credentials are configured — never their value (NFR-015).
        extra_roots:
          type: integer
          description: Certificate authorities added on top of the host store.
        exclusive_trust:
          type: boolean
          description: The public root store was dropped.
        summary:
          type: string
          description: The same one-line description the startup log carries.
    Network:
      type: object
      description: The instance's network posture (FR-082, FR-080, FR-081).
      properties:
        tls:
          type: boolean
          description: False on a plain-HTTP listener — stated, never implied.
        certificate:
          $ref: "#/components/schemas/Certificate"
        certificate_file:
          type: string
          description: The configured certificate path (configuration, not a secret).
        key_file:
          type: string
          description: >-
            The configured key path. The PATH is configuration; the key
            itself is exposed by nothing.
        replaceable:
          type: boolean
          description: >-
            Whether PUT /api/v1/network/certificate would be accepted:
            false on the self-signed fallback, which has no configured
            pair to write.
        egress:
          $ref: "#/components/schemas/Egress"
    Problem:
      type: object
      description: >-
        RFC 9457 problem document. The extension members come from the
        single error taxonomy; "type" is the in-instance troubleshooting
        anchor, resolvable offline.
      properties:
        type:
          type: string
          description: In-instance troubleshooting anchor, "/help#<code>".
        title:
          type: string
          description: What happened, in the negotiated language.
        status:
          type: integer
          description: The HTTP status of the response.
        code:
          type: string
          description: The stable taxonomy code ("TBY-REG-003").
        probable_cause:
          type: string
          description: The probable cause, in the negotiated language.
        action:
          type: string
          description: The corrective action, in the negotiated language.
        correlation_id:
          type: string
          description: Run or task identifier for log correlation (FR-090).
      required: [type, title, status, code, probable_cause, action]
    Kind:
      type: string
      description: The five frozen ingredient kinds (never translated).
      enum: [ContainerImage, HelmChart, OCIArtifact, FileSet, Recipe]
    Role:
      type: string
      description: The closed role ladder (ADR-0009).
      enum: [viewer, operator, admin]
    TaskStatus:
      type: string
      description: >-
        Stored task and item statuses. "Done with errors" is a rendering
        of failed plus aggregates, not a stored state.
      enum: [pending, running, done, failed, skipped]
    ContentList:
      type: object
      properties:
        repositories:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              kind:
                $ref: "#/components/schemas/Kind"
              tags:
                type: integer
              sizeBytes:
                type: integer
                description: Logical size in bytes (deduplicated per repository).
        page:
          type: integer
        totalPages:
          type: integer
        total:
          type: integer
    ContentRepo:
      type: object
      properties:
        name:
          type: string
        kind:
          $ref: "#/components/schemas/Kind"
        tags:
          type: array
          items:
            type: object
            properties:
              tag:
                type: string
              digest:
                type: string
              sizeBytes:
                type: integer
              platforms:
                type: integer
                description: Index entries, locally present or not.
              presentPlatforms:
                type: integer
                description: Entries whose manifest is locally held (sparse index, FR-022).
    ContentManifest:
      type: object
      properties:
        repo:
          type: string
        tag:
          type: string
        digest:
          type: string
          description: The pinned original index digest (sparse index, FR-022).
        mediaType:
          type: string
        kind:
          $ref: "#/components/schemas/Kind"
        sizeBytes:
          type: integer
        annotations:
          type: object
          additionalProperties:
            type: string
        platforms:
          type: array
          items:
            type: object
            properties:
              os:
                type: string
              arch:
                type: string
              variant:
                type: string
              digest:
                type: string
              sizeBytes:
                type: integer
              present:
                type: boolean
                description: False for a sparse-index entry absent locally.
    ImportRequest:
      type: object
      required: [reference, platforms]
      properties:
        reference:
          type: string
          description: >-
            The reference to import: registry/repo:tag or @digest, the
            oci:// notation, or an https:// Helm chart-repository URL
            (https://<base>/<chart>[:<version>], FR-024).
        vendorDependencies:
          type: boolean
          default: false
          description: >-
            FR-025 opt-in: embed a chart's missing declared dependencies
            before the artifact lands. Breaks the upstream digest and any
            upstream signature; the substitution is traced on the manifest
            (dev.tobby.vendored/* annotations), in the task report, and in
            the logs. Without it a chart unusable offline is refused
            (TBY-CHT-001).
        platforms:
          type: array
          description: The selected platforms of a prior inspection.
          items:
            type: object
            required: [name, digest]
            properties:
              name:
                type: string
                description: '"os/arch[/variant]", or the reference name.'
              digest:
                type: string
                description: The digest pinned by the inspection.
    InspectReport:
      type: object
      properties:
        reference:
          type: string
        repository:
          type: string
          description: The relocated destination repository.
        tag:
          type: string
        index_digest:
          type: string
        media_type:
          type: string
        kind:
          $ref: "#/components/schemas/Kind"
        multi_arch:
          type: boolean
        platforms:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              os:
                type: string
              arch:
                type: string
              variant:
                type: string
              digest:
                type: string
              size_bytes:
                type: integer
              status:
                type: string
                description: Per-digest status against the local store (FR-026).
                enum: [new, outdated, up-to-date]
    Task:
      type: object
      description: >-
        One task of the persistent queue: the stored schema plus read-time
        aggregates and the principal taxonomy code of a failed task.
      properties:
        id:
          type: string
        run_id:
          type: string
          description: The FR-090 correlation identifier of the run.
        type:
          type: string
          description: The task type ("unit-import" at this milestone).
        reference:
          type: string
        actor:
          type: string
          description: The authenticated identity that created the task.
        status:
          $ref: "#/components/schemas/TaskStatus"
        created:
          type: string
          format: date-time
        started:
          type: string
          format: date-time
        finished:
          type: string
          format: date-time
        resumed:
          type: boolean
          description: True after an instance-restart re-queue (FR-029).
        vendor_dependencies:
          type: boolean
          description: True when the FR-025 vendoring opt-in was requested.
        error:
          $ref: "#/components/schemas/ItemError"
        items:
          type: array
          items:
            $ref: "#/components/schemas/TaskItem"
        chart_dependencies:
          type: array
          description: Helm chart dependency report (FR-024).
          items:
            type: object
            properties:
              name:
                type: string
              version:
                type: string
              repository:
                type: string
              embedded:
                type: boolean
        resolutions:
          type: array
          description: >-
            The resolution report of a synchronization (FR-021), one row
            per recipe entry and per ingredient, plus one promotion row
            per item when a destination is configured.
          items:
            type: object
            properties:
              recipe:
                type: string
                description: '"name@version" once resolved.'
              ingredient:
                type: string
                description: Empty on the recipe entry's own row.
              requested:
                type: string
                description: The version expression as written.
              resolved:
                type: string
                description: The concrete tag it resolved to.
              digest:
                type: string
              status:
                type: string
                description: The FR-026 per-digest status against the LOCAL store.
                enum: [new, outdated, up-to-date]
              effective:
                type: string
                description: >-
                  The substituted endpoint actually contacted, when it
                  differs from the nominal reference (FR-036).
              trust_scope:
                type: string
                description: >-
                  The declared scope that admitted the item when the
                  strict default was relaxed (FR-033).
              destination:
                type: string
                description: >-
                  The fully qualified reference the item was promoted to
                  (FR-035 mapping, FR-065). Absent on an instance that
                  promotes nothing.
              destination_status:
                type: string
                description: >-
                  The FR-026 per-digest status against the DESTINATION,
                  computed before any transfer. Deliberately distinct from
                  "status": content can be local and not yet pushed.
                enum: [new, outdated, up-to-date]
              pushed_bytes:
                type: integer
                description: >-
                  What actually crossed for this item. Zero on an
                  up-to-date item is the FR-028 differential, per row.
        items_total:
          type: integer
        items_done:
          type: integer
        items_failed:
          type: integer
        items_skipped:
          type: integer
        principal_code:
          type: string
          description: >-
            The principal taxonomy code of a failed task, computed by the
            single aggregation rule (taxonomy.Principal).
    TaskItem:
      type: object
      properties:
        name:
          type: string
        digest:
          type: string
        size_bytes:
          type: integer
        status:
          $ref: "#/components/schemas/TaskStatus"
        error:
          $ref: "#/components/schemas/ItemError"
    ItemError:
      type: object
      description: >-
        A persisted failure: taxonomy code plus typed parameters — never a
        localized sentence (ADR-0015), so history re-renders in any
        language.
      properties:
        code:
          type: string
        params:
          type: object
          additionalProperties: true
    RecipeRecord:
      type: object
      description: >-
        One recorded recipe graph entry: the recipe artifact and the
        content it manages. The ingredient list is the reachability set of
        FR-044/FR-045; zone and resolvedAt feed the media manifest
        (FR-054).
      properties:
        name:
          type: string
        version:
          type: string
        cookbookRepo:
          type: string
          description: The relocated repository holding the recipe artifact.
        digest:
          type: string
          description: The pinned digest of the recipe artifact.
        runId:
          type: string
          description: The FR-090 correlation identifier of the recording run.
        zone:
          type: string
        resolvedAt:
          type: string
          format: date-time
        verified:
          type: boolean
          description: >-
            True when the recipe signature was verified against a trust
            root (FR-033).
        trustScope:
          type: string
          description: >-
            The declared relaxed scope that admitted the recipe when
            verified is false — never empty in that case (FR-033: no
            undeclared bypass exists).
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/IngredientRecord"
    IngredientRecord:
      type: object
      description: >-
        One ingredient of a recorded recipe: where it landed locally
        (relocated path, FR-035) and under which pinned digest.
      properties:
        name:
          type: string
        kind:
          $ref: "#/components/schemas/Kind"
        repo:
          type: string
          description: The local relocated repository path (ADR-0013).
        tag:
          type: string
        digest:
          type: string
    Retriever:
      type: object
      description: >-
        The Retriever configuration in effect — read-only, mirror of the
        /admin/retriever screen.
      properties:
        source:
          type: string
          description: >-
            The configured desired-state source (FR-010); empty when not
            configured.
        relaxed_trust_scopes:
          type: array
          description: The declared allowUnsigned trust scopes (FR-033).
          items:
            type: string
        anonymous_filesets:
          type: array
          description: FileSets served without authentication (FR-047).
          items:
            type: string
        destination:
          type: string
          description: >-
            The registry this instance promotes into (FR-013); empty when
            it promotes nothing, which is every mirror-mode instance.
        cookbook:
          type: string
          description: >-
            The destination repository path recipes are propagated to
            (FR-034): "<destination>/<cookbook>/<name>:<version>".
        interval:
          $ref: "#/components/schemas/Interval"
        last_sync:
          $ref: "#/components/schemas/Task"
    Interval:
      type: object
      description: >-
        The FR-013 reconciliation cadence. Absent entirely on an instance
        with no reconciliation loop (mirror mode, FR-014). Durations are
        Go duration strings, the same spelling the configuration file and
        the request body use.
      properties:
        effective:
          type: string
          description: The interval the loop actually runs at.
        configured:
          type: string
          description: >-
            The value from the configuration layers (FR-003) — what
            clearing the override would restore.
        overridden:
          type: boolean
          description: Whether a persisted operator override is in force.
        enabled:
          type: boolean
          description: >-
            False when the effective interval is zero: periodic
            reconciliation off, manual triggering (FR-014) unaffected.
        minimum:
          type: string
          description: The floor a non-zero override may not go below.
    Account:
      type: object
      properties:
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        created:
          type: string
          format: date-time
        last_login:
          type: string
          format: date-time
    Token:
      type: object
      properties:
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        created:
          type: string
          format: date-time
        revoked:
          type: boolean
