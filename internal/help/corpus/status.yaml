# Single source of truth for every status badge on the documentation site.
# Rendered by src/components/StatusTable.astro on:
#   - docs/discover/status        (full table)
#   - docs/security/one-pager     (rows with `security: true`)
# One edit per milestone release keeps the whole site honest.
#
# status: available | partial | upcoming
# milestone: the milestone that delivers (or completes) the feature;
#            omitted when the feature is fully available.
# security: true marks rows shown on the security one-pager.
