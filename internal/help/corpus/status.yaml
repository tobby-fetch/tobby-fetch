    en: Windows workstation for the mirror journey (winget, Scoop)
    fr: Poste Windows pour le parcours miroir (winget, Scoop)
    status: available
    note:
      en: >-
        The mirror journey is validated on a Windows CI runner and the single
        binary is released for it. Both workstation channels are published:
        Scoop — `scoop bucket add tobby https://github.com/tobby-fetch/scoop-bucket`
        — and winget — `winget install tobby-fetch.tobby`, in the community
        index since 2026-09-26. winget can lag a few days behind a release,
        since each version is reviewed in an index maintained by other people.
      fr: >-
        Le parcours miroir est validé sur un runner Windows et le binaire unique
        est publié pour cette plateforme. Les deux canaux poste sont publiés :
        Scoop — `scoop bucket add tobby https://github.com/tobby-fetch/scoop-bucket`
        — et winget — `winget install tobby-fetch.tobby`, dans l'index
        communautaire depuis le 2026-09-26. winget peut avoir quelques jours de
        retard sur une release, chaque version étant relue dans un index
        maintenu par d'autres.

