# Single source of truth for every status badge on the documentation site.
# Rendered by src/components/StatusTable.astro on:
#   - docs/discover/status        (full table)
#   - docs/security/one-pager     (rows with `security: true`)
# One edit per milestone release keeps the whole site honest.
#
# status: available | partial | upcoming
# milestone: the milestone that delivers (or completes) the feature;
#            omitted when the feature is fully available.
# security: true marks rows shown on the security one-pager.
updated: "2026-11-23"
version: "v0.7.0"
features:
  # ── Milestone 1 — Foundations (delivered, v0.1.x) ──────────────────────
  - id: "1.1"
    en: Secure build chain (reproducible, SLSA L3, signed SBOM)
    fr: Chaîne de build sécurisée (reproductible, SLSA L3, SBOM signé)
    status: available
    security: true
  - id: "1.2"
    en: Operable application foundation (layered config, JSON logs, probes, metrics)
    fr: Socle applicatif exploitable (config en couches, logs JSON, sondes, métriques)
    status: available
  - id: "R-09"
    en: End-to-end run identifier
    fr: Identifiant de run de bout en bout
    status: available
    security: true
  - id: "R-12"
    en: Security audit log
    fr: Journal d'audit de sécurité
    status: available
    security: true
    note:
      en: Foundation, authentication, token and media-override events, then scan refusals, session and token expiry, local sign-in under federation and store verification with v0.6.0.
      fr: Socle, événements authentification/tokens et overrides média, puis refus de scan, expiration des sessions et tokens, connexion locale sous fédération et vérification du store en v0.6.0.
  - id: "1.3"
    en: Embedded OCI registry with canonical relocation layout
    fr: Registry OCI embarquée et rangement canonique
    status: available
  - id: "1.4"
    en: Recipe / Retriever format specification (Apache-2.0)
    fr: Spécification du format Recipe / Retriever (Apache-2.0)
    status: available
    note:
      en: Public draft, v1alpha1, separate repository.
      fr: Brouillon public, v1alpha1, dépôt séparé.
  - id: "1.5"
    en: Five-level test pyramid and blocking quality gates
    fr: Pyramide de tests à 5 niveaux et gates bloquantes
    status: available
  - id: "1.6"
    en: "Crucible: disposable replica of the target environment"
    fr: "Crucible : réplique jetable de l'environnement cible"
    status: available

