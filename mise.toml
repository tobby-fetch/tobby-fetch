# Tool versions for Tobby (portable across machines / CI via mise).
# Matches the versions the project is developed and built with.
[tools]
go = "1.27.3"
"aqua:golangci/golangci-lint" = "2.15.0"
node = "26.13.0"
pnpm = "12.18.0"
gitleaks = "8.30.1"

# One-time per clone: activate the versioned git hooks (secret scanning
# on every commit — see .githooks/pre-commit).
#   mise run setup
[tasks.setup]
description = "Activate the repo git hooks (gitleaks secret scan on commit)"
run = "git config core.hooksPath .githooks && echo 'hooks enabled (.githooks)'"

# Scan the whole git history for leaked secrets.
#   mise run secrets-scan
[tasks.secrets-scan]
description = "Scan the full git history for leaked secrets (gitleaks)"
run = "gitleaks git --redact --no-banner ."

# Run the website / documentation locally.
#   mise run doc
# Starts the Astro dev server at http://localhost:4321/tobby-fetch/
[tasks.doc]
description = "Serve the website/documentation locally (Astro dev server)"
dir = "website"
run = "pnpm install --prefer-offline && pnpm dev"

# Quality gates (public feature 1.5) — the same commands CI runs.

[tasks.build]
description = "Build the tobby binary"
run = "go build -trimpath -o bin/tobby ./cmd/tobby"

# The documentation the binary serves offline (R-05, NFR-003) is a
# byte-for-byte copy of website/src/content/docs. Run this after editing a
# page; `mise run help-check` is the same comparison as a gate, and CI runs
# it on every documentation change (.github/workflows/help-corpus.yml).
#   mise run help-sync
[tasks.help-sync]
description = "Refresh the embedded help corpus from the website sources"
run = "go run ./tools/helpsync"

[tasks.help-check]
description = "Fail if the embedded help corpus has drifted from the website"
run = "go run ./tools/helpsync -check"

[tasks.test]
description = "Unit and integration tests (race detector, anti-flaky double run)"
run = "go test -race -count=2 ./..."

# Browser non-regression (R-38): the scenarios that lock the bugs living in
# an attribute the client interprets. Behind the `browser` build tag so it
# never slows `mise run test` down. Chrome is taken from the environment and
# NEVER downloaded (NFR-019) — the suite skips with an explicit message when
# there is none; point TOBBY_E2E_CHROME at the binary if the lookup misses.
[tasks.test-browser]
description = "Browser scenarios (R-38, chromedp — uses the Chrome already installed)"
run = "go test -tags browser -count=2 -timeout 20m ./test/browser/..."

# Identity-provider fixture (milestone 6): a real Keycloak in a container,
# for the OIDC and SAML tests. Needs docker; the image is pulled by the
# digest pinned in test/keycloak/IMAGE and nothing else is downloaded.
# TOBBY_KEYCLOAK_URL attaches to a Keycloak that is already running.
#   mise run test-keycloak
[tasks.test-keycloak]
description = "Keycloak fixture tests (OIDC/SAML IdP in docker, image pinned by digest)"
run = "go test -count=1 -timeout 15m -v ./test/keycloak/..."

[tasks.lint]
description = "Strict lint (golangci-lint, zero suppressions)"
run = "golangci-lint run"

[tasks.coverage]
description = "Per-package coverage floor (NFR-016, >= 70% per internal package)"
run = "sh tools/check-coverage.sh"

# Known-vulnerability gate (ADR-0011): govulncheck reports only the
# vulnerable SYMBOLS the binary actually reaches, so a finding here is a
# call path, not noise. The version is pinned (sumdb-verified by `go run`)
# and tracked by renovate — same policy as every other pinned tool.
[tasks.vuln]
description = "Reachable known vulnerabilities (govulncheck, stdlib included)"
# renovate: datasource=go depName=golang.org/x/vuln
run = "go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./..."
