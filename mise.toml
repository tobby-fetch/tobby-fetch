# Tool versions for Tobby (portable across machines / CI via mise).
# Matches the versions the project is developed and built with.
[tools]
node = "24.18.0"
pnpm = "10.33.2"
gitleaks = "8.30.1"

# One-time per clone: activate the versioned git hooks (secret scanning
# on every commit — see .githooks/pre-commit).
#   mise run setup
[tasks.setup]
description = "Activate the repo git hooks (gitleaks secret scan on commit)"
run = "git config core.hooksPath .githooks && echo 'hooks enabled (.githooks)'"

# Scan the whole git history for leaked secrets.
#   mise run secrets-scan
[tasks.secrets-scan]
description = "Scan the full git history for leaked secrets (gitleaks)"
run = "gitleaks git --redact --no-banner ."

# Run the website / documentation locally.
#   mise run doc
# Starts the Astro dev server at http://localhost:4321/tobby-fetch/
[tasks.doc]
description = "Serve the website/documentation locally (Astro dev server)"
dir = "website"
run = "pnpm install --prefer-offline && pnpm dev"
