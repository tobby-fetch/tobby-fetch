#
# winget default-locale manifest for `tobby-fetch.tobby` — see
# `tobby-fetch.tobby.yaml` for why that identifier was chosen. en-US is the
# locale the version manifest names as `DefaultLocale`, which is why this
# file's `ManifestType` is `defaultLocale` and not `locale`: winget requires
# the default locale to be complete, and treats the additional `locale`
# manifests as overlays on top of it. Only this one is published, because a
# translation nobody maintains drifts from the English text and then
# misdescribes the product in the index.
#
# Every string below is taken verbatim from packaging/nfpm/nfpm.yaml, which
# is the single source of the vendor, homepage, licence and description used
# by the Linux packages. Two channels describing the same binary in two
# slightly different ways is how a product ends up looking like two
# products, so nothing here is a fresh wording.
# yaml-language-server: $schema=https://aka.ms/winget-manifest.defaultLocale.1.6.0.schema.json

